pr_title_format: '{type}({scope}): {title}'
repos:
  arcade:
    path: .
    type: orchestrator
    # Gitflow: `develop` is the integration branch pf cuts feature branches from
    # and targets PRs at (pf/git/create_branches.py, and base_ref = origin/develop
    # at pf/git/repos.py). `main` stays the release branch — the deploy workflow
    # fires on `<app>-vX.Y.Z` tags, independent of branch.
    default_branch: develop
    # MUST be the literal "gitflow" — pf's branch-protection hook compares against
    # that exact string (pf/hooks/branch_protection.py::_get_protected_branches).
    # Under gitflow the hook PROTECTS this repo's default_branch (develop), so
    # direct commits go through feature branches + PRs. A typo or "trunk-based"
    # here reopens direct commits to develop.
    branch_strategy: gitflow
    description: 'The arcade: a plugin host for browser-based arcade-game clones.
      Games live in plugins/<id>/, shared code in src/shared/, the lobby at the
      root of the single origin. One repo, one origin, per-game releases by tag.'
    language: typescript
    framework: vite
    dev_command: just serve
    # `<id>` is a PLACEHOLDER, not a literal: substitute an app id (a plugins/
    # directory name, or `lobby`). There is no whole-cabinet build command —
    # one origin does not mean one build. `just build-all` builds every app.
    build_command: node scripts/build-app.mjs <id>
    test_command: npx vitest run
