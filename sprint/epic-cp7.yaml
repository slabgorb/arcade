stories:
  - id: cp7-1
    title: The spider points readout is mirrored — the picture byte's flip bits are dropped at bake
    description: |-
      THE PLAYTEST REPORT WAS "the spider score readout is backwards (the text is backwards)", AND IT IS NOT TEXT. The 300/600/900 that appears where a shot spider died is a single 8x16 motion-object SPRITE whose entire bitmap is the three digits — there is no string, no glyph loop and no digit ordering anywhere on the path. Do not go looking for a reversed array; the digits are emitted in the right order and the glyph columns are in the right order. THE WHOLE SPRITE IS HORIZONTALLY MIRRORED ON SCREEN.

      ROOT CAUSE, MEASURED AT FILING BY DECODING THE ACTUAL ROM BYTES: the motion-object picture byte's hardware FLIP BITS (6 and 7) are dropped at atlas bake time. CENDE4.MAC documents them by name — CKC0 :239 "VALUE THAT FLIPS AND TURNS PICTURES IN COCKTAIL VERSION" and CK40 :248 "USED FOR FLIPPING PICTURES UPSIDE DOWN IN COCKTAIL VERSION" — which is precisely why BUGMV EORs BUGP with CK40 at CENTI4.MAC:308, :312 and :432 and ANTMV EORs ANTP with CKC0 at :54. In an upright cabinet CLEAR zeroes CKF8/CKC0/CK40 (CENTI4.MAC:745-748) so those EORs are the identity — BUT THE BITS ALREADY BAKED INTO THE CONSTANT ARE NOT. All three PTS codes carry bit 7 set: 0xB6 = 1011 0110, 0xB7 = 1011 0111, 0xB8 = 1011 1000. src/core/pictures.ts:317-324 states the decode as offset = ((pic & 1) << 10) | (((pic >> 1) & 0x3F) << 4), which consumes bits 1-6 as ADDRESS and silently discards bit 7. Bit 7 is not address. It is the flip.

      WHY ONLY THE POINTS SPRITES SHOW IT, which is the fact that makes this a one-sprite bug rather than a whole-renderer bug. CORRECTED AT SETUP (cp7-1, 2026-08-03) — the filed reason was wrong and the conclusion survives anyway. The filing said "every other picture code the game actually draws has bits 6-7 clear — BUG0-7 = 0x14-0x1B, ANT = 0x1C-0x1F, SCORP = 0x30-0x33, segments = 0x00-0x0F". That is true of BUG, ANT and SCORP but FALSE of the segments: src/core/centipede.ts:63-71 has CENT_BODY_PIC = 0x42 with BODY_BIT = 0x40 (bit 6 SET on every body segment) and DEAD_BIT = 0x80 (bit 7), which CENDE4.MAC:129-137 states outright — "D6=0 FOR HEAD", "D5=1 FOR POISONED CENTIPEDE HEAD, D7=1 FOR NO OBJECT". The segments are exempt by CONTROL FLOW, not by clear bits: CENIR4.MAC:347-351 branches on the slot index (CPX I,NCENT / BCS 33$) and only then does AND I,3F and AND I,0F, stripping bits 5-7 for centipede slots alone. Our render.ts:70-72 segmentStamp(pic & 0x0F) already mirrors that mask, which is why nothing is visibly wrong there. Do not print a body segment's pic expecting bits 6-7 clear. The explosions (0xFA-0xFF) have BOTH bits set, i.e. a 180 degree turn, and are too amorphous for anyone to have noticed.

      THE VISIBLE CONSEQUENCE WAS CONFIRMED, NOT INFERRED. Decoding THREE at 0x1B0 (CENPIC.MAC:47) through the CURRENT bake renders as "0 0 backwards-3" — the exact horizontal mirror of 300. Applying the ROM-space row reversal that bit 7 asks for, before the ROT270, yields correctly-handed 300, 600 and 900. SIX currently reads as a mirrored 6 in the same way.

      THE FIX HAS A HARD CONSTRAINT AND GETTING IT WRONG IS THE OBVIOUS TRAP. src/shell/atlas.ts:38-48 orientForScreen IS CORRECT and must not be edited. It was verified at filing against the real picture ROMs (reference/atari-source/centipede/revision.v2/136001.201 and .202): its CCW/ROT270 mapping out[i][j] = grid[j][C-1-i] produces correctly-handed upright glyphs for CHAR_E, CHAR_R, DIGIT_3, DIGIT_7 and an upward-pointing GUN, while the clockwise alternative produces mirrored and upside-down output. tests/atlas-orientation.test.ts pins it five separate ways (:74-83 a hand-derived DIGIT_7 golden, :86-88 equality, :95-107 CCW-not-CW, :109-124 the true-90-degree round trip, :126-139 a 2x3 axis-swap probe) and ALL FIVE GO RED if you touch the rotation. THE FIX IS A PER-PICTURE FLIP LAYERED ON TOP OF THE ROTATION, NOT A CHANGE TO IT — either bake the affected stamps mirrored, or carry flipX/flipY alongside the stamp name from spiderStamp and apply it at the blit.

      ONE MORE TRAP ON THE BLIT ROUTE: tests/atlas-orientation.test.ts:150-155 forbids render.ts from calling .rotate(, setTransform or .transform(. It does not currently ban ctx.scale, but the intent of that guard is plainly "orientation is decided in the bake, not at draw time". If the chosen fix reaches for ctx.scale(-1,1), the guard must be revisited DELIBERATELY and the reason written down, not slipped past on a technicality.

      SITES: src/shell/atlas.ts:38-48 and :101-113 (buildAtlas bakes one orientation per stamp name and has no notion of a per-picture flip); src/shell/render.ts:42-47 SPIDER_PTS_STAMPS, :78-83 spiderStamp and :227-231 the blit — note that mapping a picture CODE to a stamp NAME is exactly where bits 6-7 are thrown away; src/core/pictures.ts:317-324 is the COMMENT that codifies the lossy formula and may be corrected in place, but the module's data is SHA-256 byte-gated by tests/pictures.test.ts and its bytes stay untouched.

      ALSO FILE, DO NOT FIX: the same bit-6/7 confusion means the pictures.ts offset formula disagrees with hardware for ANY code with bit 6 set — explosion 0xFF decodes to 0x7F0 by the formula but 0x5F0 on hardware. render.ts:70-72 sidesteps it for explosions by mapping through segmentStamp(pic & 0x0F) rather than the formula, so the explosion pool may be drawing the wrong sprites. Nobody has looked. You will be the closest anyone has been to this code; file what you find as its own story and stay out of it here.

      RESOLVED 2026-08-04, and the "ALSO FILE, DO NOT FIX" paragraph above is SUPERSEDED - it was DELIVERED in this story on the user ruling to stop spawning follow-ups. Read it for history, not for instruction, and note its reasoning was wrong twice over: the offset formula is comment-only and never selects a sprite, and render.ts was not "sidestepping" the formula but skipping the AND I,0F entirely, because CENIR4.MAC:352-353 branches away from it for an explosion. The explosions really were drawing the wrong sprites - the dedicated EXPLD0-5 stamps were missing from STAMPS. See the amended AC-6 and AC-8.
