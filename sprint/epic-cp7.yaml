  - id: cp7-4
    title: The flea's 0.6s sample wraps inside a 2s drop — the sweep is shorter than the descent
    description: |-
      THE PLAYTEST REPORT WAS "flea sound repeats — should be one continuous as the drop happens". THE DISPATCH IS NOT THE BUG, AND CHECKING IT FIRST WILL WASTE A DAY. It was traced end to end at filing and it is correct: the core emits EDGES ONLY — loopEdges (src/core/sim.ts:390-393) returns an event only when was !== now, and fleaAudible (src/core/sim.ts:426-429) is monotone over a descent, so exactly ONE flea-start and ONE flea-stop per drop. audio-dispatch.ts:38-42 and :105-115 map the -start/-stop suffixes to startLoop/stopLoop, audio.ts:148-149 routes both to fleaLoop on its own channel voice-flea (:120, no voice stealing), and src/shared/audio.ts:235-292 sets source.loop = true on a real sustained node. Every layer does what it should.

      THE BUG IS THE ASSET. tools/pokey-bake/bake-sfx.mjs:216-231 bakes fleaLoop at seconds: 0.6 as a 16-step sweep of ANTV from 0xF8 down to 0x08 in steps of 0x10. A flea descent runs flea.v from 0xF8 to 4 at dv = 2 or 3 per frame (src/core/flea.ts:70-71, :168, :281) — 122 frames, about 2.03 seconds normally, 82 frames or about 1.37 seconds after 60K. A 0.6 second sample under source.loop = true inside a 2 second event restarts two to three times. THAT IS THE REPEAT THE PLAYER HEARD: not a retrigger, a wrap.

      WHAT THE ROM ACTUALLY HAS, AND IT IS NOT A SAMPLE. There is no FREQ or CONT table and no CHANn countdown for the flea at all. CENTI4.MAC:2409-2415 recomputes the frequency from the flea's own Y every pass of SOUNDS: "LDA ANTV / EOR CKFE / LSR / EOR I,0FF / ORA I,80 ;USE LOWER FREQUENCIES / STA AUDF1 / LDA I,0A4" — a constant control byte 0xA4 and a frequency that is a function of position. It is CONTINUOUS BY CONSTRUCTION, one unbroken falling glide lasting exactly as long as the flea is on screen, and it cannot wrap because there is nothing to wrap. Contrast the cues the ROM DOES say repeat, and note it says so out loud in each case: CONT1 ";MUST BE REPEATED" (:2458, the march) and CONT3 ";WELL REPEAT UNTIL TURNED OFF" (:2462, the spider), plus ";CONTINOUS LOOP" for the scorpion at :2388. The flea carries none of those comments because it is a different mechanism.

      THIS WAS PREDICTED IN WRITING AND NOT ACTED ON, which is the part worth reading before choosing a fix. docs/rom-study/sound.md:89 already records fleaLoop as "ROM (computed) / no freq table / no cont table / every pass / unbounded", :139-150 is the section, and :339-341 says "continuous by construction" while :385-386 says "fleaLoop is a sweep, not a tone. A single fixed sample is a stand-in for it and must say so". sound.fixture.json's cues.fleaLoop carries lengthFrames: null, loop: true, loopCite CENTI4.MAC:2409 — and a cp62Decision that names BOTH options: "Bake a descending sweep across the ANTV range and say so, or drive playbackRate from the flea's position at the shell — the latter is faithful but is a wiring change beyond a baker story." cp6-2 took the first option and then baked it at 0.6 seconds, which is shorter than the event. A RECORDED DECISION THAT WAS NOT ACTED ON IS INDISTINGUISHABLE FROM AN UNRECORDED ONE.

      THE STORY MUST CHOOSE BETWEEN THE TWO PATHS AND SAY WHY IN PROSE. (A) ASSET ONLY: lengthen seconds to cover the real descent, about 2.03s at dv=2, and raise the sweep resolution to step ANTV by the actual dv over 0xF8 to 0x04 so ONE playthrough spans a whole drop. Cheap, no wiring, but it is still a fixed-length stand-in and it is WRONG FOR THE FAST DESCENT — the post-60K flea drops in 1.37s, so a 2.03s sample gets cut off rather than wrapping. Say that out loud if you pick it. (B) FAITHFUL: add a rate control to src/shared/audio.ts near startLoop (:300) that sets playbackRate on the live node, and drive it per frame from flea.v. Note the seam problem this runs into: src/core/events.ts:83-93 is explicitly PAYLOAD-FREE, so the flea's position has to reach the shell either as a new payload (a contract change) or as a shell read of sim state at audio-dispatch.ts:62-63 / main.ts:203. There is NO playbackRate or detune anywhere in src/shared/audio.ts or centipede's shell today, so (B) is genuinely new surface.

      TESTS AND THEIR CONSTRAINTS, MEASURED AT FILING. tools/pokey-bake/bake-sfx.test.mjs:390-414 requires the flea stand-in to use CKFE with AUDF rising monotonically (pitch falling), and :628-664 asserts the baked file's second half is at least 5 percent lower in pitch — A LONGER OR DENSER SWEEP MUST PRESERVE BOTH. :536-552 pins durations to lengthSeconds only for TRANSCRIBED cues and :557-566 only requires a stand-in to exceed 0.01s, so NOTHING TODAY GUARDS THE FLEA'S LENGTH — that absence is why 0.6 shipped, and closing it is part of the deliverable. :461-479 caps stand-in volume at AUDC low nibble <= 4, which 0xA4 already satisfies. tests/audit/sound-dossier.test.ts:488-513 pins the manifest filename flea_move.wav and channel voice-flea — DO NOT RENAME THE FILE. tests/audio-dispatch.test.ts:566-600 and :602-620, tests/audio-events.test.ts:194-200 and tests/voice0-contention.test.ts:589-599 all stay green under either path.

      THE ACCEPTANCE TEST INCLUDES EARS. cp6-2 established the rule for this game and it holds here: a decodable wav of the wrong length passes every mechanical check in this repo. The samples are served from arcade-assets.slabgorb.com/centipede/sfx/ and CI never touches that bucket, so a re-bake is not shipped until just deploy-assets has been RUN and the flea has been heard dropping.
    points: 2
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - One flea descent produces one unbroken sound with no audible restart, and the sample's length is derived from the descent's own frame count (0xF8 to 4 at dv, over FRAME_HZ) rather than chosen by ear.
      - The story picks the asset-only or the playbackRate path, states which and why in prose, and if asset-only, says out loud that the post-60K descent (82 frames, ~1.37s) is CUT OFF rather than wrapped — the remaining inaccuracy is disclosed, not hidden behind a fixed repeat.
      - A guard now pins the flea sample's duration against the descent length; the story notes that nothing guarded it before (bake-sfx.test.mjs:536-552 covers transcribed cues only, :557-566 only requires > 0.01s) and that this absence is why 0.6s shipped.
      - bake-sfx.test.mjs:390-414 (CKFE, AUDF monotonically rising) and :628-664 (second half >= 5 percent lower in pitch) stay green — a longer or denser sweep preserves both.
      - The manifest filename flea_move.wav and channel voice-flea are unchanged (tests/audit/sound-dossier.test.ts:488-513), and the core edge contract is untouched — no per-frame retrigger is introduced to solve a length problem.
      - just deploy-assets has been RUN, the re-baked flea returns a live 200 under arcade-assets.slabgorb.com/centipede/sfx/ with the status pasted in, and the flea has been HEARD dropping in a live run — CI never touches that bucket and a green suite is explicitly not sufficient.
      - The dossier's cp62Decision for fleaLoop is updated to record which option was taken, so the next reader finds a decision that was acted on rather than one that was written and left.
