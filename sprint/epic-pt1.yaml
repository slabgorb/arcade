id: pt1
type: epic
title: 'Playtest bug sweep 2026-08-19: fleet-wide bugs observed in visual playtests (millipede, star-wars, tempest, defender/lobby, missile-command, joust, pac-man)'
description: User playtest 2026-08-19 surfaced 17 observations across seven games plus the lobby. Each observation filed as its own story (the jt9 file-by-surface habit). Mix of sim bugs (joust troll/egg/lava-AI, millipede DDT dup + spawn ramp), projection/display (star-wars), input (missile-command mouse, star-wars mouse-start), attract/lobby UX (tempest attract demo, defender-lobby attract hookup, key labels, difficulty previews), and one verify-against-ROM check (pac-man fruit ladder).
priority: p2
status: backlog
repos: arcade
stories:
  - id: pt1-1
    title: 'millipede: unexploded DDT pills duplicate as the playfield shifts down — fake copies trail down the screen, only one is real'
    description: "Playtest 2026-08-19: as the playfield scrolls/moves down, any unexploded DDT pill is repeated with a fake copy each shift, leaving a column of phantom pills; only one is interactable/real. Likely the pill's position isn't being remapped on the playfield shift, or the render draws stale rows."
    points: 3
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
    type: bug
  - id: pt1-2
    title: 'millipede: initial-wave spawn ramp not wired — verify early-game creature spawn tables against the ROM, escalation starts too fast'
    description: "Playtest 2026-08-19: everything escalates quickly from the first wave; feels like the difficulty/spawn ramp-up (which creatures may spawn at which level/score thresholds) exists in the ROM but isn't wired. Audit the spawn gating for beetles/bees/dragonflies/etc. against the ROM tables and pin with cited tests."
    points: 3
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
    type: bug
  - id: pt1-3
    title: 'star-wars: surface-run projection looks wrong — elements render very far from the player'
    description: 'Playtest 2026-08-19: during the Death Star surface run, geometry (towers/trench elements) appears much too distant from the player. Suspect projection or z-scale/near-plane issue specific to the surface phase. Verify against reference footage/ROM math.'
    points: 3
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
    type: bug
  - id: pt1-4
    title: 'star-wars: fix the screen size to a fixed resolution to avoid display problems'
    description: 'Playtest 2026-08-19: make the star-wars canvas a fixed size rather than tracking the window, to avoid display problems (projection/scaling artifacts). Pair with pt1-3 — a fixed logical resolution may be prerequisite to pinning the projection.'
    points: 2
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
    type: bug
  - id: pt1-5
    title: "tempest: attract mode needs a 'play example' (auto-play demo) instead of just the wordmark"
    description: "Playtest 2026-08-19: tempest's attract feature only shows the wordmark. Add an attract gameplay demo (self-playing example) like the joust attract demo (jt13-13 demoInput pattern). Verify against the ROM attract sequence."
    points: 5
    priority: p1
    status: backlog
