  - id: pt1-17
    title: 'pac-man: peach level followed by another peach level — verify the fruit sequence against the ROM table'
    description: "Playtest 2026-08-19: after the peach level comes another peach level — suspicious to the eye, but the AUTHENTIC fruit ladder doubles most fruits (cherry, strawberry, peach, peach, apple, apple, grapes, grapes, galaxian, galaxian, bell, bell, key…). Verify our fruit table against pacman.asm's fruit/level table and cite it; if it matches the ROM, close as working-as-intended with the citation as evidence."
