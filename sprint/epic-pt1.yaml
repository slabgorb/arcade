  - id: pt1-25
    title: 'defender: player-death, smart-bomb and hyperspace have no on-screen effect — the ADR-0005 safe-variant policy layer is built but never called'
    description: |-
      Root cause R2 from the 2026-08-20 render audit, ruled by ADR-0007 decision 2. The ADR-0005 effect-presentation policy in core/effects.ts (classify + the fade/freeze/particle safe variants) has ZERO call sites outside comments. So killPlayer (sim.ts:478) only plays a sound and drops the men count (its own comment calls it a df6-1 placeholder) with no explosion or respawn blink; the smart-bomb clears the field with per-enemy explosions but no screen-level flash; hyperspace (sim.ts:515) teleports instantly with no vanish/reappear; the terrain-blast particle variant is likewise uncalled.
      Fix: spawn an effect through the existing effects.ts bank on player death, smart-bomb fire and hyperspace, let classify() pick the seizure-safe presentation, and surface/blit it in scene.ts. The smart-bomb whole-page invert (COM PCRAM, DEFA7.SRC:3199) renders as the ADR-0005 bounded non-strobing wash, NOT a real palette inversion. Log the strobe substitution as a Design Deviation citing ADR-0005 in each consuming story, as that ADR requires.
    points: 5
