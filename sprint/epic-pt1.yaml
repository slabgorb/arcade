  - id: pt1-21
    title: 'star-wars: surface run is one dense pass — restore the ROM staged multi-pass tower reveal'
    description: |-
      ROM-confirmed fidelity divergence in the Death Star surface TRAVERSAL (distinct from pt1-3, which fixed the projection scale). Our clone (sim.ts mazeField/stepSurface) lays the ENTIRE wave maze at once and scrolls it past in ONE accelerating pass (~5s); the awakening seq (turret.seq) gates only FIRING (sim.ts:1138), not presence. The arcade does a STAGED MULTI-PASS reveal, verified against the 1983 source:

      - The ship LAPS the same $1000..$8000-deep maze ~5 times: forward pos M$TX is a wrapping 16-bit accumulator; each $8000 wrap does INC GD.SEQ (WSMAIN.MAC:2537-2547).
      - 'The phase ends on a LAP COUNT, not a timer: LDA GD.SEQ / CMPA #5 / IFHS -> clear towers, then one blanked pass -> set PHASE to trench (WSMAIN.MAC:1678-1689). PH.TIM is music/pacing only.'
      - The awakening byte (.C / TGD$SQ) gates PRESENCE, not just firing: LDA GD.SEQ / CMPA TGD$SQ(X) / LBLT 90$ at the maze loop top (WSGRND.MAC:738-742) SKIPS the object entirely (no draw, no gun) when GD.SEQ < .C; GDVIEW+GDGUN both sit downstream (WSGRND.MAC:771-781). DIFF splits towers across sequences 7-0/9-1/7-2/5-3 (WSGRND.MAC:146) — only ~1/3 exist on pass 0.
      - Speed confirmed: seed $100, +1/frame, cap $400 (WSMAIN.MAC:1621-1665); one $8000 sweep ~6.2s seed / ~1.6s cap at 20.5Hz.

      Net: our surface run is ~5x too short and too dense (user playtest 2026-08-20: "towers too close together / brief encounter"). Fix: gate tower PRESENCE on gdSeq (not just firing), and re-fly the maze across ~5 laps as gdSeq increments, ending at GD.SEQ>=5. Structural change to stepSurface + its pacing/traversal tests. Full ROM audit is summarized in the pt1-3 session Delivery Findings.
    points: 5
    priority: p2
    status: done
    started: '2026-08-20'
    repos: arcade
    workflow: tdd
    completed: '2026-08-20'
    type: bug
  - id: pt1-22
    title: 'defender: revive the live palette — the laser, bombs, TIEs, pods and the mutant shimmer render black because colour RAM is frozen at boot defaults'
    description: |-
      Root cause R1 from the 2026-08-20 gameplay render audit (plugins/defender/docs/2026-08-20-defender-gameplay-render-audit.md), ruled by ADR-0007. shell/render.ts:41 resolves CRAM ONCE at module load from DEFAULT_PCRAM and decodes every frame through it; core carries no live PCRAM shadow and writes no colour registers. So palette index 1 (LASER) and indices A-F stay 0x00 = black forever. The player laser is drawn correctly every frame in pure black on black (scene.ts:114, palette.ts:25). Williams copies PCRAM into hardware colour RAM every frame (DEFA7.SRC:1968-1980) and mutates the shadow at runtime to animate registers.
      Fix (ADR-0007 decision 1): carry the 16-byte PCRAM shadow as live SimState (readonly pcram), add pure per-tick colour cyclers (laser index 1, the A-F bomb/monochrome/TIE cyclers, the mutant shimmer) with ROM-cited timing/colour tables, and have render.ts decode through the live shadow each frame instead of the module-load cache. Purity boundary unchanged (core hands indices + palette bytes; shell invents no colour). ADR-0005: the cyclers are localized/small-area and permitted, but no cycler may drive a >3 Hz strobe over a large area; assertNoFullFrameStrobe stays the guard.
      PREREQUISITE story: the black-sprite half of pt1-23 and pt1-25's smart-bomb wash depend on this. Land it first.
    points: 8
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
    type: bug
  - id: pt1-23
    title: 'defender: five of seven enemy types are never drawn — mutants, baiters, bombers, pods, swarmers and dropped bombs attack you invisibly'
    description: |-
      Highest-impact defect from the 2026-08-20 render audit. composeFrame in scene.ts blits only state.landers and state.humanoids; the other banks (mutants, baiters/UFOs, bombers/TIEs, pods, swarmers, bombs) are live in SimState (sim.ts:212-217), scheduler-driven, and fully collidable (enemyObjects adds every bank, sim.ts:722-727) but drawn nowhere. They only blink in for one frame at spawn (materialize effect) and death (explosion); for their whole roaming/shooting life they are invisible. Collision already uses the same projection as the would-be render (toScreenCol is projectWorldX, sim.ts:626), so positions are correct — the defect is purely a missing blit loop.
      Fix: add a composeFrame blit loop over the five (six with bombs) banks, projecting each through projectWorldX like landers. Sprite bytes for baiter (UFOP1) and swarmer (SWPIC1) are non-black and render immediately; mutant (SCZP1), bomber (TIEP1), pod (PRBP1) and bomb (BMBP1) use indices A-F and additionally need pt1-22's live palette to be visible.
      Depends on pt1-22 for the TIE/pod/bomb/mutant colours; the blit loop itself can be built in parallel.
    points: 5
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
    type: bug
