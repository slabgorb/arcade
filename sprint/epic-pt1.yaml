  - id: pt1-16
    title: 'joust: enemies are too vulnerable to lava — a screen can be cleared by waiting for them to suicide'
    description: 'Playtest 2026-08-19: enemy riders die to lava at a rate that lets the player clear a wave by simply waiting. In the arcade, enemy AI avoids the lava (and the troll grab is survivable for AI); verify enemy flap/altitude AI and lava lethality against the ROM behavior — enemies should rarely if ever suicide.'
