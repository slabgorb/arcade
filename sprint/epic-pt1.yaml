    title: 'joust: the troll should not be able to pull the player through a platform'
    description: "Playtest 2026-08-19: when the lava troll grabs the player, it can drag them through solid platform geometry. Collision should still resolve against platforms during a troll grab; check the ROM's troll-pull behavior."
