  - id: pt1-6
    title: "defender/lobby: hook the lobby up to defender's attract feature"
    description: "Playtest 2026-08-19: defender has an attract feature that the lobby isn't wired to. Hook the lobby tile/idle flow to trigger/display it, consistent with how other games integrate attract."
    points: 3
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
