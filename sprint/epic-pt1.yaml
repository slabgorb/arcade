  - id: pt1-15
    title: 'joust: egg-hatching spawns the rider mid-air instead of waiting for a buzzard to descend and collect it'
    description: 'Playtest 2026-08-19: when an egg hatches, the new enemy appears in the air immediately. Authentic behavior: the egg hatches into a rider standing on the ground/platform, then a buzzard flies down to pick the rider up before it becomes a threat. Verify the hatch → wait → buzzard-pickup sequence against the ROM.'
