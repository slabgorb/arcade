    title: "lobby: game tiles should identify the actual keys, not just say 'keyboard'"
    description: "Playtest 2026-08-19 (defender surfaced it, applies to lobby tiles generally): the control hint on a lobby tile just says 'keyboard' — display the real bindings (arrows/space/zxc/etc.) per game, sourced from each plugin's manifest."
