  - id: pt1-19
    title: 'defender: landers spawn and fall in a synchronized Space-Invaders row instead of roaming independently'
    description: >-
      Playtest 2026-08-19: all landers appear in a neat row at the same altitude and descend in
      lockstep. ROOT CAUSE (confirmed in code): the whole wave spawns synchronously (sim.ts:330
      `for i<n spawnEnemyAt(...)`), every lander at LANDER_SPAWN_Y=YMIN+2 (same row), and every lander
      descends at the SAME `DESCEND_STEP=2`/tick — an admitted df4-3 PLACEHOLDER (landers.ts header:
      the authentic per-lander velocity LNDYV is wave-table RAM that was deferred and never wired).
      Same start row + same speed + same frame = a falling row, not Defender's spread-out, independently
      roaming/diving attackers. FIX: give each lander its ROM wave-table descent velocity (LNDYV,
      PHR6.SRC:393) and stagger spawn altitude/entry, and add the LANDS0 roam-before-dive behaviour so
      they patrol and pick targets individually. Cite LNDYV/LANDST/LANDS0; pin with tests that assert
      the landers do NOT share a single Y/velocity after N ticks.
    points: 5
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
    type: bug
