  - id: pt1-9
    title: 'tempest: difficulty select should preview the board layout per level, and starting higher should pay a bonus'
    description: 'Playtest 2026-08-19: the difficulty/level-select should show a preview of the board (web) layout for each starting level, and a score bonus should be awarded for starting at a higher level. Both are authentic Tempest behaviors (SuperZapper-era level select) — check the references, ROM and MAME before implementing; cite the bonus values.'
