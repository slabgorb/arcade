title: 'Millipede — the menagerie + DDT (phase 4b): one cited reducer per critter, and the DDT bomb'
description: "Fourth Millipede epic, phase 4b. The bestiary, mirroring centipede cp3 'the menagerie' — one pure cited reducer per critter, the .SBTTL map IS the story list. Millipede's roster is richer than centipede's: beetle (BEETL MILLI.MAC:243), spider (SPDMV MILLI.MAC:2295), dragonfly (FLYMV MILLI.MAC:1004), mosquito (MOSQT MILLI.MAC:1324), earwig (EARWIG MILLI.MAC:672), inchworm (WRMMV MILLI.MAC:2559), bee (BEEMV MILLI.MAC:56). Plus DDT: DDTS add bombs (MLSUB.MAC:420), BOMBS player-bombing by bee/mosquito/dragonfly (MILLI.MAC:446), explosion clouds (MLDEF.MAC:202). Per-critter scoring is pinned to the source PTS table (16 entries, MLDEF.MAC:398 'NUMBER OF POINTS FOR KILLING THIS CRITTER'), NOT the missing MILLI.DOC (ml1 OQ-2). Difficulty per-critter from the DIP equates (MLDEF.MAC:88 D1=BEETLE, :91 D6=SPIDER). Pure src/core reducers, TDD against ROM values, one subsystem per file. Dependency: ml4 -> ml3 (needs the field + player + collision). Every constant carries a citations.test.ts-gated claim. Design: docs/superpowers/specs/2026-08-11-millipede-cabinet-roadmap-and-ml1-design.md (section 4, ml4). OUT OF SCOPE: waves/scoring-outer-loop/highscore (ml5), sound (ml6), attract/wiring/HUD (ml7)."
