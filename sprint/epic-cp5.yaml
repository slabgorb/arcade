id: cp5
type: epic
title: Centipede audio — the sound subsystem centipede shipped without
description: "centipede has no audio module at all: no src/shell/audio.ts, no core/events.ts event channel, no dispatch, and nothing under the arcade-assets centipede prefix. The game has been playable and silent since it shipped. The gap is deliberate and already named in the source — src/core/bonus.ts:32 records that CENTI4.MAC:1994-1995 (LDA I,17. / STA CHAN4, 'BONUS LIFE SOUND') is 'DEFERRED to cp5 with the rest of the audio, and deliberately not stubbed — an empty hook would be dead code pretending to be a seam', which is why this epic carries the id cp5. Three sibling games have already walked this path and are the reference, not a re-derivation: tempest, star-wars and asteroids each define a SOUNDS manifest (logical name to baked filename), a CHANNELS map giving each cue its own POKEY-style voice-stealing channel, a DEFAULT_BASE_URL under arcade-assets.slabgorb.com, a pure core/events.ts union the sim emits as DATA, and a shell/audio-dispatch.ts switch with a never exhaustiveness guard so adding an event kind without a cue is a compile error. All three consume the shared audio engine. POST-MIGRATION (2026-07-30): that engine is no longer a package — it is src/shared/audio.ts in this repo, imported as @shared/audio through an alias declared in vite.config.ts, vitest.config.ts and tsconfig.json. There is no subpath export to add, no pin to bump and no dist/ to build; centipede already imports @shared/rng, @shared/highscore, @shared/loop and @shared/name-entry the same way. THE ACCEPTANCE TEST FOR ANY ASSET STORY IN THIS EPIC IS A LIVE 200, NOT A GREEN VITEST. The shared engine degrades silently at every failure path by design — no WebAudio, blocked autoplay, failed fetch, undecodable sample all leave the game quiet and never throw — so a 404 is indistinguishable from working code. star-wars music was wired and silently absent in production for months for exactly this reason. There is no automated upload path for the arcade-assets bucket: CI deploys each app's dist only, so samples are placed by hand with wrangler r2 object put --remote and must be curl-verified."
priority: p2
status: backlog
repos: centipede
stories:
  - id: cp5-1
    title: Centipede audio seam — core event channel, shell dispatch and the SOUNDS manifest, no samples yet
    description: "The seam only — this story ships NO baked samples and NO R2 uploads, so it cannot be blocked by asset production. It builds the three pieces the three sibling games share, so every later cp5 story is a matter of naming a cue and baking a file. Piece one: src/core/events.ts, a discriminated union of the gameplay moments the sim already produces, emitted as DATA on the step result and never as callbacks, so the core stays pure and a fixed seed replays an identical event stream. Centipede's sim already computes every moment worth a cue — the player shot, a segment or mushroom hit, a segment reaching the bottom, the spider, flea and scorpion arriving and leaving, the player exploding, the wave clearing, and the bonus life whose sound src/core/bonus.ts:32 has been holding a place for since cp4-4. Piece two: src/shell/audio.ts with the SOUNDS manifest (logical name to filename) and the CHANNELS map giving each cue its own voice-stealing channel, pointed at the centipede prefix under arcade-assets.slabgorb.com. Piece three: src/shell/audio-dispatch.ts, the event-to-cue switch carrying a never exhaustiveness guard so a future event kind added without a cue is a COMPILE error, not a silent omission. centipede already imports rng, highscore, loop and name-entry from @shared; audio is one more import line — the 2026-07-30 monorepo collapse removed the package boundary, so there is no subpath to export, no version pin and no bump ceremony at all. The sustained cues matter for the design: the centipede's marching tick and the spider's presence are loops, not one-shots, so the channel map must express start and stop, not only play."
    points: 3
    priority: p2
    status: backlog
    repos: centipede
    workflow: tdd
    acceptance_criteria:
      - core/events.ts defines the event union and the sim emits it as data; the core purity scanner still passes, so no DOM, clock or randomness entered the core.
      - A fixed seed and input stream replay an identical event stream — the event channel is deterministic and a test pins that.
      - shell/audio-dispatch.ts maps every event kind to a cue and carries a never exhaustiveness guard, proven by a test or a deliberate compile failure that adding a kind without a cue is caught at build time.
      - The SOUNDS manifest and CHANNELS map cover every event kind, with sustained cues (the marching tick, the spider) expressed as start and stop rather than repeated one-shots.
      - The bonus-life cue named by core/bonus.ts:32 has a place in the manifest and its comment is updated to point at the seam that now exists rather than at a deferral.
      - No .wav is committed to the repo and no R2 upload is claimed by this story — the manifest names files that later stories bake, and the story says so plainly rather than implying the game now has sound.
