  - id: pm3-8
    title: Fix the malformed maze — the rendered board does not match the authentic Pac-Man maze layout
    points: 5
    priority: p2
    plan_ref: plan:docs/superpowers/plans/2026-08-07-pac-man-pm3-8-authentic-maze-tilemap.md
    status: backlog
    repos: arcade
    workflow: superpowers
    description: "BUG (playtest, 2026-08-07): with pm3-1..7 shipped, the game now renders real double-line blue tile walls — but the MAZE SHAPE itself is wrong. The board is unrecognizable as Pac-Man: no visible central ghost house, corridors misaligned/disconnected, and the wall art scattered so the classic maze silhouette is gone (see attached screenshot: SCORE 10 / LIVES 3 / LEVEL 1, READY!). Two candidate root causes, both HONEST-UNCITED reconstructions flagged in-source, either or both of which can produce this: (1) the reconstructed maze topology — `MAZE_ROWS`/`ROWS` string table in `plugins/pac-man/src/core/maze.ts` (pm1-3, self-declared 'faithful-style reconstruction, individual tiles NOT byte-cited') — does not actually trace the authentic 28x36 arcade maze; and (2) the shell autotiler `MAZE_TILEMAP`/`wallTileFor` in `plugins/pac-man/src/shell/render.ts` (pm3-4, self-declared 'hand-built autotiler over MAZE's wall topology, corner/edge tile choice a best-effort approximation') picks wrong corner/edge tiles for the topology it is given. INVESTIGATE which layer is malformed before fixing — a wrong ROWS table will render 'correctly' by the autotiler's own lights, so diagnose the topology first (a control render of the raw wall/path grid, no tile art) then the autotiler. GROUND TRUTH: the authentic maze shape is the well-known public arcade layout (Dossier ch.3 'The Maze'); shaunlebron/pacman stays a READ-ONLY oracle under the GPL firewall — zero lines copied — MAME `pacman.5e` tile RAM / video-RAM boot writes are the tiebreaker for exact tile identity. CONSTRAINTS: core/shell boundary holds (purity sweep armed on maze.ts); TOTAL_PELLETS stays 244 (pacman.asm:20e6) and DOT_COUNT stays derived from the table, not hardcoded; the tunnel row and pm3-2's position-wrap must survive any ROWS rework. Pin the corrected layout with a test that asserts recognizable invariants (ghost-house cell block present, symmetric halves, tunnel row walkable edge-to-edge, energizer count == 4) so a future re-derive can't silently re-malform it."
  - id: pm3-9
    title: Authentic maze drives both — rebuild core/maze.ts topology from the byte-cited capture so render AND gameplay share one source
    points: 8
    priority: p2
    status: backlog
    repos: arcade
    workflow: superpowers
    description: "SUCCESSOR to pm3-8, which drove the malformed-board bug to its true root cause and resolved the render half. FINDING (pm3-8 Task 6, 2026-08-07): the board is malformed because `core/maze.ts`'s maze topology (the `MAZE_ROWS`/`ROWS` table, pm1-3, self-declared 'faithful-style reconstruction, NOT byte-cited') genuinely DIVERGES from the real arcade ROM — 68 of 240 dot cells differ, plus corridors (rows 9,10,14,20,25,28,31). pm3-8 made the RENDER authentic (MAME video-RAM capture -> tile-index bake -> monochrome-by-type render, orientation candidate B = pacman_scan_rows(sy,27-sx)), but a shell-only authentic render CANNOT match a non-authentic core: colour/type come from core, shape from the authentic tilemap, and where they disagree the board garbles (broken blue wall-dashes + stray peach bars — visually confirmed, board upright & correctly coloured but wrong shape). OWNER DECISION (2026-08-07): the authentic maze must drive BOTH render and gameplay. SCOPE (this story, touches CORE — pm3-8 was shell-only): rebuild `core/maze.ts`'s per-cell topology (wall/path/dot/energizer/tunnel/house/gate) FROM the authentic capture, byte-cited, so collision + dots + render are one source; then render+gameplay agree and the board is correct. DE-RISKED ALREADY (pm3-8 controller research): a perfectly clean MAME capture is NOT needed (coin/start input-injection into MAME headless does not register — dead end). The vendored `plugins/pac-man/reference/graphics/maze-vram.bin` (attract) ALREADY carries the full authentic wall/dot/energizer layout (exactly 240 dots tile 0x10 + 4 energizers tile 0x14 + all walls); its ONLY contamination is the attract 'GAME OVER' banner, whose LETTER tiles (indices 48-90) are cleanly separable from WALL-ART tiles (206-253) and classify as path. Classifier: tile 0x10->dot, 0x14->energizer, wall-art-set->wall, blank 0x40 / 0 / letters->path; then re-derive tunnel/house/gate (tunnel row from the tunnel tiles/known row, house+gate from the central rectangle). CONSTRAINTS: TOTAL_PELLETS stays 244 = 240 dots + 4 energizers (pacman.asm:20e6) — the authentic layout MATCHES this, so DOT_COUNT stays derived from the table; pm3-2's tunnel position-wrap must survive; core/shell purity boundary holds (purity sweep armed on maze.ts); GPL firewall holds (MAME/authentic-capture is the source, shaunlebron read-only). VERIFY: the pm3-8 oracle (tests/shell/maze-tilemap.test.ts — every core dot cell has authentic tile 0x10, 4 energizers, tunnel row open edge-to-edge, hollow house) must go GREEN once core matches authentic; add a control render + Playwright visual showing a recognizable authentic maze; keep gameplay tests (targeting, house, mode) green after the ROWS change. FOUNDATION / POINTERS: build on branch `feat/pm3-8-authentic-maze-tilemap` (Tasks 1-5 + orientation committed & sound; branch is RED-by-design where the oracle detects core!=authentic — this story turns it green). SPEC docs/superpowers/specs/2026-08-07-pac-man-pm3-8-authentic-maze-tilemap-design.md (see the REVISION note). PLAN docs/superpowers/plans/2026-08-07-pac-man-pm3-8-authentic-maze-tilemap.md. Full investigation ledger: .superpowers/sdd/2026-08-07-pac-man-pm3-8-authentic-maze-tilemap/progress.md. Start a fresh brainstorm->spec->plan for the core rebuild."
