  - id: pm3-8
    title: Fix the malformed maze — the rendered board does not match the authentic Pac-Man maze layout
    points: 5
    priority: p2
    status: backlog
    repos: arcade
    workflow: superpowers
    description: "BUG (playtest, 2026-08-07): with pm3-1..7 shipped, the game now renders real double-line blue tile walls — but the MAZE SHAPE itself is wrong. The board is unrecognizable as Pac-Man: no visible central ghost house, corridors misaligned/disconnected, and the wall art scattered so the classic maze silhouette is gone (see attached screenshot: SCORE 10 / LIVES 3 / LEVEL 1, READY!). Two candidate root causes, both HONEST-UNCITED reconstructions flagged in-source, either or both of which can produce this: (1) the reconstructed maze topology — `MAZE_ROWS`/`ROWS` string table in `plugins/pac-man/src/core/maze.ts` (pm1-3, self-declared 'faithful-style reconstruction, individual tiles NOT byte-cited') — does not actually trace the authentic 28x36 arcade maze; and (2) the shell autotiler `MAZE_TILEMAP`/`wallTileFor` in `plugins/pac-man/src/shell/render.ts` (pm3-4, self-declared 'hand-built autotiler over MAZE's wall topology, corner/edge tile choice a best-effort approximation') picks wrong corner/edge tiles for the topology it is given. INVESTIGATE which layer is malformed before fixing — a wrong ROWS table will render 'correctly' by the autotiler's own lights, so diagnose the topology first (a control render of the raw wall/path grid, no tile art) then the autotiler. GROUND TRUTH: the authentic maze shape is the well-known public arcade layout (Dossier ch.3 'The Maze'); shaunlebron/pacman stays a READ-ONLY oracle under the GPL firewall — zero lines copied — MAME `pacman.5e` tile RAM / video-RAM boot writes are the tiebreaker for exact tile identity. CONSTRAINTS: core/shell boundary holds (purity sweep armed on maze.ts); TOTAL_PELLETS stays 244 (pacman.asm:20e6) and DOT_COUNT stays derived from the table, not hardcoded; the tunnel row and pm3-2's position-wrap must survive any ROWS rework. Pin the corrected layout with a test that asserts recognizable invariants (ghost-house cell block present, symmetric halves, tunnel row walkable edge-to-edge, energizer count == 4) so a future re-derive can't silently re-malform it."
