description: "Fifth Millipede epic, the outer loop that turns reducers into a game — mirrors centipede cp4 'game structure' and reuses mc7's high-score pattern. Waves + per-wave difficulty (BEETLA beetles-allowed MLDEF.MAC:370, DELAY between waves MLDEF.MAC:286), scoring (SCORNG MLSUB.MAC:1040, UPSCRE update scores on screen MLSUB.MAC:1912). Bonus life 'EVERY XXXX' selectable via DIP (BONUS message MLSUB.MAC:8, DIP D4-D5 MLDEF.MAC:90), lives (DLIVES MLSUB.MAC:505). NOVEL vs centipede: SELECT starting score (MLSUB.MAC:1404) — Millipede lets the player start at a higher difficulty for more points; BONUSS max starting bonus (MLTST.MAC:8). High-score table + initials REUSE @shared/highscore (qualifiesForHighScore/insertHighScore) + @shared/name-entry (stepNameEntry) over one-origin localStorage, NOT re-implemented and NOT EAROM chip emulation: the source's EAROM (MLTST CKSUM/CHKEA/READEA/WRITEA/INITEA MLTST.MAC:36-150) maps to localStorage under highScoreKey('millipede'); core owns table/qualifies/initials (GETINT MLSUB.MAC:547, UPDATE MLSUB.MAC:1817, COPYHS MLSUB.MAC:406), shell reads on boot / writes on commit. Follow the asteroids/joust/mc7 consumer pattern. Pure core reducers, cited. Dependency: ml5 -> ml3 (needs the sim); the entry phase slots into ml7's state machine but the table/qualifies/select are ml7-independent. Design: docs/superpowers/specs/2026-08-11-millipede-cabinet-roadmap-and-ml1-design.md (section 4, ml5). NO ROM default high-score ladder unless the source ships one — verify before mirroring another game's attract HUD (the pac-man/centipede clone-ism trap). OUT OF SCOPE: sound (ml6), attract state machine + wiring + HUD render (ml7)."
