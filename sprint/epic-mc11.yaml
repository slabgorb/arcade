title: 'Missile Command — wire the post-mc5 unwired seams: sputnik cruise-borrow, bonus count-up cue, name-entry timeout; retire dead twins'
description: "Eleventh Missile Command epic. Three built-and-tested seams never reach production play, two of them because a post-mc5 comment went stale after the story it named shipped (unwired-feature audit 2026-08-16). (1) sputnikFireCount (core/sputnik.ts:107) clamps a plane's salvo by 2*cruiseOnScreen (the PLCPV cruise-borrow), but its sole caller (game.ts:493) hardcodes cruiseOnScreen=0 behind a stale comment 'cruiseOnScreen is 0 until mc5-3' — mc5-3 (cruise missiles) shipped, so planes now fire oversized salvos whenever cruise missiles are on screen; the fix is one line (pass the live cruise count). (2) The bonus count-up cue (bonusTick/TK, sound-events.ts:63 -> audio-dispatch.ts:51 -> audio.ts:39, TK table sound-tables.ts:75) is fully wired downstream but nothing ever constructs a {type:'bonusTick'} event — the 'between' resolution (game.ts:401-420) pays the bonus as a lump waveEndBonus with soundEvents:[] (confession sound-events.ts:62 'Emitter is a filed follow-up'), so the per-unit end-of-wave count-up (W3SOUN/SUNABM) is silent. (3) abortNameEntry (core/game.ts:274) — the ROM's TAKE-INITIALS 30-second timeout and start-switch abort (W3DSUP.MAC:4076/:4086) — has no caller, so during initials entry the player can only commit or edit forever (confession game.ts:270: the per-frame countdown is the deferred O-7b item). A fourth cleanup story retires redundant dead twins that later stories superseded inline. Reuses existing tested code; ground truth REV-01 (W3DSUP.MAC / W3SOUN). Every new src/core constant carries a citation-gated claim; purity.test.ts stays green."
priority: p2
status: backlog
