id: df4
type: epic
title: 'Defender — the menagerie (phase 4b): one cited reducer per enemy, the shared collision seam, and the first effects that kill — with the photosensitivity accessibility exception decided here'
description: "Fourth Defender epic and phase 4b of the framebuffer-raster cabinet build (docs/playbooks/next-sprite-game.md). df3 gave us a ship flying a scrolling, wrapping world with lasers that fire and travel but hit nothing; df4 populates that world. It builds: the SHARED collision seam ported from the ROM's own COLIDE object-pointer-list hit test (src/core/collision.ts — COLIDE defender/DEFA7.SRC:2904-2907, collision-picture return :2553, screen-collision addr CENTMP :3008, and the three cited query shapes: laser :2775-2787, bomb :2699, ship :3130-3142); the materialize/explode effects (src/core/effects.ts — SAMEXAP7 'SAM EXPLOSIONS AND APPEARANCES' APST appear / EXST explode, defender/SAMEXAP7.SRC:16-17, over the df2-4 INERT image tables); and one cited reducer per enemy family (the DEFB6.SRC enemy processes, each a scheduler process spawned via NEWP,STYPE). Stands on df1 (dossier + citation gate + src/core purity test), df2 (framebuffer render seam + palette + charset + object/terrain tables — pixels, INERT) and df3 (scheduler, world/camera, ship, stars, laser). Every constant df4 introduces re-opens under the df1-1 gate: no src/core value without a claims/*.json entry citing defender/<FILE>.SRC:<line>. DECISION A (RULED, ROM-always-wins): port COLIDE's own object-list model into core, cited, NOT a re-derived quadtree/AABB — a cleaner hit test would silently change which overlaps count (routing != geometry, the df3 lesson); collision.ts is pure, tested against synthetic object lists BEFORE any enemy exists, so every enemy story inherits a ready gated hit test — this is df4-1, first. DECISION B (RULED, the ONE standing exception to ROM-always-wins — docs/adr/0005-photosensitivity-accessibility-exception.md, authored at this epic's kickoff): the ROM's full-screen strobe effects (player death/terrain explosion TERBLO DEFB6.SRC:434,437 + SAMEXAP7 EXST; smart-bomb SBOMB COM PCRAM DEFA7.SRC:3199 and hyperspace HYPER DEFA7.SRC:3211 are df5) are a seizure trigger for the owner (photosensitive epilepsy); they become freeze/fade/particle. The ROM trigger + timing are ported and cited; only the strobe PRESENTATION is substituted, logged as a Design Deviation citing ADR-0005, and pinned by a render-side guard that no effect writes a whole-framebuffer inversion in a single frame. df4 DECIDES this (df4-2 builds the policy module + guard, before any death renders); df5/df7 CITE it. ENEMY IDENTITY IS A CITED DOSSIER TASK, NOT A GUESS: the Williams source names enemies in its INTERNAL vocabulary (UFO/PROBE/TIE/SCZ/'SCHITZO'/MSWM) which does NOT map 1:1 to the arcade-marketing names (Lander/Mutant/Baiter/Bomber/Pod/Swarmer); each enemy story cites the process LABEL + the source's own comment and maps <ROM label> -> arcade enemy in the brief/dossier, CITED, before writing the reducer — a wrong identity in prose ships GREEN. Reuse-first: df3 scheduler.ts (enemies ARE processes), df3 world.ts (display space + worldX helper), df2 framebuffer.ts/render.ts (index blit — colour by INDEX only, never hex), df2-4 DEFB6/SAMEXAP7 INERT image tables (df4 gives the already-byte-verified pictures behaviour — no re-transcription), df3 laser.ts (the thing that finally hits). No new @shared extraction (enemy reducers are defender-specific; the collision model is the ROM's with no second consumer — the 'extract on the second game' bar is not met). Design + full story rationale: docs/superpowers/specs/2026-08-16-defender-df4-menagerie-design.md; roadmap parent: docs/superpowers/specs/2026-08-13-defender-cabinet-roadmap-and-df1-design.md sec 4 df4 (approx 21 pts). Traps carried in: enemy identity is a cited mapping not a guess; enemies are scheduler processes (no per-enemy rAF/tick); colour by index only; ADR-0005 guard lands with df4-2 not retrofitted; line numbers from tool output only; RASM radix ($hex vs bare decimal). OUT OF SCOPE (df5): scoring + extra men (P250/P500 DEFB6.SRC:408,496-503 are named ONLY to be avoided), waves (WVTAB BLK71), smart bomb, hyperspace, humanoid rescue/fall-to-planet/mutant-space, the scanner (radar), 2P handoff, game over.
  Also out: sound (df6), attract->play phase machine/HUD/showcase (df7), hardening/mutation batteries (df8+)."
