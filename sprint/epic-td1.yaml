    title: The shared audio docblock says six of seven cabinets pass no priorities map — centipede passes one, so joust is not the only arbitrated cabinet
    description: 'Found by jt9-7''s TEA (2026-08-03) while measuring whether joust''s CHANNELS map could be deleted. src/shared/audio.ts:70-75 states: "Six of this arcade''s seven cabinets are multi-voice machines whose sounds simply mix, and they pass neither map ... The seventh, joust, is a Williams machine ...". MEASURED FALSE: plugins/centipede/src/shell/audio.ts:227 passes priorities: PRIORITIES as well, built by a filter over POKEY voice 0 (:209-211), and centipede''s own docblock at :204-208 names three cues — mushroom, headBottom, waveClear — deliberately left OUTSIDE arbitration under a user ruling of 2026-08-03, where they keep plain per-channel stealing. So TWO cabinets arbitrate, and one of them ships the partial-priorities case the shared prose implies does not exist. The sentence matters beyond tidiness: it is the reason jt9-7''s filing (and its story context) treated joust as the only consumer, which is what made "delete the map" look joust-local. Fix the count and add the centipede case; jt9-7 could not, because centipede files are fenced off while cp6-3 runs in a sibling checkout. Scope: src/shared/audio.ts prose only, no behaviour. Note the file is shared by all five manifest-building cabinets, so the full suite applies.'
