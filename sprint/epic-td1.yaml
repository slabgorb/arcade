  - id: td1-17
    title: "mg1-4's guards pass on absence: the context scan and the AC-shape scan both go green when there is nothing to read"
    description: "Found by the Reviewer during mg1-4's round-2 review, 2026-07-31, and filed rather than blocking approval: both are Medium, no live defect exists, and mg1-4's four ACs are met. They are the same CLASS of defect mg1-4 round 1 was rejected for — a guard that reports success because it found nothing to check — so they are worth closing deliberately rather than leaving as folklore. Both were proven by mutation, not inferred. FIRST, the context scan goes silently blind. contextRepoViolations anchors on a line beginning at column 0 with the literal '- **Repo:**'. Indenting that line by two spaces while ALSO changing the value to a retired repo (joust) leaves the suite 17/17 green, and deleting the Repo line from every live context file likewise leaves it 17/17 green. Nothing asserts the guard actually parsed a Repo line, so it cannot distinguish 'every context is correct' from 'no context had anything to read'. Today it reads 7 files and finds a Repo line in all 7, so the fix is a one-line assertion that the parsed count is non-zero (or matches the file count), plus a test that a template shape change reddens. SECOND, the AC-4 story-shape guard misses the flow-style empty list. Its regex requires /^ {4}acceptance_criteria:\\s*$/ — the key with nothing after the colon — so a story rewritten as 'acceptance_criteria: []' skips the check entirely. Replacing every acceptance_criteria block in a live shard with the flow-style empty form leaves the suite 17/17 green, and that is precisely the loss AC-4 exists to catch: PyYAML emits an empty list as [] on the same line, so a round-trip that dropped a story's criteria would look exactly like this. Note mg1-12 and mg1-13 legitimately carry no acceptance_criteria key at all, so the fix must distinguish 'absent' from 'present but emptied' rather than requiring the key everywhere. Both fixes are small and local to tests/helpers/sprint-repos.mjs and tests/sprint-repo-routing.test.mjs."
