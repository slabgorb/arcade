  - id: td1-14
    title: "reanchor-citations.mjs must REFUSE to move a pin whose verbatim is non-unique in its file (sw8-8 round-3 finding; strengthens td1-13 with a measured near-miss). td1-13 already describes the silent-corruption path: the tool matches NEAREST-LINE, so a duplicated verbatim can be re-pointed at the wrong occurrence and check-citations.mjs re-opens it, finds the text it expected, and goes green forever while the finding now describes a different routine. sw8-8's merge resolution re-anchored 36 pins and TWO of the three duplicate-verbatim pins in the whole findings set moved — G-009 and S-016, the exact pair td1-13 names by hand ('      damage++' at sim.ts:625/1110 and '    if (collides(s.pos, ship, COCKPIT_HIT_RADIUS)) {' at :624/1109, the near-identical space and surface cockpit-damage paths). They landed on the correct SPACE occurrence, verified by the Reviewer against the enclosing section comment and the emitted event (cause 'enemy' vs cause 'turret') — but nothing in the pipeline checked. Neither of Dev's two verifications can detect it: 'the diff contains only line changes' and 'per-file remediated_by counts match' BOTH pass a mis-anchor, and so does the gate. This is the cheap interim guard, well short of td1-13's full audit-commit freeze, and worth having even if td1-13 lands: before moving any pin, count occurrences of ours.verbatim in ours.file; if > 1, do not guess — leave the pin, print the candidate line numbers, and exit non-zero so a human resolves it. Also worth reporting the checked-pin SPLIT in the tool's summary (sw8-8 had 137 pins, 96 gate-checked, 41 legitimately historical via remediated_by/NO_COUNTERPART per check-citations.mjs:150-165) so a reviewer auditing the counts is not chasing 41 phantom failures. || EXTENDED sw8-18 (2026-08-02): the identical guard clause is now needed in a SECOND tool. sw8-18 shipped plugins/star-wars/tools/audit/check-comment-citations.mjs, which re-opens citations written into ordinary source comments and, when a span is stale, RE-LOCATES it — 'it is now at <file>:<N>; re-anchor the citation to that'. That search is FIRST-OCCURRENCE, so a non-unique verbatim points at the wrong site: measured during sw8-18, state.ts cites `ADDD M$TX+M.S1` for S1MVBS and the hint named WSMAIN.MAC:2539, which is S1MVGD — a different routine containing the identical instruction; the right answer was :2656 (fixed by citing the routine span :2654-2656). The two tools differ in blast radius and BOTH matter: reanchor-citations.mjs WRITES a wrong anchor silently, check-comment-citations.mjs only PRINTS a wrong suggestion — but a human then applies it, and the printed form is more persuasive than a diff. Same fix in both places: count occurrences first; if > 1, refuse to name one and print every candidate. Do them together — the clause is four lines and splitting it across two stories invites one of them to drift."
    description: |-
      EXTENDED at sw8-23's finish (2026-08-02) — a SECOND defect in the SAME relocation loop of plugins/star-wars/tools/audit/check-comment-citations.mjs. Filed here rather than as its own story because whoever fixes one will be standing in the other, and splitting six lines across two stories invites one of them to drift. The full history of this story lives in its title; this description carries the addition.

      THE SECOND DEFECT. The relocation loop seeds its window from the citation span — 'const width = Math.max(1, c.end - c.start + 1)' — but the INITIAL check widens a single-line citation by 'runLen', the count of '/'-joined instructions in the adjacent quote. The two disagree, so a single-line citation of a multi-instruction run is checked over N lines and then searched over 1. It can never be relocated.

      MEASURED during sw8-23: tools/music-bake/gen-music-data.mjs cited SNDPM.MAC:737 for the quote 'LDA -1(X) / BNE 30$'. The tool reported 'quoted verbatim is not in the cited span (and is nowhere in the file)'. The correct anchor is :738-739 — LDA -1(X) at :738, BNE 30$ at :739 — found by reading the ROM, not by the tool. That was the ONLY citation in sw8-23 where the tool's own suggestion could not be used.

      WHY IT MATTERS MORE THAN IT LOOKS. 'Nowhere in the file' reads as 'this citation is fabricated' when the anchor is one line away, so it invites the reader to DELETE a correct citation rather than move it. The first-occurrence defect above sends a reader to a wrong line; this one tells them there is no line at all. Both are the relocator lying with confidence.

      FIX. Seed the relocation width with the same runLen expansion the initial check already computes. Four lines, same loop as the refuse-to-guess clause. POINTS 3 -> 5 for the second clause plus its tests.

      DEPENDENCY WORTH KNOWING: sw8-24 sweeps 29 stale citations across star-wars and its plan explicitly leans on the relocator's hints being trustworthy. Landing this first makes that sweep materially safer; landing it after means re-checking every hint sw8-24 applied.
