  - id: td1-10
    title: just test-all and build-all mask every game's failure but the last — just ci prints CI passed with six of seven red
    description: |-
      Found by the td1-8 TEA (2026-07-20) while writing the RED phase for the `serve` recipe, and independently reproduced by SM before filing. PRE-EXISTING, not created by td1-8. Filed separately rather than folded in, for the same reason td1-8 filed its own config-type-check finding out: td1-8 is a 2-point story that already carries a real behavioural fix, and a masked-exit-code defect in the CI gate deserves its own RED phase rather than a footnote.

      THE DEFECT (justfile:28-33, and :126-127):

        test-all:
            @for g in {{games}}; do echo "==> $g"; (cd {{root}}/$g && npm test); done
        build-all:
            @for g in {{games}}; do echo "==> $g"; (cd {{root}}/$g && npm run build); done
        ci: test-orchestrator test-all build-all
            @echo "CI passed!"

      A `for` loop's exit status is the status of its LAST iteration. These recipe bodies are a single shell line with no `set -e` and no per-iteration status tracking, so every game's failure except the last is discarded.

      REPRODUCED (exact shape of the recipe body, SM-verified 2026-07-20):
        for g in a b c; do (exit 3 on a); done  -> exit 0    FIRST failure MASKED
        for g in a b c; do (exit 3 on b); done  -> exit 0    MIDDLE failure MASKED
        for g in a b c; do (exit 3 on c); done  -> exit 3    only the LAST propagates

      `games := "tempest star-wars asteroids battlezone red-baron centipede joust"`, so ONLY joust's failure is ever visible. Six of the seven games can be fully red and `just ci` still prints "CI passed!".

      WHY p1: this is strictly worse than td1-8's blast radius. td1-8 makes a dev-loop launcher look healthy; this makes a CI GATE report success. It is the same failure shape the whole td1 epic keeps circling — a check that cannot fail — sitting on the recipe most likely to be trusted as a release preflight. Note `just release` / `release-all` gate on each repo's own tests via scripts/release.mjs and do NOT route through `just ci`, so this is not believed to have shipped a broken release; confirm that during the fix rather than assuming it.

      SUGGESTED FIX: track a failure flag per iteration, print a NAMED summary of which games failed, and exit non-zero if any did. Same discipline td1-8 lands for `serve` — a named summary line, not just a non-zero code. Consider whether test-all should fail fast or run all games and report the full set (the latter is more useful for a fleet sweep).

      Also worth checking while here: `status`, `install-all` and any other `@for g in ...` recipe in the justfile share this shape. Sweep them all rather than fixing only the two named here.
    points: 2
    priority: p1
    status: done
    started: '2026-07-20'
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - Every multi-repo for-loop recipe in the justfile propagates failure — a failing game in ANY position (first, middle, last) makes the recipe exit non-zero, proven for all three positions.
      - A failed sweep names which games failed rather than only exiting non-zero, and just ci cannot print CI passed when any game is red.
      - The all-green path still exits 0, so a fix that always fails cannot pass.
    completed: '2026-07-20'
    type: bug
    review_verdict: approved
  - id: td1-11
    title: bake-sfx expandAlsoun omits the ROM terminal-zero register write — five cues truncate their tail, player_fire among them
    description: |-
      Surfaced by td1-6 (2026-07-20), NOT created by it — the SECOND of the two bake-tool defects the tempest link-5 audit named. td1-6's description called it out as DISTINCT and OUT OF SCOPE ("the terminal-zero-write omission affecting segment_tick/enemy_explosion/enemy_fire/spike_shot — those read ROM=[0,0] shipped=null"), and this story is where it gets fixed. td1-6 also proved it affects a FIFTH cue the original triage did not know about: player_fire.

      THE DEFECT: plugins/tempest/tools/pokey-bake/bake-sfx.mjs's expandAlsoun/expandSeq path omits the ROM's terminal register write — the final [reg, 0] event the ROM emits to silence the voice at the end of a sound. The shipped bake simply runs OUT of events two short of the ROM. Signature in the audit: `register-event stream differs ... ROM=[0,0] shipped=null (ROM emits N events, shipped emits N-2)`. This is the OPPOSITE shape from td1-6's mask bug (a same-position VALUE disagreement); here the shipped side has no event at all at the divergence point.

      HOW player_fire JOINED THE LIST: the audit comparison stops at the FIRST divergence. player_fire had TWO defects — the AUDC high-nibble mask omission (td1-6) at event 3, and this terminal-zero omission at event 64. The mask bug at event 3 HID the tail truncation. td1-6 fixed the mask, the event-3 divergence vanished, the comparison walked further, and revealed ROM=[0,0] shipped=null at event 64. Exactly the same pattern by which td1-4 (un-crossing the cue->ROM map) revealed td1-6. So the affected set is FIVE, not four: segment_tick, enemy_explosion, enemy_fire, spike_shot, AND player_fire.

      THE CANARY COUPLING (same shape as td1-6): the orchestrator test tests/extract-audio.test.mjs asserts player_fire is MISMATCH on the terminal-zero tail (shipped=null), grouped WITH the other four (td1-6 re-aimed it there). When THIS story fixes the terminal-zero write, all five cues' baked tails gain their [reg,0] event and become ROM_VERIFIED — so this story must FLIP all five from the MISMATCH group to the ROM_VERIFIED group in extract-audio.test.mjs, in lockstep with the bake-tool fix. Verify the blast radius empirically as td1-6 did: fixing the terminal write should move exactly these five cues' bytes and no others.

      SCOPE — REWRITTEN 2026-07-31 AFTER THE MONOREPO MIGRATION. The original text prescribed a two-repo sequence: "RED in tempest, GREEN fix, merge the tempest PR to develop, THEN flip the five orchestrator canary rows." There is no tempest repo and no develop branch any more. Both halves now live in ONE tree and belong in ONE commit — the bake tool at plugins/tempest/tools/pokey-bake/bake-sfx.mjs, the canary at tests/extract-audio.test.mjs — which removes the lockstep-across-repos hazard entirely and makes the coupling a single reviewable diff.

      WATCH THE RUNNER, THIS IS THE NEW TRAP. tests/extract-audio.test.mjs is a node:test file and vitest never sees it (vitest.config.ts declares a project per app, none rooted at tests/). So `npx vitest run` — the habitual green light — CANNOT execute this story's canary. Verify with `npm run test:orchestrator`, or `just ci` which runs both. This is exactly the gap mg1-11 exists to close; if mg1-11 lands first, drop this paragraph.

      Do NOT also re-open td1-6's mask (already fixed); this is purely the tail write.
    points: 3
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - A failing tempest test proves expandAlsoun/expandSeq emits the ROM's terminal [reg,0] register write, red against the current tail-truncating code.
      - All five affected cues (segment_tick, enemy_explosion, enemy_fire, spike_shot, player_fire) bake a stream whose length and tail match the ROM; the orchestrator link-5 audit stamps all five ROM_VERIFIED.
      - The five orchestrator canary rows in tests/extract-audio.test.mjs are flipped from MISMATCH to ROM_VERIFIED in lockstep, and the blast radius is verified empirically (exactly these five cues' bytes move).
    type: bug
  - id: td1-12
    title: joust wave counter is BCD but every consumer reads it as decimal — wrong wave row from the 10th wave on
    description: "joust/src/core/demo.ts:955 advances the wave with nextWaveBcd (LDA WAVBCD / ADDA #$01 / DAA, JOUSTRV4.SRC:2001-2004), so demo.wave is a BCD-PACKED byte: 1..9 then 0x10, 0x11 … 0x19, 0x20. tests/wave.test.ts:155 already pins this — 'nextWaveBcd(0x09) BCD not binary -> 0x10'. But demo.ts:959-968 then passes that raw value to waveRowAt, applyWaveDestruction, spawnWaveEnemies, trollSpawnable and seedWaveBudget, and game.ts:347 resolveWaveType does the same — every one of which is documented as taking a 1-based DECIMAL wave (wave.ts:177-185 'The row for a 1-based wave number … Throws for a wave < 1'). BCD and decimal coincide for waves 1-9, so nothing is visibly wrong until the tenth wave; from there they diverge permanently. MEASURED at the tenth wave: waveRowAt(0x10) returns wave 16's row (bounders 0) instead of wave 10's (bounders 8), so the demo materialises the wrong enemy complement, destroys the wrong cliffs, and seeds the wrong pursuit budget — and the error grows (the twentieth wave holds 0x20 = 32). The whole late-game difficulty curve is therefore reading the wrong rows. Two honest fixes and the story should pick one deliberately: (A) keep demo.wave BCD as the ROM's WAVBCD byte is and decode ONCE at each consumer boundary, or (B) hold a decimal wave in DemoState and derive the BCD only where the ROM's byte semantics actually matter (display, the 0x99 wrap). (B) is likely simpler but changes a field every jt2/jt3/jt4 test constructs, so expect a broad re-seat — grep every 'wave:' literal in tests/. NOTE the wrap differs between the two: nextWaveBcd wraps at 100 waves, while waveRowAt loops the TABLE at 81 (WTBRST, :2535) — confirm which the ROM actually does before assuming they must agree. FOUND BY: Reviewer during uf1-2 code review, which was REJECTED for adding a NEW consumer of the same confusion (the per-wave difficulty seam). uf1-2 fixes only its own hop; this story owns the pre-existing consumers. Do this BEFORE uf1-8/uf1-9, which will add more per-wave consumers on top of the same counter. ADDED BY uf1-2 ROUND-2 REVIEW: (a) a THIRD consumer not listed above - the dev overlay. game.ts:613 overlayReadout returns game.wave (the raw BCD byte) behind a doc comment reading 'The 1-based wave', and main.ts:135 prints it, so the overlay shows 'WAVE 16' on the tenth wave. Note the fix points the OTHER way for this one: the ROM PRINTS the BCD digits (WAVEN3 does LDA WAVBCD / BITA #$F0 / BNE / ORA #$F0 / JMP OUTBCD, :2399-2403 - the ORA blank-suppresses the leading zero), so the display wants the byte FORMATTED, not decoded. (b) PRIMARY-SOURCE FINDING that sharpens the choice: WAVBCD has exactly FOUR references in the whole 1982 source - CLR at :1875, the increment at :2001-2004, and ONE read at :2399, which is the display routine. It indexes NOTHING. The wave TABLE is walked by a SEPARATE pointer (LDX PWAVE,U / LEAX WLEN,X / CMPX #WTBEND / LDX #WTBRST, :2011-2019) and the DYTBL difficulty walk by a per-row RAM countdown run from IWAVE at wave-end (:945, :2099). Both are monotone and neither resets. So demo.wave conflates TWO ROM concepts, and option (B) is really 'model PWAVE, derive WAVBCD for display' - which makes (B) the faithful choice, not merely the simpler one. (c) uf1-2 left a TRIPWIRE: stepDemo now calls decimalWaveFromBcd(demo.wave), which THROWS on a non-BCD byte. If this story makes demo.wave decimal, the game dies at the tenth wave (10 = 0x0a) until that call site is updated in the same change. Tests catch it first. (d) uf1-2 could not fix the ROLLOVER and pinned it as a known divergence: from wave 101 the counter reads 0x01 again, so the difficulty RESETS to its wave-1 value and re-climbs, once per hundred waves. A monotone counter removes this; the pinning test in tests/difficulty-wiring.test.ts is expected to fail when it does, and should be updated then."
