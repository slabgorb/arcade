    review_findings: "APPROVED at round 2. All three round-1 Highs closed and verified by the Reviewer independently, not from the report: the shipped flea sweep is byte-identical to the ROM formula with CKFE=0 sweeping ANTV 0xF8->8 (monotonic rising AUDF, so the pitch falls) with no trace of the fabricated 0x55; the player explosion's ADC I,02 ;INCREASE VOLUME (CENTI4.MAC:2449) is applied with all four BEQ-delay zero bytes preserved; and all three of round 1's surviving mutations (constant pitch, constant AUDC, reversed FREQ tables) are now caught. AC-1 re-curled by the Reviewer: 14/14 live 200, and the host content was verified by md5 rather than by size because the corrected bake changes sample values but not lengths. Dev found and closed a hole in the Reviewer's OWN specified fix: a differential test cannot see a transformation applied uniformly to both sides, so it was replaced with absolute order-sensitive audio properties. OUTSTANDING, routed rather than blocking: (1) cp6-1's F1 voice-0 contention finding, filed BLOCKING FOR cp6-2, is still undispositioned and unowned — SM must file it before finish; (2) two LOW coverage gaps on correct code (the BEQ zero-byte rule and the stand-in volume ceiling) routed as a chore with exact specs. Two guards are equivalent mutants by measurement and want no test."
  - id: cp6-3
    title: POKEY voice 0 is contended and our CHANNELS map does not model it — the player explosion must silence the kill cues
    description: |-
      THE MECHANISM, ALREADY MEASURED — DO NOT RE-DERIVE IT. On the cabinet, POKEY voice 0 is contended and the player explosion WINS OUTRIGHT. `BEQ 52$ ;IF NO PLAYER EXPLOSION` (CENTI4.MAC:2437) is the voice-0 twin of `BEQ 48$ ;IF NO BONUS SOUND` (CENTI4.MAC:2374): if CHAN5 is non-zero the routine takes the player-explosion path and `:2416 BNE 50$ ;ALWAYS` blocks fall-through, so while the player is exploding NONE of the four kill cues can reach AUDF0/AUDC0. The machine rings ONE sound; our clone rings two.

      WHY OUR CLONE DIVERGES. `plugins/centipede/src/shell/audio.ts` CHANNELS gives the four kill cues the logical channel 'impact' and playerDeath the channel 'alert'. The shared engine steals per channel, so a death and a segment kill occupy DIFFERENT channels and both sound. On the cabinet they are the same POKEY voice and the death silences the kill. Also relevant: the ROM zeroes CHAN0, CHAN1, CHAN2, CHAN3 and CHAN6 on player death (CENTI4.MAC:1813-1818) so the explosion plays alone — our shell does not model that either, so the march, spider, flea and scorpion loops keep running under a death.

      YOUR INPUT IS ALREADY WRITTEN. `plugins/centipede/docs/rom-study/sound.fixture.json` carries a `voiceArbitration` record (contenders, note, ourShellDiffers, and 14 citations) put there by cp6-1 for exactly this. `docs/rom-study/sound.md` section 2.5 is the prose. Consume them; the ROM reading is done and byte-verified by the citation gate.

      PROVENANCE, AND WHY THIS IS ONLY BEING FILED NOW. cp6-1's Reviewer raised this as finding F1 and marked it "BLOCKING FOR cp6-2". It never reached cp6-2's description — that finish commit's epic diff was two lines (status + completed) — and cp6-2 could not have fixed it anyway: cp6-2's scope fence forbids editing SOUNDS or CHANNELS, inherited from cp6-1's own AC-5 ("it rules, it does not edit"). So both stories correctly declined it and it belonged to neither. cp6-2's Reviewer caught that at round 2 and routed the FILING here as a finish obligation. Nothing is wrong with the code either story shipped.

      SCOPE. This is a core/shell change to the channel model, NOT a baker change — the fourteen .wav files are correct and live, and nothing here should re-bake or re-upload anything. Expect to touch CHANNELS, and expect `plugins/centipede/tests/audio-dispatch.test.ts` (which pins that each sustained voice has its OWN channel — that rule stays true; what changes is which cues SHARE voice 0). Note that cp6-1's dossier guard `tests/audit/sound-dossier.test.ts` asserts SOUNDS and CHANNELS are exactly as cp5-1 left them; that guard's premise is what this story deletes, so retire it here in the open, as cp6-2 did for its own six predecessors.

      ONE THING TO SETTLE FIRST: whether 'faithful' means the death cue STOPS an in-flight kill cue (true preemption) or merely that the two never start together. The ROM's answer is preemption — CHAN5 is checked before CHAN0 every SOUNDS pass — but the shared engine's steal model may express that differently, so decide it explicitly rather than discovering it in review.

