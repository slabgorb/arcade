id: cp6
type: epic
title: Centipede sound — the samples cp5 never filed a story to bake
description: "THE GAP, MEASURED 2026-08-02. centipede's audio code is COMPLETE and centipede is SILENT. main.ts builds the engine (plugins/centipede/src/main.ts:102), unlocks it behind the browser gesture gate (:114-120) and calls playEventSounds once per stepped frame (:203); shell/audio.ts holds a 14-entry SOUNDS manifest and shell/audio-dispatch.ts wires every event kind to a cue behind a compile-time guard. All fourteen .wav files return 404 against https://arcade-assets.slabgorb.com/centipede/sfx/ — every one of shot_fire, mushroom_hit, segment_kill, spider_kill, flea_kill, scorpion_kill, head_bottom, player_death, wave_clear, bonus_life, centipede_march, spider_move, flea_move and scorpion_move. The host is healthy and the prefix is simply empty: tempest/sfx/player_fire.wav and joust/sfx/enemy_death.wav both return 200 on the SAME host, measured in the same pass. Nothing reports the failure because src/shared/audio.ts:176-178 swallows every fetch and decode rejection by design, so the game runs on quietly at 60fps and a green vitest is indistinguishable from a bucket with nothing in it. WHY THIS EPIC EXISTS AT ALL — IT IS A TRACKING REPAIR, NOT A NEW IDEA. Epic cp5 closed status done, completed 2026-08-01, carrying exactly TWO stories: cp5-1 (the seam, which correctly shipped no samples so it could not be blocked on asset production) and cp5-2 (the main.ts wiring). Both were right to ship nothing audible. But the asset story they were deferring to was never filed — grep across all of sprint/ on 2026-08-02 found no cp5-3, no cp5-4 and no cp6 anywhere, live or archived. cp5's own charter, quoted from sprint/archive/epic-cp5.yaml, reads THE ACCEPTANCE TEST FOR ANY ASSET STORY IN THIS EPIC IS A LIVE 200, NOT A GREEN VITEST — a rule written for stories that do not exist. cp1's roadmap had priced this work at roughly 8 points (its row read 'cp5 POKEY sound via extract-audio gate (~8)'); cp5 delivered 5 of seam and wiring, and this epic is the remaining 8. THE QUARRY EXISTS, AND CENTIPEDE IS TEMPEST'S LINEAGE, NOT JOUST'S. This is the single most important fact for scoping: joust had to SYNTHESISE stand-ins because its sound board firmware was never vendored (JOUSTSND.DOC is a three-line pointer to a file no revision carries). centipede has the real thing. reference/atari-source/centipede/revision.v4/CENTI4.MAC:2322-2465 is a complete POKEY sound engine — the SOUNDS routine writing AUDF0-3 and AUDC0-3 directly, plus SIX data tables carrying the machine's own comments: FREQ0/CONT0 :2455-2456 ';EXPLOSION SOUND', FREQ1/CONT1 :2457-2458 ';SOUND OF LITTLE FEET' and ';MUST BE REPEATED', FREQ2 :2459 ';SHOT SOUND', FREQ3/CONT3 :2461-2462 ';WELL REPEAT UNTIL TURNED OFF', FREQ4 :2463-2464, and FREQ6 :2465. So samples are BAKED FROM DATA here, the way plugins/tempest/tools/pokey-bake/bake-sfx.mjs does it, and a synthesised stand-in is a fallback that needs a written reason, not the default. THE MANIFEST PROMISES MORE THAN THE ROM HAS, and cp6-1 exists to rule on it rather than let a baker guess. The ROM drives SEVEN channel countdown variables over FOUR POKEY voices, allocated by its own header comment at :2325-2328 — CHAN0 all explosions, CHAN1 bonus/centipede/ant/scorpion, CHAN2 shot, CHAN3 spider. The writers are CHAN0 :2300 ';EXPLOSION SOUND', CHAN1 :1289 ';START LITTLE FEET NOISE', CHAN2 :2134 ';SHOT SOUND', CHAN3 :431 on with :282 and :2255 off, CHAN4 :1995 ';BONUS LIFE SOUND', CHAN5 :1812 ';EXPLOSION SOUND FOR PLAYER' and CHAN6 :2025 on with :155 ';NO SCORPION SOUND'. There is NO FREQ5: the player explosion replays FREQ0/CONT0 with ADC I,02 ';INCREASE VOLUME' at :2444-2449, so it is the general explosion made louder rather than a sound of its own. Six tables and one derived variant against fourteen declared cues means several manifest entries have no table behind them; which collapse onto the shared explosion and which are honest inventions is a RULING, and an unruled baker will fabricate authenticity. RADIX IS LOAD-BEARING AND HAS BITTEN THIS REPO BEFORE (the rb4-1 lesson, restated in cp1 and cp4). CENTI4.MAC inherits .RADIX 16
  from CENDE4 via .INCLUDE, so every bare literal in those tables is HEX unless it carries a trailing period — FREQ0's 0F0,0E0,0D0 are hex, 'LDA I,14' at the CHAN3 reset is hex 14 (decimal 20), and 'LDY I,20.' in the scorpion's continuous-loop block is decimal 20. A baker that reads those bytes as decimal produces confidently wrong tones that no test can see. Every transcribed constant carries a radix-cited comment and a claims entry, and the citation gate is live for this game. TWO THINGS EXPLICITLY OUT OF SCOPE. (1) The 15-second WARNING alarm at :2360-2371 (CORRECTED 2026-08-02 at cp6-1 setup, measured against the vendored file; the old :2358-2368 was wrong at both ends and its low end declared the SHOT cue's own AUDC2 control byte 'LDA I,64' :2358 / 'STA AUDC2' :2359 out of scope — those two lines are IN scope and cp6-2's baker needs them), which tests SCORE1/SCORE2 and comments ';SET WARNING AT 15 SECONDS', ';KEEP ALARM ON FOR 2 SECONDS' and ';ALTERNATE TONE BETWEEN OFF AND ON', belongs to the TIMED-play DIP option that cp1 ruled is not modelled — do not hunt it and do not bake it. (2) Attract mode is SILENT BY ROM DESIGN, not by our omission: SOUNDS opens :2329-2336 by testing MODE (CORRECTED 2026-08-02: the attract path RTSes at :2336; :2338 is '5$: LDA FRAME', the start of the IN-SCOPE every-other-frame gate at :2338-2340) and zeroing AUDC0-3 before returning, which agrees with what cp5-2 already does shell-side. THE UPLOAD PATH EXISTS AND IS PROVEN. just deploy-assets (justfile:274-289) already bakes star-wars music and sfx and joust sfx and uploads them with scripts/deploy-r2.mjs; the bucket is named plain arcade, NOT arcade-assets, CI never touches it, and the recipe needs one more staging directory and one more bake line for centipede. plugins/joust/tools/sample-bake/ is the model for the tool and for its deploy-assets.test.mjs guard. ONE TRAP THAT WILL COST AN HOUR IF UNREAD: the justfile runs bakers under PLAIN node, where the @shared alias does not resolve, and centipede's src/shell/audio.ts imports @shared/audio at its top (:25-28) — so a baker cannot import it. joust hit this exactly and split a dependency-free src/shell/audio-manifest.ts that both the shell and the baker import, with an identity assertion so a cue added to the manifest is baked or fails loudly. centipede needs the same split. FINALLY, THE DOCS LIE TODAY: plugins/centipede/README.md:25 says baking is owned by 'the open epic sprint/epic-cp5.yaml', which is archived and done — the only breadcrumb a reader would follow is a dead end, and this epic's second story owns flipping the status line off silent."
