    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - All fourteen SOUNDS entries are accounted for individually — each names the ROM table and channel it transcribes, or is recorded explicitly as an invention with no source, and no cue is silently presented as authentic.
      - Every transcribed constant carries a radix-cited comment and a claims entry the live citation gate re-opens against the vendored CENTI4.MAC, so a wrong line number fails rather than reads plausibly.
      - Per-cue length and loop-versus-one-shot are derived from the ROM's own countdown window and table comments, not chosen by ear, and the derivation is written down so cp6-2 consumes a number rather than a judgement.
      - The non-uniform frame gating is recorded per cue (the spider's every-other-frame LSR, the bonus AND 07, the player explosion AND 03) rather than flattened into one cadence.
      - The manifest and the CHANNELS map are UNCHANGED by this story — it rules, it does not edit — and any cue the ruling finds unsourced is handed to cp6-2 as a named decision rather than quietly deleted.
      - centipede is still silent when this story closes, and the story says so plainly rather than implying progress toward sound.
      - "The sound dossier is ENROLLED in the coverage sweep, not merely written beside it: centipede's hardcoded brief.md+glossary.md pair (tests/audit/citations.test.ts:441-442, :458-461) is generalised to a DOSSIER_FILES list in joust's shape (plugins/joust/tests/audit/citations.test.ts:603) with this story's doc in it, and the enrollment is mutation-proved — deleting a citation's claim must redden the sweep, or the doc is unwatched prose that reads gated. Pre-existing unswept docs (subsystems.md, pictures.md, open-questions.md) are FILED as a follow-up, not fixed here."
    completed: '2026-08-02'
    review_findings: 'ROUND 3 APPROVED. 0 Critical, 0 High, 4 Medium, 3 Low. Rounds 1 and 2 were rejected on one standard — the dossier told its reader something false about the machine. Round 3 clears it: three independent passes (Reviewer from the vendored source, comment-analyzer, rule-checker''s FILE/LINE/EXTENT sweep) each tried to falsify every falsifiable claim in the delta and each returned a clean null. Both round-2 Highs are fixed and re-derived from the ROM, not read off the diff. (1) The header IS a voice map, and the ruling is now right — tested against its alternative: under the voice reading all four header lines hold exactly (voice 2 one STA AUDF2 :2357, voice 3 one :2349, voice 1 exactly four :2382/:2392/:2414/:2433 matching BONUS/CENTIPEDE/ANT/SCORPION one-for-one, voice 0 two :2423/:2445 which is why that line says ALL EXPLOSIONS); under the variable reading it fails on two lines, not one. (2) The branch sense now reads as the machine runs it in all three named artifacts — :2374 BEQ 48$ ;IF NO BONUS SOUND is taken when CHAN4 is ZERO and 48$ is :2396, so the bonus wins by NOT branching. Verified: all 108 claims byte-open (481/481 dossier-wide), SND-001..108 contiguous with no gaps or duplicates; every cited RANGE probed on both sides for over/under-reach and all exact (CENDE4.MAC:193-199 bounded by BONUSM/TB:); the new CENDE4.MAC file is genuinely gated because resolveInTree() keys on the claim''s own file field; whole-file AUDF/AUDC census confirms ''exactly four STA AUDF1 onto one STA AUDC1'' literally rather than section-scoped; radix correct both ways (LDY I,20. decimal, LDA I,0A4 hex); zero bare-colon citations; AC-1/3/4 met per cue; AC-5/6 hold (no src/ change, no baker, centipede still silent); centipede 1087/1087, lint clean, orchestrator 390/390 re-run serially. FINDINGS, all routed not blocked: [MED] F1 BLOCKING FOR cp6-2 — POKEY voice 0 is contended too and the ruling never says so. :2437 BEQ 52$ ;IF NO PLAYER EXPLOSION is the voice-0 twin of :2374''s bonus gate; label 52$ has exactly one referent and :2416 BNE 50$ ;ALWAYS blocks fall-through, so a live player explosion preempts all four kill cues outright. The fixture already holds every ingredient (five cues at pokeyVoice 0, both write sites claimed as SND-102/SND-104) but voiceArbitration lists only the voice-1 four, and our shell splits them (''impact'' vs ''alert'') so the clone rings both where the cabinet rings one. cp6-2 wires these channels. [MED] F2 — round 2''s open M2, now measured not argued: swapping SND-100/SND-103 and SND-102/SND-104 line numbers, and repointing scorpionLoop.voiceCite to the march''s site, all leave 1087/1087 green. Routed to TEA; open because a pf routing defect sent the rejection to finish then green, so TEA never ran. [MED] F3 — the ROM-comment guard resolves quotes against CENTI4.MAC only, excluding the CENDE4.MAC this story started citing; proved both ways (a fabricated CENDE4 quote passes 80/80, a TRUE one in '';''-form is rejected as fabricated). Disclosed by Dev, bounded, no shipped quote affected. [MED] F4 — a FOURTH artifact still inverts the branch sense: sound-dossier.test.ts:1246''s assertion label ''should branch past the arbitration''. Round 2 named three and round 3 fixed three; this survived because the diff is doc-only. Assertion and block comment are both correct — only the failure message inverts. [LOW] F5 SND-098 says the expiry tick is ''two lines below'' when :2379-2380 is five and six below :2374. [LOW] F6 :2377 is leaned on by voiceArbitration.note but absent from its cites. [LOW] F7 sec.1''s ''the remaining three variables are missing from that header'' and SND-105''s ''absence'' are true of the VARIABLES but steer away from the fact that all three cues ARE in the header — and '';CHAN 0=ALL EXPLOSIONS'' is a second, unused proof of the voice reading as strong as the CHAN1 one. Rule compliance: #13/#17 fail on F4-F5, #18 fail on F2 (carried), #19 fail on F3 but PASS on the voiceArbitration half that originated the check. Measured limit stated plainly: the dossier''s citations are byte-verified,
      its conclusions are not — both of round 3''s headline prose fixes revert with the suite green, which is why F1 is routed to cp6-2 where it becomes a testable channel decision rather than another unguarded paragraph. RETRACTED: preflight''s claim that Dev''s orchestrator report was false is wrong — Dev''s 389/390 was accurate at 18:20, the fix landed at 18:26 (4172a95), and Dev had already appended the resolution and the 390/390 to their own Delivery Finding.'
    review_verdict: approved
  - id: cp6-2
    title: Bake the samples, upload them, and prove a live 200 — the sound actually arrives
    description: "The story that ends the silence, and it is deliberately ONE story rather than a baker story followed by an upload story: a baker that stages files nobody uploaded would let this epic close green with centipede exactly as quiet as cp5 left it, which is the precise failure being repaired. Baking and shipping stand or fall together. BUILD plugins/centipede/tools/pokey-bake/, modelled on plugins/tempest/tools/pokey-bake/bake-sfx.mjs — centipede has the real POKEY data (six tables at CENTI4.MAC:2455-2465), so this is a transcription of AUDF frequency and AUDC control/volume bytes into waveforms, not the synthesis joust was forced into. Consume cp6-1's recorded lengths, loop flags and gating rather than re-deriving them. THE IMPORT TRAP, WHICH COSTS AN HOUR IF DISCOVERED RATHER THAN READ: the justfile runs bakers under plain node where the @shared alias does not resolve, and src/shell/audio.ts imports @shared/audio at :25-28, so the baker CANNOT import it. Split a dependency-free src/shell/audio-manifest.ts that both the shell and the baker import, exactly as plugins/joust/src/shell/audio-manifest.ts does, and assert the baker's SOUNDS IS the shell's record by identity — so a cue added to the manifest later is baked or throws loudly here, and never falls back to a default beep. THEN SHIP IT: extend the deploy-assets recipe (justfile:274-289) with a centipede staging directory and bake line beside star-wars and joust, mirroring plugins/joust/tools/sample-bake/deploy-assets.test.mjs as the guard that the recipe actually names this game. The bucket is plain arcade, NOT arcade-assets; CI never touches it, so the upload is a deliberate manual 'just deploy-assets' and the story is not done until it has been run. THE ACCEPTANCE TEST IS A LIVE 200 AND NOTHING ELSE. src/shared/audio.ts:176-178 swallows a 404, a blocked autoplay and undecodable data identically, so a fully green suite proves only that the code compiles — this is the same disease that kept a star-wars .wav missing from sw7-18 all the way to sw8-14. Curl all fourteen URLs under https://arcade-assets.slabgorb.com/centipede/sfx/ and paste the status codes into the story. Then PLAY IT, because a 200 on a file proves delivery and not fidelity: a decodable wav of the wrong tone passes every mechanical check in this repo. Finally flip plugins/centipede/README.md — the status line off 'playable and silent', and :25, which currently points readers at 'the open epic sprint/epic-cp5.yaml' that has been archived and done since 2026-08-01."
    points: 5
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - All fourteen URLs under the centipede sfx prefix return a live 200, with the status codes pasted into the story — a green vitest is explicitly not sufficient evidence and the story says why.
      - The samples are baked from the ROM's own FREQ and CONT tables; any cue with no table behind it is baked as a declared stand-in and labelled as one, never presented as transcribed.
      - The baker imports a dependency-free manifest module and asserts identity with the shell's SOUNDS record, so a later cue with no bake spec throws rather than falling back to a default sound.
      - just deploy-assets names centipede alongside star-wars and joust, and a guard reddens if that line is removed — the recipe is not trusted on inspection alone.
      - The game has been played with sound on and the result reported in prose, because a decodable wav of the wrong tone passes every automated check in this repo.
      - README.md no longer describes centipede as silent and no longer points at the archived cp5 as the owner of this work.
