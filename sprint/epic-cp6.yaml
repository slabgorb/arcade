stories:
  - id: cp6-1
    title: The POKEY dossier and the fourteen-cues-over-six-tables ruling — what centipede's ROM actually sounds like
    description: "Establish ground truth BEFORE anything bakes a byte, because the expensive failure mode here is a baker that invents authenticity nobody asked for. Read CENTI4.MAC:2322-2465 completely — the SOUNDS routine and its six tables — and record it in plugins/centipede/docs/rom-study/ as claims the citation gate can re-open, in the shape cp1 established for this game. Cite the VENDORED tree only: reference/atari-source/centipede/revision.v4/CENTI4.MAC. The ~/Projects/centipede-source copy is off by one from line 44 (CRLF plus form-feeds) and every line number in this epic was taken against the vendored file. THE RULING THIS STORY EXISTS FOR: shell/audio.ts declares FOURTEEN cues, and the ROM offers SIX tables plus one derived variant (the player explosion is FREQ0/CONT0 with ADC I,02 at :2444-2449, not a table of its own). Go cue by cue through SOUNDS and record, for each of the fourteen, either the table and channel it transcribes or that it is an INVENTION with no ROM source. Expect several kill cues to collapse onto CHAN0's single ';EXPLOSION SOUND' table — that collapse is the machine's behaviour and recording it is the deliverable, not a problem to design around. Do NOT edit the manifest in this story: a cue whose name survives while its sound is shared is fine and is exactly what the CHANNELS map's voice-stealing already models; a cue that turns out to be a pure invention is a note for cp6-2 to bake honestly, not a deletion to smuggle in here. ALSO RECORD, because the baker needs them and guessing them is how tones come out wrong: the per-cue LENGTH, which is the ROM's own countdown window (the CHANn seed decremented once per SOUNDS pass) over centipede's frame rate FRAME_HZ = 15750/263, the same way joust derived its FRAME_DURATIONS from STMR; the FRAME gating, which is not uniform — the spider advances every other frame (:2339-2340 'LDA FRAME / LSR / BCC'), the bonus sound gates on 'AND I,07' and the player explosion on 'AND I,3'; and which cues LOOP rather than one-shot, which the tables say out loud (CONT1 ';MUST BE REPEATED', CONT3 ';WELL REPEAT UNTIL TURNED OFF', and CHAN6's ';CONTINOUS LOOP' block reseeding 'LDY I,20.'). RADIX DISCIPLINE IS NOT OPTIONAL: .RADIX 16 is inherited from CENDE4, so bare literals are hex and only a trailing period means decimal — 'LDY I,20.' is decimal 20 while 'LDA I,14' is decimal 20 as well, by a different route, and that pair is exactly the kind of coincidence that hides a systematic misread. Every constant recorded here carries a radix-cited comment. Out of scope and named so nobody hunts them: the 15-second timed-play alarm (:2358-2368) and attract silence (:2329-2338), both settled in the epic description."
    points: 3
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - All fourteen SOUNDS entries are accounted for individually — each names the ROM table and channel it transcribes, or is recorded explicitly as an invention with no source, and no cue is silently presented as authentic.
      - Every transcribed constant carries a radix-cited comment and a claims entry the live citation gate re-opens against the vendored CENTI4.MAC, so a wrong line number fails rather than reads plausibly.
      - Per-cue length and loop-versus-one-shot are derived from the ROM's own countdown window and table comments, not chosen by ear, and the derivation is written down so cp6-2 consumes a number rather than a judgement.
      - The non-uniform frame gating is recorded per cue (the spider's every-other-frame LSR, the bonus AND 07, the player explosion AND 03) rather than flattened into one cadence.
      - The manifest and the CHANNELS map are UNCHANGED by this story — it rules, it does not edit — and any cue the ruling finds unsourced is handed to cp6-2 as a named decision rather than quietly deleted.
      - centipede is still silent when this story closes, and the story says so plainly rather than implying progress toward sound.
  - id: cp6-2
    title: Bake the samples, upload them, and prove a live 200 — the sound actually arrives
    description: "The story that ends the silence, and it is deliberately ONE story rather than a baker story followed by an upload story: a baker that stages files nobody uploaded would let this epic close green with centipede exactly as quiet as cp5 left it, which is the precise failure being repaired. Baking and shipping stand or fall together. BUILD plugins/centipede/tools/pokey-bake/, modelled on plugins/tempest/tools/pokey-bake/bake-sfx.mjs — centipede has the real POKEY data (six tables at CENTI4.MAC:2455-2465), so this is a transcription of AUDF frequency and AUDC control/volume bytes into waveforms, not the synthesis joust was forced into. Consume cp6-1's recorded lengths, loop flags and gating rather than re-deriving them. THE IMPORT TRAP, WHICH COSTS AN HOUR IF DISCOVERED RATHER THAN READ: the justfile runs bakers under plain node where the @shared alias does not resolve, and src/shell/audio.ts imports @shared/audio at :25-28, so the baker CANNOT import it. Split a dependency-free src/shell/audio-manifest.ts that both the shell and the baker import, exactly as plugins/joust/src/shell/audio-manifest.ts does, and assert the baker's SOUNDS IS the shell's record by identity — so a cue added to the manifest later is baked or throws loudly here, and never falls back to a default beep. THEN SHIP IT: extend the deploy-assets recipe (justfile:274-289) with a centipede staging directory and bake line beside star-wars and joust, mirroring plugins/joust/tools/sample-bake/deploy-assets.test.mjs as the guard that the recipe actually names this game. The bucket is plain arcade, NOT arcade-assets; CI never touches it, so the upload is a deliberate manual 'just deploy-assets' and the story is not done until it has been run. THE ACCEPTANCE TEST IS A LIVE 200 AND NOTHING ELSE. src/shared/audio.ts:176-178 swallows a 404, a blocked autoplay and undecodable data identically, so a fully green suite proves only that the code compiles — this is the same disease that kept a star-wars .wav missing from sw7-18 all the way to sw8-14. Curl all fourteen URLs under https://arcade-assets.slabgorb.com/centipede/sfx/ and paste the status codes into the story. Then PLAY IT, because a 200 on a file proves delivery and not fidelity: a decodable wav of the wrong tone passes every mechanical check in this repo. Finally flip plugins/centipede/README.md — the status line off 'playable and silent', and :25, which currently points readers at 'the open epic sprint/epic-cp5.yaml' that has been archived and done since 2026-08-01."
    points: 5
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - All fourteen URLs under the centipede sfx prefix return a live 200, with the status codes pasted into the story — a green vitest is explicitly not sufficient evidence and the story says why.
      - The samples are baked from the ROM's own FREQ and CONT tables; any cue with no table behind it is baked as a declared stand-in and labelled as one, never presented as transcribed.
      - The baker imports a dependency-free manifest module and asserts identity with the shell's SOUNDS record, so a later cue with no bake spec throws rather than falling back to a default sound.
      - just deploy-assets names centipede alongside star-wars and joust, and a guard reddens if that line is removed — the recipe is not trusted on inspection alone.
      - The game has been played with sound on and the result reported in prose, because a decodable wav of the wrong tone passes every automated check in this repo.
      - README.md no longer describes centipede as silent and no longer points at the archived cp5 as the owner of this work.
