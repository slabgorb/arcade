id: mc2
type: epic
title: Missile Command — ground truth + the guardrail before gameplay
description: "Second Missile Command epic, the deferred dossier back-fill named by mc1. Installs the fidelity guardrail BEFORE the large cited-constant surface of the gameplay epics (mc3 enemies/damage, mc4 waves/scoring), so those constants are written UNDER the citation checker instead of retrofitted — the fleet's documented reanchoring pain (tempest/red-baron/star-wars). Also resolves the two open questions mc3 blocks on: O-2 (exact sim tick from W3INT) and O-4 (real starting-city count). REUSE-FIRST: port joust/centipede's tools/audit/check-citations.mjs + tests/helpers/claims.ts + docs/rom-study/{subsystems.md,glossary.md,claims/}; invent no new machinery. DESIGN: plugins/missile-command/docs/design/mc2-dossier.md. GROUND TRUTH: plugins/missile-command/docs/rom-study/brief.md (REV-01, historicalsource @ bab468c). TRAPS the checker must survive: W3MAIN is double-spaced (cite LOGICAL non-blank lines, ~physical/2); .RADIX 16 at W3COMN:1 (bare=hex, trailing '.'=decimal); CR-terminated non-UTF8 .MAC (grep -a). O-3 (REV-01 vs REV-03 deltas) stays a running open question, not a story; O-5 (palette) rides with mc4."
priority: p2
status: backlog
repos: arcade
stories:
  - id: mc2-1
    title: Citation checker + claims format, guarding the skeleton
    description: |-
      Port joust/centipede's citation-checker machinery onto missile-command and retrofit EVERY constant the mc1 skeleton hardcoded into an enforced claim. Today every citation in the skeleton (field.ts CITIES/BASES/NCITY/NMISBA, cursor.ts IHMIN/IHMAX/IVMIN/IVMAX/TOPSCR, explosion.ts EXDONE, abm.ts velocity, render.ts LOGICAL_HEIGHT) lives in a code COMMENT checked by nobody. This story turns those into machine-verified claims so mc3/mc4 write their large constant surface UNDER the guardrail rather than retrofitting it later.

      REUSE-FIRST: copy the shapes from plugins/joust/tools/audit/check-citations.mjs + plugins/joust/tests/helpers/claims.ts (centipede carries the same). Establish plugins/missile-command/docs/rom-study/claims/*.json. Invent no new machinery.

      THREE TRAPS the checker MUST survive (memory: mc-w3main-cite-double-spaced): (1) W3MAIN is DOUBLE-SPACED — resolve LOGICAL (non-blank) line numbers ~physical/2, cite via .SBTTL/symbol not physical offset; (2) .RADIX 16 at W3COMN.MAC:1 inherited everywhere — a bare number is HEX, a trailing '.' is DECIMAL (MAXMIS=10. vs CITY2H=0B4); (3) the vendored .MAC are CR-terminated non-UTF8 — grep -a or they read as binary false-empty.

      Design: plugins/missile-command/docs/design/mc2-dossier.md. Ground truth: docs/rom-study/brief.md.
    points: 5
    priority: p2
    status: done
    started: '2026-08-06'
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - "tools/audit/check-citations.mjs + tests/helpers/claims.ts exist under plugins/missile-command/, adapted from the joust/centipede shape; a claims/*.json set encodes each skeleton constant as {symbol, value, module, line, meaning}."
      - "The checker reads the vendored reference/source/*.MAC and FAILS when a claimed symbol/value/line disagrees with it — radix-aware (hex default, trailing-'.' decimal), W3MAIN logical-line-aware, grep -a-safe on CR-terminated files. Proven by a deliberately-wrong claim reddening it, then reverted."
      - "Every constant currently hardcoded in src/core and src/shell (field.ts, cursor.ts, explosion.ts, abm.ts, render.ts) is represented by a claim; a guard test asserts no un-cited numeric literal remains in src/core."
      - "Wired as a missile-command surface: 'npx vitest run --project missile-command', 'npm run lint', and 'npm run test:orchestrator' all pass."
    completed: '2026-08-06'
    type: chore
    review_findings: "Round 2 APPROVED. Rework closed F1 (claim value now verified via verbatim radix double-entry, mutation-proven), F2 (header prose reconciled: W3MAIN logical / W3COMN physical), F3 (CLI JSON.parse reports cleanly, exit 2). F4 deferred to mc2-2. 194/194 + lint + 398/398."
    review_verdict: approved
