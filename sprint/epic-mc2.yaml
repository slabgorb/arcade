    title: subsystems.md + glossary.md source-of-record docs
    description: |-
      Expand brief.md's subsystem map and constant table into the two standing reference docs the rom-fidelity-audit and every later story read (joust/centipede shape: docs/rom-study/subsystems.md + glossary.md). subsystems.md is the per-subsystem module + .SBTTL anchor index; glossary.md is the per-symbol decoded dictionary. Where a value is mechanically checkable it should be backed by an mc2-1 claim so the docs cannot silently drift from source.

      Radix discipline throughout: bare = hex, trailing '.' = decimal (W3COMN.MAC .RADIX 16 at :1).
