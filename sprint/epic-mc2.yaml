  - id: mc2-3
    title: 'O-2: pin the exact sim tick from W3INT'
    description: |-
      Resolve open question O-2: read W3INT.MAC in full and derive the game-logic tick — which IRQ advances game logic and how the FRAME counter increments — reconciled against MAME's authoritative board model (VSYNC 61.0076 Hz, 4 IRQs/frame at V=0,64,128,192, VBLANK when V<24; missile.cpp:485-497,528-532). This pins the TIME UNIT that mc3 enemy descent speed and every missile velocity is expressed in, so it must land before the threat loop.

      Note the CPU half-speed band from scanline 224 (missile.cpp:542-555) when reasoning about per-frame work, and record both the exact rate and the nominal-60 fallback. brief.md references FRAME globals at W3DSUP.MAC:19 and a read at W3MAIN.MAC:2039.
