id: jt12
type: epic
title: 'Joust — wire the unwired RV4 fidelity mechanics: baiter anti-farming, smart-enemy budget refund, transporter player queue'
description: "Twelfth Joust epic. Three ROM behaviours are fully implemented, unit-tested, and reachable in the sim's data model, but have ZERO production callers, so the live game silently diverges from JOUSTRV4.SRC — every one a self-confessed scope boundary a follow-up story never closed (unwired-feature audit 2026-08-16). (1) The five RV4 anti-farming PATCHES (PATCH4/5/6/8/9, JOUSTRV4.SRC:6268 'PATCHES TO PREVENT PLAYER FROM PTERODACTYL HUNTING') live as pure functions in core/baiter.ts:199-248 but stepPteroFlight (core/ptero.ts:140) and resolvePteroAttack (:175) take no baiter argument, so a live baiter is mechanically identical to a plain wave pterodactyl — the anti-camping difficulty never engages (confession baiter.ts:8-10: jt3-7 wired the spawn cadence, not the patches). (2) The WSMART intelligence-budget economy only ever DEBITS: promote (wired, frame.ts:407) increments nsmart, but creditDeath (core/enemy.ts:566, CREEM JOUSTRV4.SRC:2962) and remountBudgetDebit (core/egg.ts:339) have no callers, so mid-wave nsmart climbs monotonically, latches at wsmart, and no further enemy can turn smart no matter how many the player kills — the game gets EASIER than the ROM. (3) The transporter's player-side service queue and SELARE area-occupancy safety (takePlayerNumber/servePlayer/nextServed/scanAreas/spawnProceeds, core/transporter.ts, JOUSTRV4.SRC:5615-5676) are unwired while the enemy side is fully wired; respawnPlayerProcess (sim.ts:630) builds a fresh player directly, so npserv==lpserv forever (the 'players first' clause in the wired enemyTurn is a dead-true branch) and enemies materialise with no crowded-third check. All three reuse existing tested code — this epic is wiring, not new systems. Ground truth: JOUSTRV4.SRC (RV4 revision). Every wire lands with a test that fails without it (mutation-verified per the joust suite conventions) and keeps purity/comment-line-refs green."
priority: p2
status: backlog
