    review_verdict: approved
  - id: ml9-2
    title: "In-game graphics wrong colour + missing sprites vs MAME (compare sprint/planning/ml9-playthrough-refs/ingame-mame-reference.png to ingame-ours-current.png). Defects: (a) mushrooms render with the wrong palette/shape — MAME shows pink-cap/teal-stem umbrellas, ours look like red/white/green radishes; (b) DDT bomb graphic is missing — MAME shows blue rounded 'DDT'-labelled boxes, ours shows none; (c) the green playfield/grass floor band along the bottom is absent in ours; (d) overall colouring is off. Seams: shell/render.ts, shell/gfx-rom.ts, shell/playfield-palette.ts, core/palette.ts. Group the fixes by file surface per the epic rule; TEA/Architect may split if a sub-defect lives in a different file."
    description: "In-game graphics wrong colour + missing sprites vs MAME (compare sprint/planning/ml9-playthrough-refs/ingame-mame-reference.png to ingame-ours-current.png). Defects: (a) mushrooms render with the wrong palette/shape — MAME shows pink-cap/teal-stem umbrellas, ours look like red/white/green radishes; (b) DDT bomb graphic is missing — MAME shows blue rounded 'DDT'-labelled boxes, ours shows none; (c) the green playfield/grass floor band along the bottom is absent in ours; (d) overall colouring is off — millipede's alphanumeric glyph ink maps to green via drawGridStamps' default flatPalette. SCOPE ALSO INCLUDES (folded from ml9-1 review, 2026-08-15): the attract enemy-showcase screen text colours — MAME shows WHITE high scores + RED creature labels; ours renders all green (same palette root cause). Recolour needs per-section palettes and a decision on cell backgrounds (black boxes vs blue show-through). Seams: shell/render.ts, shell/gfx-rom.ts, shell/playfield-palette.ts, core/palette.ts, and core/attract-showcase.ts (showcase text colours). Group fixes by file surface per the epic rule."
