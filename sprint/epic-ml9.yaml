id: ml9
type: epic
title: Millipede — playthrough visual-fidelity findings (owner-observed; expect this epic to GROW)
description: 'Ninth Millipede epic: visual/rendering fidelity gaps the owner found while actually PLAYING the shipped cabinet, not from ROM audit. Screenshots preserved at sprint/planning/ml9-playthrough-refs/ (attract-mame-reference.png, ingame-mame-reference.png = MAME ground truth; ingame-ours-current.png = our current render). These are shell/render + palette bugs, not core-sim: the seams are plugins/millipede/src/shell/render.ts, shell/gfx-rom.ts, shell/playfield-palette.ts and core/palette.ts, plus core/attract.ts (attract machinery ALREADY EXISTS in core — the intro-screen gap is likely render/wiring, NOT a from-scratch build; verify before scoping). GROUPING RULE (inherit ml8): group stories by the FILES they edit, not by which sprite looks wrong — several sprite/colour fixes that all live in render.ts/palette.ts are one story with several commits. Open-ended by design; seed stories below are the two findings reported at filing, points are seed-only.'
priority: p2
status: backlog
repos: arcade
stories:
  - id: ml9-1
    title: "Attract-mode enemy-showcase screen is missing (the 'cast of characters' + high-scores + 1 COIN 1 PLAY screen)"
    description: "Playthrough finding (owner). The ROM attract-mode enemy-showcase screen (reference: sprint/planning/ml9-playthrough-refs/attract-mame-reference.png — blue background, HIGH SCORES table of 8 initials, one labelled panel per creature: DRAGONFLY MOSQUITO BEE EARWIG GROWTH INCHWORM BEETLE DDT-BOMB MILLIPEDE SPIDER, and the '1 COIN 1 PLAY' / 'BONUS EVERY 15000' / 'COPYRIGHT ATARI 1982' footer) does not exist in our cabinet. MEASURED 2026-08-15 by SM pre-setup: grep found NO creature-name panels, NO COIN/COPYRIGHT text, NO render path for this screen anywhere in plugins/millipede/src. This is a NEW render surface to BUILD, not a wiring fix. Do NOT conflate with two things that DO already exist: core/attract.ts is the self-playing silent demo (lobby carousel), and ml7-3 hud.ts is the in-game HUD (score/lives/hi-score/DDT). The build can REUSE existing assets: shell/gfx-rom.ts sprite decoders, the font/charTile stamps in shell/render.ts, and the highscore table data. Cite the ROM source for the showcase layout, colours and label text before pinning. Seams: shell/render.ts (new draw path) and possibly a new attract-showcase phase in core if the screen must cycle with the demo."
    points: 3
    priority: p2
    status: in_progress
    started: '2026-08-15'
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - "A render path draws the attract enemy-showcase screen matching attract-mame-reference.png: blue background, HIGH SCORES table, one labelled panel per creature, and the '1 COIN 1 PLAY' / 'BONUS EVERY 15000' / 'COPYRIGHT ATARI 1982' footer."
      - Layout, colours and label text are pinned to the ROM/MAME source with citations, not eyeballed.
      - The showcase screen is reachable in attract mode (cycles with or replaces the existing silent demo per ROM behaviour) and does not regress the in-game HUD or the self-playing attract demo.
    type: bug
  - id: ml9-2
    title: "In-game graphics wrong colour + missing sprites vs MAME (compare sprint/planning/ml9-playthrough-refs/ingame-mame-reference.png to ingame-ours-current.png). Defects: (a) mushrooms render with the wrong palette/shape — MAME shows pink-cap/teal-stem umbrellas, ours look like red/white/green radishes; (b) DDT bomb graphic is missing — MAME shows blue rounded 'DDT'-labelled boxes, ours shows none; (c) the green playfield/grass floor band along the bottom is absent in ours; (d) overall colouring is off. Seams: shell/render.ts, shell/gfx-rom.ts, shell/playfield-palette.ts, core/palette.ts. Group the fixes by file surface per the epic rule; TEA/Architect may split if a sub-defect lives in a different file."
    points: 5
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
