id: df3
type: epic
title: 'Defender — the ship + the scheduler (phase 4a): the cooperative process kernel, the player ship, and the scrolling wrap-around world — the first epic that steps a clock'
description: "Third Defender epic and phase 4a of the framebuffer-raster cabinet build (docs/playbooks/next-sprite-game.md), the novel-heavy epic the roadmap flags as 'the one to watch'. Builds the cooperative process scheduler core (SLEEP/KILL/MKPROC/MSPROC dispatched through DISP2, DEFA7.SRC:12-130; PTIME/PADDR/PTYPE/PCOD process records off the FREE list), the player ship (24-bit PLAXV sub-pixel velocity DEFA7.SRC:2360-2371,2480-2499; thrust; REV reverse-facing DEFA7.SRC:3155-3171; vertical clamp DEFA7.SRC:2441-2476), the scrolling wrap-around WORLD + camera, the parallax starfield (STINIT/STOUT DEFA7.SRC:2095-2155, STRCNT), and the laser (LFIRE max-4 DEFA7.SRC:2761-2870). Stands on df1 (dossier + citation gate + src/core purity test) and df2 (the framebuffer render seam, palette, charset, object/terrain tables — pixels, INERT). Every constant df3 introduces re-opens under the df1-1 gate: no src/core value without a claims/*.json entry. THE CORE MODEL (RULED, not a choice — ROM-always-wins): df3 ports the ROM's own world/camera representation into src/core line-for-line and citable, NOT a tidier world-absolute re-derivation. BGL 'TERRAIN LEFT POINTER' (PHR6.SRC:215) is the camera = world-X of the screen's left edge; the world is a 16-BIT HORIZONTAL CYLINDER wrapping at $10000; BGLX (PHR6.SRC:216) is last frame's camera for the scroll delta. Entities live in DISPLAY space (OX16/OY16, integrated by VELO DEFA7.SRC:2480-2499); absolute world X = onscreen + BGL is a PURE HELPER (PLABX PHR6.SRC:335, DEFA7.SRC:2432-2440). The SHIP LEADS THE SCROLL: PLAY1 (DEFA7.SRC:2373-2431) maps velocity to a target screen column (base $20 facing-right / $70 facing-left) and slides BGL by BGDELT (±$40 steps, ±$100 clamp) so the ship is pushed forward — the single riskiest seam, defined in display space (an absolute-space rewrite would silently drift: routing != geometry). Vertical is a CLAMPED STRIP not a cylinder: YMIN=42 / YMAX=240 (PHR6.SRC:20-21, decimal), player Y clamps [YMIN+1,238] (DEFA7.SRC:2450,2461) while object Y wraps [YMIN,YMAX] (DEFA7.SRC:2490-2496) — two rules on one axis. Timebase binds here (df2 read no clock): the nominal 60 Hz / 16-msec nap tick is the scheduler quantum (fixed-timestep 60 Hz, @shared/loop drives shell rAF -> pure stepTick(); core stays clock-free); df1-4 resolved the IRQ model (CB1 video interrupt, COUNT240/CA1 never enabled, VERTCT polled). Scheduler is the jt2 Williams-kernel PATTERN, re-derived and re-cited from THIS tree (plugins/joust/src/core is prose reference only, never imported). No new @shared extraction (scheduler is a pattern reuse; the coordinate model is defender-specific with no second consumer — the 'extract on the second game' bar is not met). Design + full story rationale: docs/superpowers/specs/2026-08-15-defender-df3-ship-scheduler-design.md; roadmap parent: docs/superpowers/specs/2026-08-13-defender-cabinet-roadmap-and-df1-design.md sec 4 df3 (approx 24 pts). Reuse-first: df2 framebuffer.ts + src/shell/render.ts (index blit), @shared/loop (fixed step), df2 transcribed palette (new visuals reach colour by INDEX only, never hex). Traps carried in: routing-!=-geometry (pin COORDINATES of the camera slide, not just scroll direction); the vertical axis has two rules; PLAXV is 24-bit (don't truncate to 16); sim rate is 60 Hz (not a divided sub-rate); STOUT carries self-modifying code (FCB-patched stores, the 'BSO BONER' comments DEFA7.SRC:2151-2153 — transcribe behaviour not opcodes); line numbers from tool output only; RASM radix ($hex vs bare decimal). OUT OF SCOPE: enemies/menagerie/collision-vs-enemies/materialize-explode (df4), waves/scanner/smart-bomb/hyperspace/score/2P (df5), sound (df6), attract->play phase machine/HUD/showcase (df7). ACCESSIBILITY FORWARD-NOTE (binds df4/df5, recorded df1): smart-bomb and hyperspace flash the full screen in the ROM (SBOMB DEFA7.SRC:3199 COM PCRAM; HYPER DEFA7.SRC:3211) — those become freeze/fade in df5 (owner photosensitivity, the one exception to ROM-always-wins); df3 renders NO full-screen flash."
