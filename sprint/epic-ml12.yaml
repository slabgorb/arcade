  - id: ml12-3
    title: DDT has no effect killing millipede segments — deploying DDT does not damage/kill the train (gameplay, NOT the already-shipped ml9-3/ml11 DDT visual)
    description: "Owner playtest finding (2026-08-17): DDT has NO EFFECT killing millipede segments — deploying a DDT bomb does not damage or kill the train. HARD TRAP — this is DDT *gameplay*, NOT the DDT *visual*: ml9-3 + ml11 already shipped the DDT blue-box + red 'DDT' glyph (shell/ddt-glyph.ts, wired main.ts). Do NOT close this as 'DDT already done' by pointing at the visual, and do NOT refile the visual — the visual renders; the KILL does not land. HYPOTHESIS (unverified, verify against ROM + live code before pinning): the DDT explosion/cloud is not applying its segment-kill (the cloud may deploy and render but its damage region never intersects/marks millipede segments, or the sim never runs the DDT-vs-segment resolution). Likely seam: core/ddt.ts (explosion/cloud state + radius) and the segment-damage path in core/sim.ts and core/millipede.ts (note obstacle.ts already lets a head pass THROUGH a DDT cloud — code < DDT returns 'none', millipede.ts:64 — so the kill is a separate mechanic from the turn logic, confirm which). STORY: derive DDT's segment-kill behaviour from the millipede ROM and wire it so a deployed/triggered DDT actually kills the segments in its blast per ROM. Every changed core constant carries a citations.test.ts-gated claim. Confirm LIVE at /millipede/ that DDT kills train segments."
    points: 3
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - "A triggered DDT kills the millipede segments within its blast region per the ROM: pinned by a core test that places segments inside a triggered DDT's radius and asserts they are removed/killed (and segments outside are not), with the DDT damage geometry/timing cited to the millipede ROM and gated by citations.test.ts."
      - 'The fix is DISTINCT from and does not regress the shipped DDT visual (ml9-3/ml11 glyph) nor the head-passes-through-cloud turn behaviour (obstacle.ts): the existing DDT/glyph and millipede-turn tests stay green while the new kill lands.'
      - 'Verified LIVE at the /millipede/ visual playtest: deploying DDT visibly kills train segments in its blast, with no full-screen strobe/flash introduced (ml7-4 owner-epilepsy accessibility gate).'
    type: bug
