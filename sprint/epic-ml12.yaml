id: ml12
type: epic
title: 'Millipede — owner playtest findings round 2 (2026-08-17): the train enters one row too high over the score, heads wrap horizontally off-screen instead of turning at the edge, and DDT does not kill segments'
description: "Twelfth Millipede epic — owner-observed playtest findings (the ml9 model: bugs found while actually PLAYING the shipped cabinet, not from ROM audit; expect this epic to GROW). Three findings reported at filing (2026-08-17). SEAMS BELOW ARE UNVERIFIED HYPOTHESES for the pipeline to confirm/refute against the ROM + live code — they are NOT audited citations (SM did light seam discovery only; TEA/Architect must ground each before pinning). (1) TRAIN ENTERS ONE ROW TOO HIGH — like the analogous centipede bug, the train spawns a row above where it should and runs over the score/HUD. Likely seam: the enter row (ENTER_V / spawn V) in core/millipede.ts vs the top-of-play boundary the HUD occupies (core/hud.ts). (2) HEADS WRAP HORIZONTALLY OFF THE SIDE — a head runs off one edge and re-enters from the other, sometimes repeatedly, so the train runs perfectly horizontally across the screen several times instead of turning+dropping at the edge. Likely seam: wrapH (core/millipede.ts:144, 'h & 0xff' — the mod-256 wrap the comment flags) racing the screen-edge turn (atEdge / LEFT_EDGE=0xF0 / RIGHT_EDGE=0x10, core/millipede.ts:82-83,323); the edge-turn may not be firing so the head wraps. (3) DDT DOES NOT KILL SEGMENTS — deploying DDT appears to have no effect on millipede segments. Likely seam: core/ddt.ts explosion/cloud vs the segment-kill path in core/sim.ts. TRAP — do NOT conflate with the DDT *visual* already shipped: ml9-3 + ml11 delivered the DDT blue-box + red 'DDT' glyph (shell/ddt-glyph.ts); THIS finding is about DDT *gameplay* (killing segments), a different subsystem — do not refile the visual as fixed and do not assume this is already done. GROUPING RULE (inherit ml8/ml9): group stories by the FILES they edit, not by which symptom looks wrong. ACCESSIBILITY GATE STILL BINDS (standing owner-epilepsy exception to ROM-always-wins): no full-screen strobe/flash on any transition; re-verify at the /millipede/ visual playtest. Ground truth is the millipede ROM source (MILLI.MAC / MLSUB.MAC etc.); every new/changed core constant carries a citations.test.ts-gated claim. Verify each fix LIVE in the build (the ml9 green-tests/wrong-pixels lesson), not just green vitest. OUT OF SCOPE: new subsystems; sound; the already-shipped DDT visual."
priority: p2
status: backlog
repos: arcade
