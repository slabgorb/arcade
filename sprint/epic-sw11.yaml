id: sw11
type: epic
title: Star Wars trench — restore authentic return-fire lethality and seat the wall guns flush
description: "Follow-up epic from the sw10 native-basis migration (archived). sw10-1/2/3 unified the trench onto the ROM-native world basis, which as a SIDE EFFECT made the wall guns' return fire connect for the first time: before sw10, trenchGunFireVelocity computed its lead on a depth axis (index 2) that disagreed with the gun positions, ship point and swept-collision (all since moved to index 0), so every base-gun shot flew off-axis and MISSED — the trench was accidentally survivable. With the basis unified the fire is functional, and the trench is now unplayable (~3 s to burn all 6 shields). Root cause is NOT a constant over-tune — every difficulty constant is ROM-cited and faithful (TGPROB cadence/threshold WSBASE.MAC:1224, range #6000, 0.5 s shield debounce S-016, 6 starting shields, gun density from the ROM pie tables). The defect is a MECHANISM divergence in the DOBASE/BSGUN/PANLIN/MOVPL port, on THREE independent axes (all detailed in sw11-1), the largest being AIM: the cabinet never leads the ship — it sprays a random-angle shell that heat-seeks weakly and often misses; our port fires a perfect analytic lead that never misses. REFERENCE AUTHORITY: the 1983 assembler source (~/Projects/star-wars-1983-source-text, WSBASE.MAC + WSGUNS.MAC) is the sole authority for this logic. MAME's starwars driver (~/Projects/mame/src/mame/atari/starwars.cpp) is hardware emulation only — matrix processor, math box, AVG vector PROM — that EXECUTES the real 6809 game ROM; it does not reimplement the trench gun logic (grep for trench/bunker/BSGUN in src/mame/atari/ returns nothing), so it corroborates only the coordinate scale we already port and adds no fire-mechanism detail. sw11-2 fixes the visual half of the same sw10 orient retirement: the wall guns render cantilevered off the wall because TRENCH_ORIENT was retired to IDENTITY and no per-wall seating/mirror replaced it."
priority: p1
status: backlog
repos: arcade
stories:
  - id: sw11-1
    title: "Trench return-fire is grossly too lethal — port the ROM's THREE base-gun mechanisms the sw10 basis unification newly exposed. Every difficulty CONSTANT is already faithful; these are MECHANISM omissions (cf. asteroids-rom-retune). Our stepTrench fires every 'turret' within TRENCH_GUN_FIRE_RANGE (0x6000) each opening on a flat `nextInt(rng,256) > threshold` roll, spawns a PERFECT analytic lead (trenchGunFireVelocity), and caps concurrent shots at MAX_FIREBALL_SLOTS (6). The cabinet does all three very differently. (1) AIM — biggest lever. The ROM never leads: PANLIN (WSGUNS.MAC:409-432) spawns the shell at the gun's OWN panel position with a semi-random Z angle (`LDA P.RND1 / LSRA ;45 DEGREES`), top-panel guns level; then MOVPL/MOVPR (WSGUNS.MAC:788-846) move it with a heavily DAMPED, DIRECTIONALLY-LIMITED heat-seek — Z drifts toward the player at ASRD4 (>>4 = 1/16 of the gap per frame); Y only heat-seeks the player from WV.HRD>=1 (`CMPA #1 / IFHS ... LDD M$TY ;HEAT SEEK`), and below that just drifts to +/-180 (channel centre), and a LEFT-wall shell may ONLY move right, a RIGHT-wall shell ONLY left. Net: authentic shells scatter and usually miss; ours never do. Replace the closed-form lead with a random-angle spawn + damped per-frame heat-seek matching MOVPL/MOVPR. (2) CONCURRENCY — GNBSAVAIL (WSGUNS.MAC:210-244) caps base-gun shells by the per-difficulty TGNBS table `GUNZ-<N*G$IZE>` = N airborne, N = [1,1,2,2,3,3,3,4] over WV.HRD 0..7. Wave-1 trench (WV.HRD 0) allows just ONE base shell in the air; our flat 6 is 6x. Cap concurrent base shots at TGNBS[gunDiff], not MAX_FIREBALL_SLOTS. (`GNAVAIL`/'FIRE EVERYTHING' is the port-in-view end-run only.) (3) ELIGIBILITY — BSGUN (WSBASE.MAC:1236-1341) fires a gun only when the player is ABOVE the bunker (`SUBD M.Z0 / IFGE ?PLAYER ABOVE BUNKER?`) AND within the near height band (`SUBD #400 / IFLT`) at full prob, OR within one lower band at the SQUARED prob `P.RND1 * P.RND1` (two uniforms => skewed low); never below, and never point-blank (`ADDA #20+4 ;(DONT SHOOT IF TOO CLOSE)`). #400 is one wall-panel height (Z walks -0200 down by #400 x4); map to our WALL_SLOT_Y spacing. Port the vertical-alignment gate + squared far-branch + too-close exclusion into the stepTrench gun loop. Pin all three with deterministic tests (fixed seed + fixed player height: assert only the aligned subset fires, a point-blank gun never fires, concurrent base shots <= TGNBS[gunDiff], and a spawned shell's angle is the random/level value not a lead). Verify playability by hand on the dev server."
