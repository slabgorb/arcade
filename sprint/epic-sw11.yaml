  - id: sw11-2
    title: "Trench wall guns render cantilevered off the wall instead of flush, facing the wrong way. TRENCH_TURRET is placed on BOTH side walls (trench-obstacles.ts streamPanelSlots: pos = [depth, wallX = +/-W, slotHeight]) but drawn with a single fixed orientation — render.ts:585 uses `modelMatrix(o.pos, TRENCH_ORIENT)` and TRENCH_ORIENT was retired to IDENTITY by sw10-1. The model's `.WP WGA` base is a plate in the horizontal (x-z) plane with a single barrel direction (models.ts:726; the doc comment says 'ORIENTATION is the shell's job (render.ts)'), so with no per-wall rotation it cannot sit flush on a vertical side wall and its barrel points the wrong way on at least one wall. The ROM proves the two walls are MIRROR images: BSGUN mounts the barrel at `M.Y0 = -380 ;GUN BARREL ON LEFT WALL` (FRPLGN) vs `M.Y0 = +380 ;GUN BARREL ON RIGHT WALL` (FRPRGN), WSBASE.MAC:1251/1295, and PANLIN gives the shell MOV$PL vs MOV$PR so left/right guns are handled as mirrors throughout. Fix in the render/placement layer (core is pure): seat the turret base against the vertical wall and mirror/rotate per wall from the sign of o.pos[1] (right axis) so the barrel points INTO the channel on both walls. Render-only orientation change — MUST be eyeballed on the dev server (port 5270, /star-wars/); structural tests can't catch orientation (render.ts:168). Apply the same audit to TRENCH_SQUARE/TRENCH_CATWALK while here — they share the IDENTITY-orient placement but read less obviously wrong."
    points: 3
