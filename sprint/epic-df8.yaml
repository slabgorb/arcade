    status: backlog
    repos: arcade
    workflow: tdd
  - id: df8-2
    title: 'defender: full-screen flash/artifact during play'
    description: 'Playtest 2026-08-20: a flash/artifact fills the whole playfield during play (dense red-dot field covering the screen). Reference screenshot: docs/playtest/df8-defender-flash-2026-08-20.png. Investigate the raster compose path (core/scene.ts composeFrame) — determine whether this is a background-fill/palette bug, a mis-timed effect wash, or a render layering issue. NOTE accessibility: any fix must respect the no->3Hz/large-area luminance strobe rule (photosensitive-epilepsy safety outranks ROM fidelity).'
