stories:
  - id: df8-1
    title: "defender: rethink thrust/reverse controls — 'a'=switch + 'd'=thrust regardless of heading is confusing"
    description: "Playtest 2026-08-20: the current keys are confusing — 'a' switches the ship's facing and 'd' thrusts, but thrust ignores the visible heading, so players can't predict which way they'll move. Revised proposal (s is needed for DOWN): use w=up, s=down for vertical movement, and a=thrust-left, d=thrust-right for horizontal — where each thrust key ALSO sets the ship's facing to match. That makes a separate 'switch/reverse' key unnecessary (direction is implied by which thrust key you press) and keeps 's' free for down. Evaluate against the Defender ROM/cabinet control convention (2-way reverse + thrust + up/down) before committing; shell/input only — must not touch core sim determinism."
    points: 3
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
  - id: df8-2
    title: 'defender: full-screen flash/artifact during play'
    description: 'Playtest 2026-08-20: a flash/artifact fills the whole playfield during play (dense red-dot field covering the screen). Reference screenshot: docs/playtest/df8-defender-flash-2026-08-20.png. Investigate the raster compose path (core/scene.ts composeFrame) — determine whether this is a background-fill/palette bug, a mis-timed effect wash, or a render layering issue. NOTE accessibility: any fix must respect the no->3Hz/large-area luminance strobe rule (photosensitive-epilepsy safety outranks ROM fidelity).'
    points: 3
