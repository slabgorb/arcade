    title: "defender: rethink thrust/reverse controls — 'a'=switch + 'd'=thrust regardless of heading is confusing"
    description: "Playtest 2026-08-20: the current keys are confusing — 'a' switches the ship's facing direction and 'd' thrusts, but thrust ignores the ship's visible heading, so players can't predict which way they'll move. Proposal to evaluate: an a-s-d layout where 's' switches direction and BOTH 'a' and 'd' thrust (a=thrust left, d=thrust right), so the thrust key matches the intended direction directly. Check the Defender ROM/cabinet control convention (2-way reverse + thrust button) before committing to a mapping; this is shell/input only — must not touch core sim determinism."
    points: 3
