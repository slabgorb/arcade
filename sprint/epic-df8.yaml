title: 'Defender follow-ups: controls rethink + visual bugs (playtest 2026-08-20)'
description: "Follow-up epic from the 2026-08-20 defender playtest. Two observations: (1) the thrust/reverse control mapping is confusing — 'a' switches direction and 'd' thrusts regardless of the ship's current heading, which fights player intuition; (2) a full-screen flash/artifact appears during play. Screenshot saved at docs/playtest/df8-defender-flash-2026-08-20.png."
priority: p2
status: backlog
repos: arcade
stories:
  - id: df8-1
    title: "defender: rethink thrust/reverse controls — 'a'=switch + 'd'=thrust regardless of heading is confusing"
    description: "Playtest 2026-08-20: the current keys are confusing — 'a' switches the ship's facing and 'd' thrusts, but thrust ignores the visible heading, so players can't predict which way they'll move. Revised proposal (s is needed for DOWN): use w=up, s=down for vertical movement, and a=thrust-left, d=thrust-right for horizontal — where each thrust key ALSO sets the ship's facing to match. That makes a separate 'switch/reverse' key unnecessary (direction is implied by which thrust key you press) and keeps 's' free for down. Evaluate against the Defender ROM/cabinet control convention (2-way reverse + thrust + up/down) before committing; shell/input only — must not touch core sim determinism."
    points: 3
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
  - id: df8-2
    title: 'defender: full-screen flash/artifact during play'
    description: 'Playtest 2026-08-20: a flash/artifact fills the whole playfield during play (dense red-dot field covering the screen). Reference screenshot: docs/playtest/df8-defender-flash-2026-08-20.png. RESOLVED (2026-08-21): the red/green dot grid was the pt1-25 ADR-0005 screen wash (drawScreenWash) painting palette indices 2=RED/3=GREEN on a stride-3 lattice, mis-read as a dim ramp. Removed the wash (screen effects paint nothing full-field). The old accessibility caveat is superseded: the owner has epilepsy but is NOT photosensitive (ADR-0005 amended 2026-08-21), so strobe/flash is not a personal trigger and ROM fidelity is not gated on it.'
    points: 3
    priority: p2
    status: done
    repos: arcade
    workflow: tdd
    completed: '2026-08-21'
    type: bug
  - id: df8-3
    title: 'defender: remove the invented spawn/death spark ring (green diamond around enemies)'
    description: 'Playtest 2026-08-20: every spawning/dying enemy was enclosed in a green diamond outline (drawRing in core/scene.ts), radius 6-10px around each localized appear/explode effect — pure non-ROM invention (an ADR-0005-era accessibility spark) the owner did not want. Real Defender has no such ring. Removed drawRing; localized effects now raster their sprite only, like the ROM. Delivered together with df8-2 (same drawEffect function) in the same branch/PR.'
    points: 1
    priority: p2
    status: done
