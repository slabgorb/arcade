  - id: uf1-18
    title: the origin collapse widened the showcase iframe's default permissions beyond autoplay
    description: "Raised by the Task 15 implementer as a deliberate scope boundary, 2026-07-30, and filed rather than left in a report. The lobby's showcase carousel frames live games. Before the monorepo migration each game sat on its own subdomain, so the pane was a CROSS-ORIGIN frame and every Permissions-Policy feature whose default allowlist is `self` was denied to it automatically, by origin, without anyone declaring anything. The single-origin collapse makes that frame SAME-ORIGIN, so every one of those features now matches by default. Task 15 found and fixed the autoplay half the hard way — it had assumed allow=\"\" denied autoplay, and measurement in real Chromium showed allow=\"\" is behaviourally identical to omitting the attribute (both grant), while allow=\"autoplay 'none'\" denies. The shipped fix names autoplay explicitly. But autoplay is not the only self-defaulted feature: fullscreen, camera, microphone, geolocation, display-capture, midi and others default to `self` too, and the same reasoning applies to all of them. No shipped game requests any of these today, so this is posture rather than an active bug — but the pane's stated purpose is to be STRUCTURALLY incapable of surprising the visitor, and it currently rests on no game ever asking. The Task 15 implementer deliberately scoped its fix to autoplay because that is the only guarantee the pane ever claimed, on the reasoning that silently widening the policy would be the same overreach in the other direction. That judgement was right and is why this is a separate story. Decide the pane's real policy and declare it: an explicit deny-list of the features a game frame has no business requesting, or a documented decision that same-origin games are trusted with them. Measure in a real browser rather than reasoning from the spec — that is exactly what went wrong the first time."
    points: 2
    priority: p2
    status: backlog
    repos: arcade
