  - id: uf1-15
    title: star-wars C_AS's fire cone is INVENTED — the ROM's own gate is a squared screen radius (WSCPU.MAC:615-618)
    description: "Found by TEA during uf1-12's RED phase while answering that story's own open question (\"does WSMAIN.MAC:3930's gate give a portable threshold that could retire the C_AS guess too?\" — it does NOT; the two bits are set by different machines on different sides of the fight). tie-status.ts's FIRE_CONE_COS = Math.cos(12°) is INVENTED and says so: 'TODO(playtest): this 12° is INFERRED (the design spec's §6 gives only \"bit $10 set\", not the angle)'. But the ROM does carry a literal. WSCPU.MAC:615-618 is the whole C$AS gate: 'LDD M.YPS / ADDD M.ZPS / CMPD #20 ;?AIMING NEAR SHIP? / BHI 140$' — set C$AS when (Y² + Z²) <= 0x20 = 32. The 'S' suffix means SQUARED, proven in the sibling view pass where the same operands carry the author's own annotation: 'LDD M.YPS / SUBD M.XPS ;X SQUARED' (WSMAIN.MAC:3835 and again :3841). So the cabinet's aiming test is a CIRCLE of radius sqrt(32) ~= 5.66 in math-box projected screen units, taken after the M$PSB2 view transform — i.e. a fixed screen radius, which IS an angular cone and therefore DOES convert to a cosine once the math box's screen-units-per-radian scale is pinned. That scale is the only missing piece; the existing comment's claim that 'there is no direct unit conversion to a cosine threshold' is true only while the scale is unpinned, not in principle. Two things bound the blast radius, both verified: (1) sw8-9 removed C_AS from the §6 fire gate entirely (sim.ts: 'NO AIM CONE (sw8-9) … C$AS is computed just above it (:619-621) for the CHOREOGRAPHY to branch on and is never read by the gate'), so a retune moves FLIGHT behaviour — the '.CUNTIL C$AS' release conditions scattered through the scripts — and not fire rate; (2) uf1-12 deliberately did NOT touch it: C_PS's port sidesteps the projected-unit problem by riding on the clone's existing world-space kill radius (the ROM expresses C$PS as 3xTMPSIZ against the laser hit's 1.5xTMPSIZ, a unit-free doubling), so it sets no precedent for C_AS and leaves this genuinely open. Deliverable: pin the math-box projected scale from the source, convert 0x20 to a half-angle, replace the invented 12° or log a reasoned deviation if the scale proves unrecoverable — and either way retire the TODO(playtest) with an answer instead of a guess."
