  - id: uf1-6
    title: lobby attract-mode demo loop is promised by the docs and absent from the code
    description: "Two documents promise the lobby runs an attract-mode demo loop when idle. The orchestrator CLAUDE.md describes the lobby as 'a vector-style menu on black that lists the games as glowing tiles, launches them, runs an attract-mode demo loop when idle, and shows per-game high scores', and .pennyfarthing/repos.yaml carries the same sentence as the lobby's registered description — which makes it the description the agent topology loads into every session's prime context. The code does not contain it. lobby/src holds six TypeScript files (main.ts, core/registry.ts, core/score.ts, shell/font.ts, shell/storage.ts, shell/tiles.ts) and grep finds zero matches for attract, idle or demo across all of them. Every other subrepo in the fleet matches attract; the lobby is the only one that does not. This is the only finding in the sweep where the gap is a promise rather than an unconsumed port, so it needs a product ruling BEFORE implementation: build the loop, or strike the claim from both documents. Whoever picks it up should get that ruling first rather than assuming build — the two resolutions differ by roughly three points and one of them is a documentation edit. If the ruling is build, note that the fleet already has attract implementations to study in tempest, star-wars, asteroids, battlezone, red-baron and centipede, and that arcade is desktop-only: no phone-layout criterion belongs in this story."
    points: 5
    priority: p2
    status: done
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - 'The product ruling is recorded and delivered: the lobby ships an always-on showcase carousel that frames each opted-in game live, not an idle-triggered attract loop of its own.'
      - Games opt in through a required showcase boolean on the lobby registry, so a newly added game can neither silently default into the carousel nor silently vanish from it.
      - 'Exactly one iframe exists in the pane at any moment: each slide replaces the frame element rather than reassigning its src, so a second game sim never runs on the same main thread.'
      - Each opted-in game holds the pane for 20 seconds, then the carousel rotates to the next one and wraps at the end.
      - 'The pane is structurally incapable of making noise: the frame carries an empty allow attribute and stays out of the tab order.'
      - A frame that has not loaded within 8 seconds is written off, the carousel moves on, and that game is not shown again for the rest of the session.
      - When every opted-in game has failed to load, or when no game opted in, the section is removed from the DOM entirely and every timer stops, so the lobby looks exactly as it did before the feature existed.
      - The way into the framed game is a real anchor element, never a div with a click handler, so click, command-click, middle-click and Tab plus Enter all work.
      - When prefers-reduced-motion matches, no frame mounts and no rotation starts; a static card names the game on deck and a button lets the visitor ask for the demo.
      - 'Code and documents agree when the story closes: the repos.yaml lobby description describes the carousel accurately and no longer claims Canvas 2D or an idle attract loop.'
      - The behaviour holds across desktop widths — arcade is keyboard and mouse only, so no narrow-viewport criterion applies.
    completed: '2026-07-29'
    review_verdict: approved
  - id: uf1-7
