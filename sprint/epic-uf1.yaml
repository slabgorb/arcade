  - id: uf1-14
    title: star-wars C_PV's ±45° pyramid is not the rendered frustum — off-screen TIEs pass the §6 fire gate
    description: "Found by TEA during uf1-12's RED phase while measuring that story's aspect deviation. SCOPE NOTE: this story originally carried two halves; the C_PS half was FOLDED INTO uf1-12 (its AC-6) by user decision on 2026-07-29, because shipping an aspect-blind C_PS would have defeated uf1-12's own purpose. What remains here is the second, independent instance of the same root cause — and unlike the C_PS half, this one is ALREADY SHIPPING. computeStatus (src/core/tie-status.ts) sets C_PV when 'lat*lat < depth*depth && vert*vert < depth*depth' — a +/-45 degree square pyramid, faithfully ported from the ROM's ratio law at WSMAIN.MAC:3834-3841 ('LDD M.YPS / SUBD M.XPS ;X SQUARED / LBHS RTS1'). The ROM's law is a RATIO, so it ports unit-for-unit, which is why it looked safe. But it encodes the 1983 cabinet's own screen shape, and ours is not that shape: render.ts:450 projects with 'perspective(FOV_Y, w / h, NEAR, FAR)' where FOV_Y = PI/3 is the VERTICAL field of view, so the rendered vertical half-angle is 30 degrees at EVERY aspect and the horizontal one is atan(aspect * tan(FOV_Y/2)). CONSEQUENCE, vertical: C_PV reports 'in the player's view' for a 15-degree band of sky above and below the screen that the player cannot actually see (45 claimed vs 30 rendered). C_PV is the literal first condition of the section-6 fire gate ('BITA #C$PV/100 / BEQ 40$', WSCPU.MAC:624-626, 'NO SHOOTING GUNS IF PLAYER CANT SEE US'), so TIEs off the top or bottom of the screen can still shoot the player. That is precisely the defect sw7-24 was written to kill, surviving on the vertical axis. CONSEQUENCE, horizontal: the error swings with the canvas — actual half-angle is 45.7 degrees at 16:9 (so the ported 45 is nearly right there, which is why this went unnoticed for a year), 37.6 at 4:3, 30.0 at 1:1 and 53.4 at 21:9. So the clone over-reports by 15 degrees on a square canvas and UNDER-reports by 8.4 on ultrawide, silently starving fire in the latter case. Deliverable: re-derive the pyramid from the REAL frustum half-angles while keeping the ROM's ratio law as the SHAPE (it is still a square pyramid in view space, just not a 45-degree one), using the viewport the core will already carry once uf1-12 lands its AC-6. DEPENDS ON uf1-12: that story is what puts the viewport into GameState; do it after. Expect to re-anchor 'npm test -- citations' if sim.ts moves — it carries 36 pinned lines across 9 docs/audit/findings files."
