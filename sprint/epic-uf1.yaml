    title: star-wars C_PS is never derived — TCH1DZ's loiter branch is unreachable dead code
    description: "Found by TEA during uf1-3's RED phase, the same defect class the uf1 sweep was built to find — and the sweep missed it. src/core/tie-vm.ts:226 destructures C_PS out of Status and the assembled program gates on it in FOUR places, all inside TCH1DZ (the D-group loiter loop every D fighter, Darth included, ends up in): tie-vm.ts:341 'CUNTIL(C_PN | C_PS)', 'CUNTIL(C_AS | C_AG | C_PS)', 'CUNTIL(C_AG | C_PS)', and tie-vm.ts:342 'CIF(C_PS), CGOTO(TCH1DZ_20), CIF(0), CGOTO(TCH1DZ)'. But computeStatus (src/core/tie-status.ts) derives only C_AS, C_PN, C_PV, C_AG, C_R1 and C_R2 — it never derives C_PS, and its header says so out loud: 'the remaining player-relative bits (C_AD, C_AV, C_PS, C_PM) stay out of scope until a consumer needs them.' A consumer DOES need it, and has since sw7-11 assembled the program. Consequence: C_PS reads permanently false, so the two-way branch at :342 can only ever take the CIF(0) arm and the label TCH1DZ_20 is UNREACHABLE — dead ported code — while the three CUNTIL gates above it lose one of their two release conditions and hold longer than the cabinet does. Unlike its neighbours this is a real gap, not a faithful omission: the ROM genuinely sets the bit (WSMAIN.MAC:3930 'CHSET C$PS ;STATUS: ALIEN IN PLAYER SITES') and reads it at WSCPU.MAC:1639,1641,1643,1646 — the same four sites the port carried over. By contrast C_AD, C_AV and C_PM are correctly absent: the ROM never sets C_AD either (WSCPU.MAC:28 annotates it '/PLEASE DELETE/' and it has zero setters tree-wide), and the program does not gate on any of the three. Do for C_PS what uf1-3 did for C_AH: derive it in computeStatus from the player's aim, cite WSMAIN.MAC:3930 for the rule rather than inventing a cone, and prove the TCH1DZ_20 arm reachable with a test. Note C_PS is the mirror of C_AS (which computeStatus already derives with the INFERRED 12-degree FIRE_CONE_COS and a TODO(playtest) on it) — check whether WSMAIN.MAC:3930's own gate gives a portable threshold that could retire that guess too."
