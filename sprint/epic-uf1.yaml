id: uf1
type: epic
title: Unwired features — ported-but-unconsumed mechanics found by the 2026-07-28 fleet sweep
description: 'A fleet-wide sweep on 2026-07-28 (all nine subrepos on develop) hunted for features that are built, tested and cited against ROM source but never reach the running game. Mechanical module-graph scans were roughly 95 percent false positives — the fleet is well wired: no cold GameState fields, every arcade-shared subpath consumed, every event kind emitted AND handled, every .wav in every manifest returning 200 on R2, so the sw3-5 silent-404 class is clean. The real findings came from in-source confessions (the author who left the gap signed it) and from partially-consumed catalogues. Most stories here consume tested code rather than deriving new fidelity: the port already exists and only the wiring is missing. Two exceptions are called out in their own stories — uf1-6 is a promise the docs make that the code never kept, and uf1-7 is documentation drift. The sweep''s remaining finding — centipede and joust both shipping with no audio module at all — was epic-scale rather than story-scale and now has its own epics, cp5 and jt5, each seeded with a seam story. Context that drove that split: centipede and joust both ship with no audio module at all. centipede names its own gap in src/core/bonus.ts:32 — the bonus-life sound is ''DEFERRED to cp5 with the rest of the audio, and deliberately not stubbed, an empty hook would be dead code pretending to be a seam'' — so centipede audio already has a planned epic id. joust carries no equivalent note. Both need the multi-story treatment tempest, star-wars and asteroids each received, not a single story.'
priority: p2
status: backlog
repos: red-baron,joust,star-wars,lobby,.
stories:
  - id: uf1-1
    title: red-baron enemy planes cannot shoot — wire planeFires into the calc-frame damage channel
    description: "planeFires(level, frame, roll) — red-baron/src/core/enemy.ts:789 — is ported from R2BRON.MAC:4798-4807, covered by tests/core/enemy-fire.test.ts (AC-8, the divide-by-2 FRAME cadence over the PLNLVL level gate) and tests/core/blimp.test.ts, and has ZERO production callers. main.ts:632 states it plainly: 'The blimp is the modelled enemy shooter; plane fire (planeFires) is not yet wired into the shell loop, so it stays silent for now.' Consequence: all three player-hit emission sites in main.ts (:557, :602, :750) are CRSHSN collision crashes, so the pilot is currently immortal to enemy gunfire — the game's central threat does not exist. The blimp path is the working reference: main.ts:742 latches enemyFiring for the SN-017 gun cue when blimpFires(simFrame, level) is true, and :747 rolls BLIMP_HIT_CHANCE against a dedicated blimpRng before calling the rb2-9 loseLife damage channel, guarded by dying === null and not gameOver. Mirror that seam for planes. Note red-baron has no single stepGame: the calc-frame loop in main.ts assembles the GameEvent list itself, and the roll must come from a seeded Rng so the URL seed param (main.ts:461) still replays deterministically. Watch the level gate — planeFireChance returns 0 below level 4, 0.5 at level 4, 1 above, so a wave-1 playtest will correctly show nothing."
    points: 3
    priority: p1
    status: backlog
    repos: red-baron
    workflow: tdd
    acceptance_criteria:
      - planeFires is called from the calc-frame loop for each live plane, with its roll drawn from a seeded Rng so a given seed param replays the same fire pattern.
      - A plane's fire can cost the pilot a life through the same rb2-9 loseLife channel the blimp uses, guarded by dying === null and not gameOver, and emits a player-hit GameEvent.
      - A plane firing latches enemyFiring for the SN-017 gun cue, matching the blimp's rb4-10 behaviour that every shell rattles the same gun.
      - 'The level gate is preserved end to end: no plane fire occurs below level 4, and level 4 fires on roughly half its eligible frames.'
      - A test proves the wiring non-vacuous by mutation — disabling the new call site reddens a test that asserts player damage from plane fire, not merely that planeFires returns true.
  - id: uf1-2
    title: joust DYTBL difficulty engine is production-dead — wire difficultyValue as the per-wave source
    description: "joust/src/core/difficulty.ts holds DIFFICULTY_TABLE — 28 DYWORD rows byte-gated against JOUSTRV4.SRC:7304-7331 (LAVTIM, LAVGRA, LAVLAV, EGGWT, EGGWT2, the BODN/BOUP buzzard rows, the HUDN/HUUP hunter rows, the SHDN/SHUP shadow-lord rows, BOLETM/HULETM/SHLETM/SHCLTM) — plus the IWAVE walk engine that reads them: difficultyValue, ga1StartColumn, stepNibble and GA1_DEFAULT. Every one of those has ZERO production references. The module IS imported by src/core/wave.ts and src/core/arena.ts, but only for the three retrofit knobs emytimForWave, lavaLevelForWave and seedBudgetForRow, and all three are hand-written walks that never touch a row. Net effect: none of the ROM's per-wave escalation — enemy energy, dive rate, velocity, wing-up and wing-down cadence, egg wait, bolt time, lava timing and gravity — reaches the running game, and no consumer module references a row name at all. This story establishes the SEAM and wires a proven subset rather than all 28 rows at once: the jt2 retrofit note in difficulty.ts:38 already rules that this module is the SOURCE for per-wave knobs, so the walk should feed the existing consumers rather than living beside them. Expect a real blast radius on jt2's seeded determinism replays — the retrofit's own bar was that realized values reproduce bit-for-bit, so any row that changes a wave's realized value is a deliberate, logged deviation, not a silent drift. Size the subset so the remaining rows are inventoried into a follow-up instead of growing this story."
    points: 5
    priority: p2
    status: in_review
    assigned_to: Keith Avery
    started: '2026-07-28'
    repos: joust
    workflow: tdd
    acceptance_criteria:
      - difficultyValue drives at least the lava rows and the buzzard energy-and-wing rows through their real consumers, so a later wave observably differs from wave 1 on each wired dial.
      - ga1StartColumn and the GA1 tier buckets (0-3, 4-6, 7 and above) select the start column that seeds each wired row, with GA1_DEFAULT 5 as the shipped operator setting.
      - 'The IWAVE walk semantics hold for every wired row: the walk runs wave minus 1 times, clamps at END by the signed comparison, and holds flat forever after.'
      - The three retrofit knobs emytimForWave, lavaLevelForWave and seedBudgetForRow are reconciled with the table rather than duplicated — either sourced from it or documented as deliberately separate with the ROM citation for why.
      - jt2's seeded determinism replays still reproduce, or every changed realized value is logged as a deviation with its JOUSTRV4.SRC citation.
      - The rows NOT wired by this story are inventoried in the epic or a follow-up story, so the remaining gap is tracked rather than rediscovered by the next sweep.
    review_findings: "REJECTED (round 1). [HIGH] The wave fed to the new difficulty seam is BCD-packed, not decimal: stepDemo passes demo.wave (advanced by nextWaveBcd, pinned 'BCD not binary' at tests/wave.test.ts:155) straight into waveValue. BCD and decimal agree for waves 1-9 then diverge forever - measured, at the 10th wave the counter holds 0x10=16 so the bounder brake resolves to 0x140 where the ROM says 0x120. The story's deliverable is wrong in exactly the regime it exists to serve. [HIGH] No test drives the production path past wave 3, which is why 1579 green tests and a 10/10 mutation battery all missed it. [MEDIUM] waveValue's wave<1 guard cannot catch a BCD wave (a positive integer) so it supplies false confidence. [LOW] brakeForWave is a pass-through; runBehaviour's wave=1 default is dead. Upstream (pre-existing, NOT this story): demo.ts:955-968 and game.ts:347 feed the same BCD counter to waveRowAt/spawnWaveEnemies/applyWaveDestruction - measured, waveRowAt(0x10) returns wave 16's row (bounders 0) instead of wave 10's (bounders 8). Needs its own story."
    review_verdict: rejected
  - id: uf1-3
    title: star-wars Status.C_AH is always false — squadmates never react to a nearby kill
    description: "star-wars/src/core/tie-status.ts:107 carries the gap in its own words: 'C_AH (0x01) — NEARBY ALIEN HAS BEEN HIT (WSCPU.MAC:27,357: CHSET C$AH in the damage handler). TODO: a later task threads the hit resolver's per-step result through state (or a per-step arg) so squadmates react to a nearby kill; for now this always reads false.' The choreography VM this bit feeds is no longer speculative — sw7-11 landed it and sw7/sw8 wired it: sim.ts:131 imports initVm/tickChoreo/program/Status/Twist/Move, sim.ts:388 steps every TIE's VM each game frame against computeStatus, and sim.ts:2082 seats each fighter's program from the sw7-12 TSPWAV plan via choreoPc. So C_AH is a live VM condition input that is permanently pinned to false, which silently prunes every branch the ROM gates on it. Compare the sibling bit C_AG immediately above, which was closed the same way this one must be: a later fire step sets e.firedGun on the frame the TIE fires and computeStatus merely reports it. Mirror that. The hit resolver is the hitscan model swapped in by sw7-17 — see the memory of that story's blast radius (29 suites, 125 tests, 11 vacuous tests surfaced), so expect fixtures to need the new per-step signal and trust mutation over green."
    points: 3
    priority: p2
    status: backlog
    repos: star-wars
    workflow: tdd
    acceptance_criteria:
      - A TIE destroyed this step sets the nearby-alien signal that computeStatus reads, so C_AH can be true — threaded the same way C_AG threads firedGun, not read from mutable module state.
      - Nearby is defined by a cited ROM proximity rule rather than an invented radius, or the absence of one in WSCPU.MAC is recorded as a logged deviation with the chosen rule and its rationale.
      - "A choreography branch gated on C_AH is observably reachable: a test drives a kill beside a live TIE and asserts the squadmate's VM takes the C_AH arm."
      - The bit clears on the following step — C_AH reports a per-step event, never a latched flag that stays set for the rest of the wave.
      - 'Mutation-proven: pinning the new signal back to false reddens the C_AH branch test, and the sw7-17 hitscan fixtures still pass.'
      - The tie-status.ts:107 TODO comment is removed or rewritten to describe what now happens, so the next sweep does not re-report it.
  - id: uf1-4
    title: star-wars trench wedge grid — 13 of 19 exports never reach production
    description: "Of the 19 exports in star-wars/src/core/trench-wedges.ts, only 6 reach production code — buildTrench, wedgeLength, trenchPortDistance, TRENCH_PORT_OFFSET, PANEL_FORCEFIELD and the Wedge type. The other 13 are referenced by tests and by nothing else: the panel-column vocabulary (PANEL_BLANK, PANEL_PANEL, PANEL_GUN, PanelColumn, decodePanelColumn), the five wedge-type opcodes (WEDGE_SHORT, WEDGE_LONG, WEDGE_END, WEDGE_PORT, WEDGE_NEXT), and the pie and group layer (PIES, WEDGE_GROUP_IDS, wedgeGroup). This is the sw7-6 gap, now half closed: sw7-22 landed streamForceFields (trench-obstacles.ts:207, called from sim.ts:1763), so PANEL_FORCEFIELD alone graduated from the grid into the running trench. Wall guns did not — trench gun behaviour still lands on legacy TrenchObstacle entities via TRENCH_GUN_FIRE_MASK (sim.ts:1306), not on the grid's PANEL_GUN columns. Two honest outcomes and the story should pick one per symbol rather than assuming: WIRE the remaining grid layer so guns, panels and pies are streamed from the decoded wedge data the way force fields now are, or RETIRE what the port genuinely does not consume and say so in the module header. Do not leave a third state where the data sits tested and unread — that is what this story exists to end. streamForceFields is the reference implementation for the wiring direction."
    points: 5
    priority: p2
    status: backlog
    repos: star-wars
    workflow: tdd
    acceptance_criteria:
      - Every one of the 13 currently test-only exports has an explicit disposition — wired to a production consumer, or removed, or documented in the module header as ROM data deliberately carried without a consumer and why.
      - If PANEL_GUN is wired, trench wall guns are streamed from the decoded grid columns rather than placed as legacy TrenchObstacle entities, and the change is proven by a test that moves a gun by changing grid data alone.
      - streamForceFields keeps working unchanged, or its change is a deliberate logged deviation — sw7-22's shipped behaviour is not collateral.
      - "The run-duration and object-count ceilings that blocked sw7-19's dense grid are respected: any newly streamed layer is measured empirically, not assumed cheap."
      - No symbol in trench-wedges.ts is left referenced only by tests when the story closes; a repeat of the sweep's export scan over this module returns clean.
      - The module header states which layers of the wedge grid production consumes, so the next reader does not have to re-derive it.
  - id: uf1-5
    title: star-wars speech catalogue — correct the stale deferred-count comment and inventory the 10 untriggered lines
    description: "star-wars/src/core/events.ts:154 says of the speech catalogue: 'Only lines with a reachable trigger in the current sim are listed; the shell's SPEECH map holds the full 23-line cabinet catalogue (the other 19 are deferred — they need mechanics the sim lacks: R2 damage, Vader-on-tail, wingmen).' The count is stale. SpeechLine now admits 13 lines and the core cues all 13 — 10 through explicit line: cues in sim.ts plus 3 through ENTER_PHASE_SPEECH (redFiveImGoingIn, lookAtTheSizeOfThatThing, useTheForceLuke). Deferred is therefore 10, not 19: imOnTheLeader, r2TryAndIncreaseThePower, vaderBreathing, yahoo, iHaveYouNow, stayInAttackFormation, tieFighter, imHitButNotBadR2SeeWhatYouCanDoWithIt, iveLostR2, iCantShakeHim. Every one of the 10 is baked and returns 200 on R2, so this is dead weight in the catalogue, not a broken asset — the sw3-5 silent-404 class is clean here. Same shape as sw8-15 (music-bake comment accuracy). Note the second stale marker in the same neighbourhood: shell/audio.ts:147 says 'Lines the CORE currently cues are marked [wired]' but only 4 of the 13 actually cued lines carry the marker, so 9 correct wirings read as unwired. This story is prose and inventory only — it wires no new line and needs no new mechanic. Per the wrong-prose rule, grep every SYNONYM of the corrected claim, not just the named string: the count appears in the source comment, and any epic or context mirror that quotes it carries both a description and a separate acceptance-criteria list."
    points: 1
    priority: p3
    status: done
    started: '2026-07-28'
    repos: star-wars
    workflow: trivial
    acceptance_criteria:
      - events.ts states the correct deferred count and names the 10 untriggered lines, so the number cannot drift again without the list drifting visibly with it.
      - 'The [wired] markers in shell/audio.ts match reality: every line the core cues carries one, and no line that is uncued does.'
      - Each of the 10 deferred lines is annotated with the mechanic it waits on (R2 damage, Vader-on-tail, wingmen, or another named gap), so a future story can pick them up by prerequisite.
      - Every other phrasing of the stale count across the repo, the sprint epic files and the context mirrors is corrected, not only the one string quoted here.
      - No production behaviour changes and the suite stays green — this story touches comments and inventory only.
    completed: '2026-07-28'
    type: chore
    review_verdict: approved
  - id: uf1-6
    title: lobby attract-mode demo loop is promised by the docs and absent from the code
    description: "Two documents promise the lobby runs an attract-mode demo loop when idle. The orchestrator CLAUDE.md describes the lobby as 'a vector-style menu on black that lists the games as glowing tiles, launches them, runs an attract-mode demo loop when idle, and shows per-game high scores', and .pennyfarthing/repos.yaml carries the same sentence as the lobby's registered description — which makes it the description the agent topology loads into every session's prime context. The code does not contain it. lobby/src holds six TypeScript files (main.ts, core/registry.ts, core/score.ts, shell/font.ts, shell/storage.ts, shell/tiles.ts) and grep finds zero matches for attract, idle or demo across all of them. Every other subrepo in the fleet matches attract; the lobby is the only one that does not. This is the only finding in the sweep where the gap is a promise rather than an unconsumed port, so it needs a product ruling BEFORE implementation: build the loop, or strike the claim from both documents. Whoever picks it up should get that ruling first rather than assuming build — the two resolutions differ by roughly three points and one of them is a documentation edit. If the ruling is build, note that the fleet already has attract implementations to study in tempest, star-wars, asteroids, battlezone, red-baron and centipede, and that arcade is desktop-only: no phone-layout criterion belongs in this story."
    points: 3
    priority: p2
    status: backlog
    repos: lobby
    workflow: tdd
    acceptance_criteria:
      - 'The product ruling is recorded in the story before implementation begins: build the attract loop, or strike the claim from CLAUDE.md and repos.yaml.'
      - Code and documents agree when the story closes — either lobby/src implements an idle attract loop and both documents describe it accurately, or neither document claims one.
      - If built, the loop starts only after a defined idle period, stops on any input, and never interferes with launching a tile or reading the high-score table.
      - If built, the behaviour holds across desktop widths — arcade is keyboard and mouse only, so no narrow-viewport criterion applies.
      - repos.yaml is updated in the same change as CLAUDE.md if the claim is struck, since its lobby description is what the agent topology loads into every session.
  - id: uf1-7
    title: orchestrator CLAUDE.md production table omits centipede and joust — both buckets are live
    description: "The orchestrator CLAUDE.md 'Production: R2 static hosting' table lists six apps — lobby, tempest, star-wars, asteroids, battlezone, red-baron — and omits centipede and joust. Both are live: centipede.slabgorb.com and joust.slabgorb.com each returned 200 when probed on 2026-07-28, and the lobby's own registry ships tiles pointing at both (lobby/src/core/registry.ts lists centipede at version 0.0.0 and joust at 0.0.6). So the table under-reports the deployed fleet by two games, and a reader trusting it would conclude those two games are not deployed at all. Confirm each bucket name against the live setup rather than inferring it from the pattern before writing the rows — the existing rows pair a domain with an arcade-prefixed bucket, but that is a convention to verify, not a rule to assume. Two rows and a probe. Note the lobby registry's own comment is accurate and needs no change: red-baron is provisioned but deliberately unlisted because it is not finished enough for production, and per the standing rule no orchestrator test may pin the lobby registry's contents — curation is a product decision validated by the lobby's own registry test."
    points: 1
    priority: p3
    status: backlog
    repos: .
    workflow: trivial
    acceptance_criteria:
      - The CLAUDE.md production table lists centipede and joust with their live URLs and their real bucket names, verified rather than inferred.
      - The bucket name in each new row is confirmed against the actual deployment, not pattern-matched from the existing rows.
      - No other claim in the hosting section is left contradicting the table, and docs/ops/hosting.md is checked for the same omission.
      - No orchestrator test is added that pins the lobby registry's contents — curation stays a product decision.
    type: chore
  - id: uf1-8
    title: joust DYTBL flight-control rows — wire the long/short range seek and the PDIST distance-to-go (10 rows)
    description: "Ten DYTBL rows drive the ROM's long/short RANGE SEEK decision and the PDIST 'distance to go' budget, and joust/src/core/enemy.ts models NEITHER mechanic — smartDecision has no range gate and no PDIST at all, so the rows have nowhere to land. The rows and their single ROM consumers, recovered by grepping each label in JOUSTRV4.SRC: BODNRG :3801, BOUPRG :3844, HUDNRG :3984, HUUPRG :4028, SHDNRG :4243, SHUPRG :4257 (each 'CMPD/SUBD <row>  LONG OR SHORT RANGE SEEK' against the player Y-delta), and BODNDI :3803, BOUPDI :3851, HUDNDI :3988, HUUPDI :4035 ('SET DISTANCE TO GO DOWN/UP' into PDIST,U). NOTE THE NAMING TRAP that uf1-2 hit: RG is RanGe, NOT eneRGy — 'DYLEN EQU $14-6' = 14 and BODNRG's GA1-5 start is $000E = 14, i.e. the row replaced the hardcoded '#DYLEN' immediate, and the ROM comment says RANGE SEEK outright. Every row's GA1 column 1 reproduces exactly the pre-DYTBL immediate the ROM's trailing comments record, so the wave-1 value is a free correctness check on any port. Build the range gate and the PDIST model first; the wiring is then the uf1-2 seam (difficulty.waveValue) applied to new consumers. uf1-2 shipped the seam, the wave threading through stepEnemy/stepFrame/stepDemo, and the ROW_DISPOSITION inventory that lists these ten as owned here."
    points: 5
    priority: p3
    status: backlog
    repos: joust
    workflow: tdd
  - id: uf1-9
    title: joust DYTBL cadence rows — wire the wing-flap timer, the decision timer and the up-flight VY gates (11 rows)
    description: "Eleven DYTBL rows drive per-wave TIMING that joust/src/core/enemy.ts does not model: the buzzard has no wing-flap cadence timer and no 'time until next decision' timer at all — smartDecision returns a fresh boolean flap every step, where the ROM gates flapping on PJOYT. The rows and their single ROM consumers: the WING cadence BOUPWD :3864 ('#2'), BOUPWU :3894 ('#8'), HUUPWD :4182 ('#2'), HUUPWU :4047 ('#8') — each 'LDA <row> / STA PJOYT,U', wing-down and wing-up hold times; the DECISION timer BOLETM :3909, HULETM :4060, SHLETM :4316, SHUPTM :4283, SHCLTM :4375 (each 'TIME UNTIL NEXT DECISION'); and the up-flight VY gates HUUPVY :4178 ('CMPD HUUPVY  #-$0100') and SHUPVY :4272 ('CMPD SHUPVY  #-$0200'). Each row's GA1 column 1 equals the pre-DYTBL immediate in its own ROM comment (BOUPWD start 2, BOUPWU start 8), so a correct port reproduces the old constant at wave 1 — the same free check uf1-2 used. The wing timer is the substantial build here: it changes the shape of enemy flight, so expect a real determinism blast radius on the demo replays, and budget for re-baselining rather than assuming the jt2 bar holds. uf1-2 shipped the seam (difficulty.waveValue), the wave threading, and the ROW_DISPOSITION inventory that lists these eleven as owned here."
    points: 5
    priority: p3
    status: backlog
    repos: joust
    workflow: tdd
  - id: uf1-10
    title: joust DYTBL egg-wait and lava-troll rows — wire EGGWT/EGGWT2 and LAVTIM/LAVGRA (4 rows, blocked on the troll grip)
    description: "Four DYTBL rows whose consumers do not exist in the clone. THE EGG PAIR: EGGWT (JOUSTRV4.SRC:3224, 'EGGLND LDA EGGWT  GET CURRENT WAIT TIME' — the settled egg's wait before it hatches) and EGGWT2 (:2761, 'LDB EGGWT2  INITIAL EGG WAITING TIME'). joust/src/core/egg.ts models the fall, the settle, the hatch and the remount but carries NO wait timer of any kind, so per-wave egg-hatch pressure — the ROM walks EGGWT from $40 down to $10, so late-wave eggs hatch four times sooner — never reaches the player. THE TROLL PAIR: LAVTIM (:1611, 'LDA LAVTIM  RESET TIMER' — the lava troll's hand-animation frame timer) and LAVGRA (:6395, PATCH1 'LDD LAVGRA  GIVE CURRENT LAVA TROLL GRAVITY' seeding CLVGRA). LAVGRA's designated consumer ALREADY EXISTS as troll.beginGrip(baseGravity) — but is BLOCKED: uf1-11 found beginGrip/stepGrip/escalateGrip have zero production callers, so wiring LAVGRA into beginGrip today connects one dead module to another and changes nothing a player can see. DO uf1-11 FIRST or this half is theatre. NOT IN SCOPE and never will be: LAVLAV, the fifth 'lava' row — its label appears exactly ONCE in the whole of JOUSTRV4.SRC, on its own DYWORD line at :7306. Williams shipped a row nothing reads; uf1-2 recorded it as dead-in-rom in ROW_DISPOSITION so no future sweep re-files it as a porting gap."
    points: 3
    priority: p3
    status: backlog
    repos: joust
    workflow: tdd
  - id: uf1-11
    title: joust troll GRIP is production-dead — beginGrip/stepGrip/escalateGrip have zero production callers
    description: "joust/src/core/troll.ts implements the lava troll's grip — the PATCH1/2/3 escalation the 1982 source added in 'VERSION 3 SOFTWARE' — and NONE of it runs. beginGrip, stepGrip, escalateGrip, escapeScoreEvent and the TrollGrip type have ZERO references in src/ outside troll.ts itself; only trollSpawnable is live (demo.ts:961). demo.ts:420 admits it in its own words: '(stepGrip) is a pure core exercised directly; wiring the live grab off the LNDB7 …'. So a troll spawns, and can never actually grab anyone: the grace timer (LAVKLL 30*60, :6393), the +1/frame pull escalation to the $500 cap (:6374-6386), the -$0180 break-free threshold (:6616), the 50-point escape award (:6668) and the pull into the lava are all unreachable. This is the same disease as uf1-2 one layer down — a faithful, tested, cited pure core with no caller — and it BLOCKS uf1-10's LAVGRA half, which has nothing to feed until the grab is live. The missing piece is the GRAB itself: the LNDB7 hand-out/hand-grab detection that repoints the victim's gravity vector from ADDGRA to ADDLAV (PADGRA, :1651-1652). Found by TEA during uf1-2 test design while tracing which DYTBL rows had a live consumer chain."
