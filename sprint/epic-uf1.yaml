  - id: uf1-8
    title: joust DYTBL flight-control rows — wire the long/short range seek and the PDIST distance-to-go (10 rows)
    description: "Ten DYTBL rows drive the ROM's long/short RANGE SEEK decision and the PDIST 'distance to go' budget, and joust/src/core/enemy.ts models NEITHER mechanic — smartDecision has no range gate and no PDIST at all, so the rows have nowhere to land. The rows and their single ROM consumers, recovered by grepping each label in JOUSTRV4.SRC: BODNRG :3801, BOUPRG :3844, HUDNRG :3984, HUUPRG :4028, SHDNRG :4243, SHUPRG :4257 (each 'CMPD/SUBD <row>  LONG OR SHORT RANGE SEEK' against the player Y-delta), and BODNDI :3803, BOUPDI :3851, HUDNDI :3988, HUUPDI :4035 ('SET DISTANCE TO GO DOWN/UP' into PDIST,U). NOTE THE NAMING TRAP that uf1-2 hit: RG is RanGe, NOT eneRGy — 'DYLEN EQU $14-6' = 14 and BODNRG's GA1-5 start is $000E = 14, i.e. the row replaced the hardcoded '#DYLEN' immediate, and the ROM comment says RANGE SEEK outright. Every row's GA1 column 1 reproduces exactly the pre-DYTBL immediate the ROM's trailing comments record, so the wave-1 value is a free correctness check on any port. Build the range gate and the PDIST model first; the wiring is then the uf1-2 seam (difficulty.waveValue) applied to new consumers. uf1-2 shipped the seam, the wave threading through stepEnemy/stepFrame/stepDemo, and the ROW_DISPOSITION inventory that lists these ten as owned here. TWO THINGS jt8-1 (the aggro subsystem, joust#39) HANDS THIS STORY. (1) THE BOLEV ROUTING IS YOURS. The ROM reaches BODNRG only after 'JSR SELPLY / BEQ BOLEVV  BR=NO PLAYERS HERE' (:3796-3797) and the down/up split at :3800, and the range gate you are building IS the very next branch, 'CMPD BODNRG / BLT BOLEVV  BR=SHORT RANGE SEEK' (:3801-3802) — so you cannot wire BODNRG without deciding what BOLEV, the level seek, does. That matters beyond the range gate: enemy.ts smartDecision currently FALLS THROUGH to the down-seek brake when the target is null, where the ROM routes a no-target bounder to BOLEV and never consults BODNVY at all. So the port still reads the wired dial in one state the 1982 machine does not. It predates uf1-2 and jt8-1 only made it visible; it is not filed separately because building BOLEV is unavoidable here. (2) STAGE YOUR END-TO-END PROBES. smartDecision tests seek-up BEFORE the brake, and the brake only fires at velY >= $0100 >= 0, so a quarry ABOVE the buzzard pre-empts every down-seek row unconditionally. A full-cabinet probe on the natural spawn geometry therefore cannot see a down-seek row at all — this broke uf1-2's two end-to-end tests on the merge. tests/difficulty-wiring.test.ts carries the fix to copy: knightsBelowTheBuzzards parks the knights on CLIF5 and brakeDecidingFrames guards that the run reached the region where the dial decides."
    points: 5
    priority: p3
    status: backlog
    repos: joust
    workflow: tdd
  - id: uf1-9
    title: joust DYTBL cadence rows — wire the wing-flap timer, the decision timer and the up-flight VY gates (11 rows)
    description: "Eleven DYTBL rows drive per-wave TIMING that joust/src/core/enemy.ts does not model: the buzzard has no wing-flap cadence timer and no 'time until next decision' timer at all — smartDecision returns a fresh boolean flap every step, where the ROM gates flapping on PJOYT. The rows and their single ROM consumers: the WING cadence BOUPWD :3864 ('#2'), BOUPWU :3894 ('#8'), HUUPWD :4182 ('#2'), HUUPWU :4047 ('#8') — each 'LDA <row> / STA PJOYT,U', wing-down and wing-up hold times; the DECISION timer BOLETM :3909, HULETM :4060, SHLETM :4316, SHUPTM :4283, SHCLTM :4375 (each 'TIME UNTIL NEXT DECISION'); and the up-flight VY gates HUUPVY :4178 ('CMPD HUUPVY  #-$0100') and SHUPVY :4272 ('CMPD SHUPVY  #-$0200'). Each row's GA1 column 1 equals the pre-DYTBL immediate in its own ROM comment (BOUPWD start 2, BOUPWU start 8), so a correct port reproduces the old constant at wave 1 — the same free check uf1-2 used. The wing timer is the substantial build here: it changes the shape of enemy flight, so expect a real determinism blast radius on the demo replays, and budget for re-baselining rather than assuming the jt2 bar holds. uf1-2 shipped the seam (difficulty.waveValue), the wave threading, and the ROW_DISPOSITION inventory that lists these eleven as owned here. jt8-1 (the aggro subsystem, joust#39) CUTS BOTH WAYS FOR THIS STORY, and the split is by branch. YOUR UP-GATES ARE ENABLED BY IT: HUUPVY (:4178) and SHUPVY (:4272) sit on the B2UNUP/SHUP up-seek path, reached only when SELPLY finds a targetable player ABOVE the buzzard (:3800 'LBLT BOUNUP'). Before jt8-1 frame.ts stepped every enemy with NO player, so that whole branch was unreachable in production and these two rows would have had nowhere to land; jt8-1 is a prerequisite, not an obstacle. YOUR CADENCE ROWS ARE NOT: BOUPWD/BOUPWU/HUUPWD/HUUPWU and the BOLETM/HULETM/SHLETM/SHUPTM/SHCLTM decision timers sit on both paths, so a full-cabinet probe of a DOWN-path row (or of anything gated behind the down-seek brake) must stage the region where the brake decides — smartDecision tests seek-up FIRST and the brake only fires at velY >= $0100 >= 0, so a quarry above pre-empts it unconditionally. This broke uf1-2's two end-to-end tests on the jt8-1 merge; tests/difficulty-wiring.test.ts carries the fix to copy (knightsBelowTheBuzzards + brakeDecidingFrames)."
    points: 5
    priority: p3
    status: backlog
    repos: joust
    workflow: tdd
