    description: 'The absent-source epic''s payload: an ASSET, so its acceptance is a live 200, not a green suite — @shared/audio degrades silently on a 404 exactly as it does on working code, the star-wars sw3-5->sw8-14 gap and the standing Architect gotcha. Synthesise each cue from MAME''s board model + the defend.snd bytes (no waveform can be baked from source — the M6808 firmware is not vendored, roadmap sec 2); the manifest''s source table records which sound# each stands in for and marks any un-anchored cue invention-pending (do not silently fabricate authenticity). Bake exactly the SOUNDS set at run time (this story is LAST among the core three so the cue set is complete and one upload pass suffices). Upload by hand — CI never touches the assets bucket (named plain `arcade`).'
