    description: Players and enemies should 'warp' in with a visible spawn animation. User suspects this was never implemented (rather than removed for accessibility/safety — if it was removed, that was overkill). Investigate whether a warp-in ever existed in the joust core/shell or the ROM reference, then implement a visible spawn/warp-in animation for player and enemy spawns.
