id: jt13
type: epic
title: Joust gameplay & entry-screen bug fixes
description: "Bugs found during joust gameplay: (1) a landed ostrich with a centered joystick keeps its stored horizontal velocity, so it runs in place and launches at full speed instead of zeroing velocity on landing with no input; (2) players and enemies should spawn with a visible 'warp-in' animation, which appears to have never been implemented (not an intentional accessibility removal); (3) the entry screen shows a wrong 'new mount every' line that should read the actual setting or be removed; (4) nothing prompts the '1' button — replace with click-to-enter, single player only."
priority: p1
status: ready
repos: arcade
