  - id: jt13-7
    title: Lava-troll grab is silent — add the SNTROL 'captured' cue
    description: "Being grabbed by the lava troll plays no sound. ROM: LT1GRP loads SNTROL ('MAKE THE SOUND OF THE LAVA TROLL / GRIPPING THE PLAYER', JOUSTRV4.SRC:1646-1647) and JSR VSND; SNTROL is defined at :8097 'CAPTURED BY LAVA TROLL SOUND'. jt9-11 wired troll.beginGrip (sim.ts:1034) but no 'troll-grab'/SNTROL entry was added to EVENT_KINDS (core/events.ts) and no cue to audio-manifest, so the grab is silent. Add a troll-grab event kind emitted at beginGrip, map it to a SNTROL cue in audio-dispatch + audio-manifest, and play it. Also fix the stale comment at events.ts:44-49 claiming troll.beginGrip has 'zero production callers' — it now has one (sim.ts:1034). Note: the PLAYER/ENEMY-IN-LAVA sounds SNPLAV/SNELAV (:8123/:8105, played by ADGFLR) were DEFERRED from jt13-5 (which shipped the lava death/removal only) and are filed as jt13-10, not here."
