    title: 'Lava death cinematic: ADDLAV break-free window, sink to FLOOR+20, and the SNPLAV/SNELAV cue'
    description: "Follow-up to jt13-5, which shipped the essential non-gripped lava DEATH (a knight reaching FLOOR+7 is removed and loses a life) but deferred the ROM cinematic. Add, faithful to ADGFLR/ADDLAV (JOUSTRV4.SRC): (1) the ADDLAV break-free window (CMPD #-0180 'BREAK FREE VELOCITY?', ~:6617) so a hard enough upward flap escapes within a limited window, after which lava gravity holds the bird down (today any flap that clears lava depth escapes — the window never closes); (2) the visible SINK — the body descends past FLOOR+7 to FLOOR+20 (:6568) with a pause before respawn, rather than being removed the same frame it touches the lava; (3) the SNPLAV (player) / SNELAV (enemy) lava sound (ADGFLR loads them) — a NEW EVENT_KIND in core/events.ts wired through audio-manifest + audio-dispatch (none exists today; adding it ripples the audio-seam sweeps). Reconcile the visible sink with jt11-18's burned-shore-grab maxY<=DEATH_Y assertions (they will need updating if the player sink is implemented at the frame layer)."
