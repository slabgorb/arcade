  - id: jt13-8
    title: "Retire joust's dead twins (per-symbol: delete behavioral-only, keep claim-pinned)"
    description: "Joust's core exports a family of DEAD TWINS: functions with zero callers outside tests/, because a later story reimplemented the behavior inline in the real path. Never scoped before — the dead-twin retirement pattern only ever ran for missile-command (mc11-4) and pac-man (pm5); joust's twins were never put in a story. Follow the retire-dead-twin playbook + the mc11-4 precedent: this is NOT a uniform delete-all. Per-symbol judgment — a symbol still asserted by a CLAIM test (ROM-citation pin) is KEPT (only its dead runtime role goes); a symbol referenced only by BEHAVIORAL tests is deleted and its tests RE-POINTED onto the live inline symbol to preserve coverage (do not delete the coverage). Candidate twins measured by the jt13 unhooked-seam audit (VERIFY each against its current referencing tests at setup — do not trust this list blind): stepPlaying (cabinet.ts:109; live path = stepGame at main.ts:637), hatchEgg (sim.ts:1581; live = inline hatchRow/remountEntryEdge sim.ts:2480-2497), waveEnemyComplement (transporter.ts:301; live = wenemyFor/waveRowAt), toTitle (cabinet.ts:84; live = inline {mode:'title'} main.ts:383), playerTurn (transporter.ts:222), groundStep (joust.ts:417; live = inline frame.ts walk), wrapEggX (egg.ts:270), bridgeDestroyedOnWave (arena.ts:350). Separately, a longer list of tests-only CONSTANTS (cliffBits, EGG_VALUE_CAP, PTERO_FLYX_MAX, GRIP_ROUTINE, waveTypeBehaviour, etc.) are likely claim-pins that must STAY — classify, don't delete. RED = tests proving each targeted twin has no production caller; GREEN = delete + re-point. Full-cabinet green required (vitest + orchestrator + lint)."
    points: 5
