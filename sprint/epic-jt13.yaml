    description: 'When the ostrich is landed and the joystick is centered (no input), the stored horizontal velocity should be 0. Currently it retains velocity: the ostrich runs in place while landed, and on launch takes off at full horizontal speed. Expected: landing with no directional input zeroes stored horizontal velocity.'
