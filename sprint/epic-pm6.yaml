    description: 'Decision A: the intermission is a phase off the pm4 machine, not a forked path. This story adds the phase and the level-gated trigger that fires the pm2 #02 music after the cited levels, PURE-first — the scripted animations (pm6-2/pm6-3) layer on after. Reuses the pm2 sound voice; every cadence/level constant cited.'
