  - id: pm6-4
    title: "The level-256 kill screen: the authentic right-half tile/glyph CORRUPTION when the internal level counter rolls past a byte. Model it pure in core (the level byte, pacman.asm:6075 'ld a,(#4e13)'; behaviour docs/rom-study/glossary.md:392) and render the garbled right half. Retire the level.ts:63/:140 'out of scope' stubs. ACCESSIBILITY: render the corruption STATIC/faithful, NOT strobing (Decision B — accessibility outranks ROM fidelity)."
    description: "The famous split-screen kill screen: at level 256 the level counter rolls and the right half of the maze renders as corrupted glyphs (the game becomes unplayable — the authentic bug). Model the roll + the corrupted-tile region purely, render it via pm3 tiles, and retire the two level.ts stubs that flag it out-of-scope (plugins/pac-man/src/core/level.ts:63, :140). Decision B: the corruption is a STATIC garbled tilemap, never a strobe."
