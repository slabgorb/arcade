title: 'Missile Command — high-score ladder + name entry (REV-01): reuse @shared/highscore + @shared/name-entry'
description: "Seventh Missile Command epic — the high-score ladder and initials entry, ported from the ROM display processor and wired onto the one-origin localStorage. Follows the arcade's standing rule (and the asteroids/joust consumers) that the table, the qualifies check and the initials buffer live in src/core (pure), while the shell holds only load-on-boot and save-on-commit. Reuses @shared/highscore (qualifiesForHighScore, insertHighScore, highScoreKey) and @shared/name-entry (stepNameEntry) rather than re-implementing either. ROM ground truth: W3DSUP.MAC:3724 INIT HI SCORE (default ladder + depth), :3780 UPDATE LADDER (insert-on-qualify), :4064 TAKE INITIALS (the 3-char entry + charset). The 'entry' phase slots into mc6's state machine, so mc7 is best sequenced after mc6-1; mc7-1 (table) and mc7-3 (persistence) are mc6-independent. Dependency: mc7 -> mc4 (done). Ground truth is REV-01 (035820-01); ladder depth and the default table are pinned to their cited W3DSUP symbols, never hard-coded uncited; every new src/core constant carries a claim gated by citations.test.ts and purity.test.ts stays green. Per the roadmap fidelity contract, catalogue the REV-01 <-> REV-03 ladder delta (default names/scores, depth) in the epic design + claim notes. Design: docs/superpowers/specs/2026-08-09-missile-command-mc7-highscore-name-entry-design.md; plan: to be authored at epic kickoff; roadmap: docs/superpowers/specs/2026-08-07-missile-command-full-cabinet-roadmap.md. OUT OF SCOPE: attract/state machine (mc6, which owns the phase seam mc7-2 extends), authentic audio (mc8), palette/stamps (mc9)."
