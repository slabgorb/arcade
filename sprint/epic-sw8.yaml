  - id: sw8-19
    title: "C_PS can be set while C_PV is clear — the port carries only one of the ROM draw-pass gates (sw8-8 round-3 finding). The ROM's sole CHSET C$PS sits INSIDE the object draw pass (WSMAIN.MAC:3919-3932), so an object the cabinet does not draw cannot receive the sights bit. tie-status.ts ports exactly one of that pass's implicit gates — beamHit refusing anything behind the gun (tie-status.ts:170-173 says so out loud) — and beamHit carries no FOV clamp at all, so nothing ties C_PS to visibility. Worked example: a TIE at [400, 0, -10] has perpendicular distance 400 against the 500 u band (2 x TIE_HIT_RADIUS) so C_PS SETS, while its view depth of 10 is under VIEW_NEAR (0x10 = 16) so C_PV is CLEAR. The retired spaceEye made this unreachable — with the eye ~1024 off to one side and the fighter beelining the origin, along = dot(pos - eye, dir) was 0 at point blank and beamHit returned null — so sw8-8's cockpit seat is what exposed it, not what caused it. Consequence: TCH1DZ's loiter break (four C_PS gates, tie-vm.ts:341-342) can fire for a fighter that is not on screen. Behaviourally small (the fighter is about to collide) but it is a fidelity gap in a bit that gates choreography. Likely fix: gate C_PS on C_PV — 'was it drawn' — and pin it with a test seating a fighter inside the band but outside the pyramid. Check first whether the ROM's draw pass has other implicit gates worth porting at the same time."
    description: "DEPENDENCY (architect sweep, 2026-07-31): DO uf1-14 FIRST. This story's likely fix is 'gate C_PS on C_PV', but uf1-14 exists because the C_PV pyramid is the WRONG SHAPE — a faithfully-ported +/-45 degree square pyramid, while render.ts projects perspective(FOV_Y = PI/3, w/h), so the real vertical half-angle is 30 degrees at EVERY aspect and the horizontal one swings with the canvas (45.7 at 16:9, 37.6 at 4:3, 30.0 at 1:1, 53.4 at 21:9). Gating the sights bit on that pyramid now means redoing it when uf1-14 lands. NOTE ALSO that uf1-14, uf1-15 and this story ALL rewrite computeStatus in plugins/star-wars/src/core/tie-status.ts — three open stories in one function. Sequence, do not race."
    points: 2
    priority: p3
    status: backlog
    repos: arcade
    workflow: tdd
    type: bug
  - id: sw8-20
    title: 'star-wars: the ten ROM default high scores should carry wave null, not the fabricated wave 0'
    description: "Routed out of the monorepo migration's Task 20 review and DECLINED by Task 21's implementer with reasoning worth keeping, 2026-07-31. plugins/star-wars/src/core/highScores.ts:20-31 seeds ten default rows using wave 0 as its no-real-run marker, and its own comment at :14-16 calls that value 'a clone artifact, not a ROM value'. The migration made null the honest encoding of exactly that idea: Task 20 widened HighScoreEntry's domain field to number | null specifically so a row with no real run says so instead of inventing one, on the standing ruling that the cabinet must not invent a fact about a player's game. The renderer already cooperates — render.ts:1639 blanks a null wave, so these rows would draw with an empty column and no further change. It was declined for three reasons that all still hold: it is a DATA change inside a game's src/core, not the mechanical call-site update the main.ts carve-out authorises; nothing in the seeding task needed it, since the seed never touches DEFAULT_HIGH_SCORES; and it is a ROM-fidelity display decision with its own test file, so it deserves its own review rather than riding along in a migration commit. The judgement to decline was endorsed. Note the display question is genuinely open: the real cabinet shows SOMETHING in that column for its defaults, so 'blank' may or may not be the faithful answer — settle that against the ROM rather than assuming null-renders-blank is automatically right."
    points: 2
    priority: p2
    status: backlog
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - The ten default rows encode 'no real run' as null rather than the fabricated 0, or the story records a ROM citation showing the cabinet really does display 0 for its defaults and closes as won't-fix.
      - Whatever is chosen, the value and the reason are stated in the file so the next reader does not re-derive it — the current comment already flags 0 as a clone artifact without acting on it.
      - The board's rendering of the default rows is asserted by a test that distinguishes a blank column from the string '0' and from the string 'null'. String(null) is 'null', a truthy non-empty string, so an assertion satisfied by 'a value was drawn' is satisfied by every wrong answer.
      - The existing star-wars high-score test file is updated rather than duplicated, and the change is proven non-vacuous by mutation.
