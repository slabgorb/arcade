  - id: sw8-18
    title: "Correct SIX ROM/doc citation defects across the sw8 ST.UX work, and add the mechanical guard that would have caught them (sw8-8 review rounds 2+3). ROUND-2 ITEMS: (1) gameRules.ts:238-239 claims 'Every writer sits under WSMAIN.MAC .SBTTL MOVE STARS IN SOME DIRECTION and is an SMV* routine' — FALSE: that SBTTL is 2243-2291, .SBTTL MOVE THE PLAYER starts 2292, and the space-wave writer SMVSP1/SMVSP2/SMVNXT/S1MV at 2522 is under MOVE THE PLAYER; S1MV is not an SMV* name. The correction STRENGTHENS the ruling — the routine the ROM files under 'MOVE THE PLAYER' writes nothing but ST.UX. (2) gameRules.ts:241 cites WSMAIN.MAC:2523-2531 — omits the SMVSP1: label at 2522 and runs into S1MVHP: at 2531 (a different routine); correct span 2522-2530, which the design-spec amendment added in the SAME commit already uses. (3) that enumeration omits ST.UX writer S1MVHP (;MOVE DURING HYPER, LSLD8, 2531-2536). (4) incoming-fire-reaction-window.test.ts:40 refers in present tense to bounded-eye-combat.test.ts, deleted by sw8-8; :45-46 offers 'seat the pilot at spaceEye' as a live option the story ruled out and the tombstone forbids; :47-48 describes the re-seated control as fencing off 'parking the eye', now the shipped design. (5) render.ts:61/:63 duplicate '../core/gameRules' import. (6) space-eye-is-cockpit.test.ts:14-15 says the advance(...,1600) fixture yielded [0,0,0]; its own advance() doc at :70-77 correctly says [0,768,0] (trench). ROUND-3 ITEMS: (7) THE SHARPEST ONE, self-inflicted: render.space-camera.test.ts:85 cites the design spec at :26-30 for the longplay quote 'the Death Star is entirely out of frame' — correct when written (:28-30 at 9c6f19c), but sw8-8's own 31-line AMENDED blockquote, added in the SAME commit b664763, pushed it to :45-46. A reader following it lands on the amendment that reinterprets the observation and never reaches the observation. (8) gameRules.ts:240 cites '.REPT 0, :2273-2290' — .REPT 0 is at WSMAIN.MAC:2271; :2272 is SMVDX1: and :2273 is LDD ST.UX, the routine's body. End (:2290 .ENDR) is right; only the start is wrong. (9) sim.ts:2161-2165 keeps five lines of present-tense prose introducing a re-export ('Re-exported HERE so … the invariant still routes through the single function') directly above :2166 saying it was retired — assert and un-assert in five lines; delete the paragraph rather than appending a correction. (10) The CONDENSATION defect, newly introduced: tie-status.ts:13-14 says ST.UX is 'the starfield's register, never a VIEWER' while WSGLOB.MAC:465 reads 'ST.UX:: .BLKB 2 ;VIEWER X POSITION', and :130-131 states the same fact as 'never a CAMERA' ten lines later — two phrasings of one claim in one file, only the second safe. tie-sights-status.test.ts:189 says 'WSSTAR.MAC:98 is its only READER' but LDD ST.UX also appears at WSMAIN.MAC:2245/2266/2273/2279/2285 (read-modify-write increments — the tombstone's fuller phrasing survives, the condensation does not). render.ts:357-358 carries the same condensed form. (11) gameRules.ts:19-20 says 'Neither can read sim.ts shipPoint' when render.ts:62 already imports sim.ts. THE ROOT CAUSE, and why this is p2 not p3: the audit gate re-opens ROM citations but NOTHING re-opens a .MAC:NNNN or file.md:NN span embedded in an ordinary source comment, which is why all eleven items survived two green review rounds and one was invalidated by its own commit. Add that guard — a checker that extracts <file>:<line-span> spans from source comments and re-opens them — or the class recurs. Reviewer recommends treating this as blocking-before-release."
