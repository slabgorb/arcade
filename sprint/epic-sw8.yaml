  - id: sw8-27
    title: The player's GUN carries the same visibility divergence C_PS just lost — the clone can kill a TIE it never drew (sw8-19 TEA + Dev finding) — PLUS the ROM's hit/sights SHAPES (user ruling at setup; box∩1.5x octagon, L1 sights diamond)
    description: |
      FILED at sw8-19's finish, from findings raised INDEPENDENTLY by TEA (test design) and re-verified by Dev (implementation).

      THE DIVERGENCE. sw8-19 gated the C_PS sights bit on C_PV, because the ROM's sole `CHSET C$PS` (WSMAIN.MAC:3930) is unreachable unless `CHSET C$PV` (:3846) executed on the same object in the same pass — S2VW has exactly four exits before it, all long branches to `RTS1` at :3754 (:3825-3826 near clamp, :3827-3828 far clamp, :3834-3836 and :3840-3842 the two ratio tests). The cabinet's LASER-HIT block (WSMAIN.MAC:3898-3918) sits under those SAME four exits, twelve lines above the sights block. So the cabinet cannot resolve a hit on an object it did not draw either — and our port still can.

      MEASURED (TEA, sw8-19 RED): a TIE at [0, 240, -400] on a 16:9 canvas is OUTSIDE the rendered pyramid (vertical bound 230.9) and 240 u from the aim ray, i.e. inside TIE_HIT_RADIUS (250). Killable while off-screen. That seat is pinned TODAY by 'does NOT change the GUN' in tests/core/tie-sights-visibility.test.ts, which asserts beamHit still resolves it — so this change CANNOT happen by accident, and closing this story means deliberately retiring that assertion.

      THE FIX IS NOT THE ONE-LINE GATE sw8-19 USED — this is the datum Dev added while implementing, and it is the reason this is 3 points and not 1. `beamHit` (gameRules.ts) is SHARED with the trench and ground phases (sim.ts:1094 / :1323 / :1339 in the post-chore file — verify before citing, this file moves), and those phases have no C_PV notion at all. Clamping the helper itself is mutant G6/M6 in sw8-19's two mutation batteries and is caught by design. The gate belongs at the SPACE-arm CALL SITE (sim.ts, the player-laser-vs-enemies resolution), not in the helper.

      SCOPE NOTE. This changes what the player can SHOOT, which is why sw8-19 (a 2-point sights-bit story) deliberately did not do it. Expect fixture rework that sw8-19 did not have: sw8-19's candidate fix was measured at ZERO red across 2238 tests, and this one will not be — the hitscan suites seat targets without regard to the glass.

      OPEN QUESTION carried over from sw8-19's setup, worth answering here rather than re-deriving: the ROM's C_PS test is a pure L1 octagon (|dx| + |dy| <= 3*TMPSIZ, WSMAIN.MAC:3920-3924) with no box test, while the laser hit is box AND octagon at 1.5x (:3898-3908). Our port models both as Euclidean spheres. That shape deviation is pre-existing and documented at gameRules.ts:118-123, and containment (kill subset of sights) holds in both models — but nobody has determined whether the L1 diamond and the L2 sphere ever disagree about a SPECIFIC seat in a way a test could see. This story is where that gets answered, because it is the story that touches the gun.

      === SM SETUP, 2026-08-03: MEASURED CORRECTIONS AND A USER RULING (points 3 -> 5) ===

      Everything above is the filing as written. It survives measurement except where noted. Four
      corrections and one scope ruling; the ACs are the authority, this block records what moved.

      1. USER RULING — SCOPE IS BOTH SPACE-ARM CALL SITES, NOT ONE. The filing says "the SPACE-arm
         CALL SITE" (singular). There are two: sim.ts:546 (TIEs) and sim.ts:554 (enemy fireballs).
         The cabinet gates BOTH — VWGUN:: (WSGUNS.MAC:852) has exactly four exits before its
         ";GUN SHOT IS VISIBLE" at :904 (:885 near `CMPD #01`, :887 far `CMPD #7F00`, :896 and :903
         the ratio tests), and the CL.GDS/CL.GP hit-record at :906-948 sits below all four. Same
         structure as S2VW's. Measured: the second gate costs ZERO additional red. See AC2.

      2. USER RULING — THE SHAPE FIX IS IN SCOPE. The filing's OPEN QUESTION (do the L1 diamond and
         the L2 sphere disagree about a specific seat?) is ANSWERED at setup, and the user ruled the
         fix in rather than the answer alone. See AC5/AC6/AC7 for the numbers. Points 3 -> 5.

      3. CORRECTION — "closing this story means deliberately retiring that assertion" is FALSE.
         `does NOT change the GUN` in tie-sights-visibility.test.ts calls `beamHit` DIRECTLY, so the
         caller-side gate the filing itself prescribes leaves it GREEN. Verified by applying the gate
         and running the suite: that file passed. The assertion pins "the gate is not in the helper",
         which AC3 still needs. Do NOT retire it. (Its `sim.ts:535` citation IS stale — the real call
         site is :546, +11 from sw8-19's finish chore — and the comment-citation guard cannot see it.)

      4. CORRECTION — "box AND octagon at 1.5x (:3898-3908)" compresses two thresholds. The BOX is at
         1.0x TMPSIZ (:3898-3903); only the OCTAGON is 1.5x (:3904-3908). The sights test at
         :3920-3924 is 3x and has no box term at all, exactly as the filing says.

      5. VERIFIED, no correction needed — the three helper-sharing citations (sim.ts:1094 / :1323 /
         :1339) are all correct in the current file, as the filing asked to be checked. The ROM
         premises for S2VW's four exits, RTS1 at :3754, `CHSET C$PV` at :3846 and `CHSET C$PS` at
         :3930 all verify line-exact. Vendored ROM source does not rot; the in-repo citations do.

      MEASURED BLAST RADIUS of the full ruled scope (candidate fixes applied to committed source,
      suite run, source restored and md5-verified; baseline 2252/2252 across 201 files):
        gate the TIE site      -> 2 tests red (tie-hit-status.test.ts, the Darth fixture geometry)
        gate the fireball site -> 0 additional
        ROM kill shape         -> 0
        ROM sights shape       -> 1 test red (the SIGHTS_BAND_FACTOR = 2 pin)
      Three tests, two files. THE SMALL NUMBER IS THE RISK, NOT THE GOOD NEWS: three of the four
      changes are invisible to a 2252-test suite, which is the shape in which a guard ships as
      scenery. AC8 makes the mutation proof mandatory for each.
