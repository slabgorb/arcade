  - id: sw8-18
    title: "Correct the sw8 ST.UX citation and prose defects from sw8-8 review rounds 2+3 -- 11 filed (4 since drifted) plus a 12th created by sw8-17 -- and add the comment-citation guard for the three a mechanical checker can catch"
    description: |
      Correct the citation and prose defects the sw8-8 reviewer found in rounds 2 and 3, and add the comment-citation guard for the subset a mechanical checker can actually catch.

      MEASURED AT SETUP (2026-08-02, against the current tree and reference/atari-source/star-wars-1983). Every ROM premise the filing rests on verified line-exact: `.SBTTL MOVE STARS IN SOME DIRECTION` WSMAIN.MAC:2243; `.SBTTL MOVE THE PLAYER` :2292; `SMVSP1:` :2522, `SMVSP2:` :2523, `SMVNXT:` :2524, `S1MV:` :2525, `STD ST.UX` :2528; `S1MVHP: ;MOVE DURING HYPER` :2531 with `JSR LSLD8` :2533 and `STD ST.UX` :2534; `.REPT 0` :2271, `SMVDX1:` :2272, `.ENDR` :2290; `LDD ST.UX` at exactly :2245/:2266/:2273/:2279/:2285; `WSGLOB.MAC:465 ST.UX:: .BLKB 2 ;VIEWER X POSITION`; `WSSTAR.MAC:98 LDD ST.UX ;STARS RELATIVE MOVEMENT`. Items 1-8 and 11 are still true as filed.

      THREE CORRECTIONS TO THE FILING ITSELF.

      (A) FOUR OF THIS STORY'S OWN CITATIONS HAVE DRIFTED — the defect it exists to fix. Use these, not the filed spans: item 9's re-export paragraph is sim.ts:2193-2197 with the retirement note at :2198 (filed as :2161-2165/:2166, +32); item 10's "never a camera" is tie-status.ts:143-144 (filed :130-131); item 10's render.ts condensed form is :395-396 (filed :357-358); item 10's "only READER" in tie-sights-status.test.ts is :192 (filed :189). Re-verify every span before editing — this story has been open across at least sw8-17, sw8-21 and uf1-4.

      (B) ITEMS 1, 8 AND 10 ARE ONE EDIT, NOT THREE, AND ITEM 10'S EVIDENCE OVER-COUNTS BY THREE. All three target the same bullet list, gameRules.ts:232-241, and the same ROM span. Item 10 cites `LDD ST.UX` at :2245/:2266/:2273/:2279/:2285 to refute sole readership, but :2273/:2279/:2285 sit INSIDE the `.REPT 0` block (:2271-:2290) — assembled out, exactly as gameRules.ts:240 correctly says, and that block is item 8's own subject. Only :2245 (SMVBNR, banner) and :2266 (SMVHIS, high-score display) are live read-modify-write increments. The refutation still stands on those two; a fix that cites all five as live readers reintroduces the defect class inside the correction. Note for the ruling: both live readers are attract-mode phases, not gameplay — disclose it, do not silently rely on it.

      (C) THE CONDENSATION IS AT NINE SITES, NOT THE THREE FILED. The claim "WSSTAR.MAC:98 is its only reader" also appears at gameRules.ts:232-234 (the tombstone itself, "Its ONLY reader in the whole tree"), space-eye-is-cockpit.test.ts:9, incoming-fire-reaction-window.test.ts:275-276, tie-fire-visibility.test.ts:137, and the design spec :33-34, in addition to the filed tie-status.ts:13-14 + :143-144, render.ts:395-396 and tie-sights-status.test.ts:192. Fixing three of nine copies of one false sentence is not a shippable deliverable. Note the coupling: item 10's own survival argument is that "the tombstone's fuller phrasing survives" — but the tombstone's bullet at :232-234 carries the condensation, and the bullet that discloses the WSMAIN writers is :238-240, which is items 1 and 8's defect. The survival argument only holds once 1 and 8 are fixed.

      A TWELFTH ITEM, CREATED BY sw8-17 AFTER FILING. sw8-17 shipped (aa7faec, 6de564d) and `deathStarPlacement` now moves the station laterally — render.ts:327-332, `const x = Math.tan(deathStarOffAxis(t)) * -z`. render.space-camera.test.ts:86-88 still says in present/future tense that the port "cannot reproduce it today", that `deathStarPlacement` "seats the station at x = 0 and moves it only in DEPTH", and that "closing that gap is sw8-17, which must port the station's own lateral motion"; :94 still says "the x = 0 the station has today"; the design spec :41-43 carries the same forward reference. This is three lines below item 7's own target, in a file this story already opens.

      THE GUARD, RE-SPECCED HONESTLY (user ruling, 2026-08-02). The filing's title claimed the guard "would have caught them" and its root cause claimed that is why all eleven survived. Measured: under the filing's own spec — extract `<file>:<line-span>` from source comments and re-open them — the guard catches item 7 ONLY. Item 8's citation is the bare-colon form ".REPT 0, :2273-2290", which a `<file>:<line-span>` extractor never sees; item 4's is a bare filename with no line at all. Widened to resolve bare filenames and bare-colon spans against the nearest preceding filename, it reaches items 4, 7 and 8 — three of twelve. The remaining nine are prose defects with correct or absent spans: a false `.SBTTL` attribution, an omitted routine, a duplicate import, a wrong fixture value, a stale re-export paragraph, a stale forward reference, and the condensation — whose span, WSSTAR.MAC:98, is CORRECT, so any span-checker passes it. Build the guard for what it can catch and document what it cannot, so no later reader believes the class is closed.

      EXTENSION POINT, NOT GREENFIELD. plugins/star-wars/tools/audit/check-citations.mjs + tests/audit/citations.test.ts already re-open citations, but only from structured findings in docs/audit/findings/*.json ({file, line, verbatim}). Nothing walks ordinary source comments. The root-cause claim is confirmed; reuse the verbatim-matching machinery rather than writing a second one.
