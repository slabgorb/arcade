    title: 'The comment-citation guard is silent about what it did NOT cover: a failed opt-out looks identical to a skip, and one unreadable file aborts the whole scan'
    description: |-
      Two findings from sw8-23's review, both instances of one mechanism: the scan's report does not distinguish what it COVERED from what it silently did not.

      (1) A FAILED OPT-OUT IS INVISIBLE. sw8-23 replaced an unanchored 'raw.includes(pragma)' opt-out with hasPragma(), which requires the pragma to OPEN a leading comment within the first five lines. That fixed a real hazard — any mention anywhere in a file used to drop it from the scan silently. But the new rule is documented only inside the function's own docstring, and it fails CLOSED with no signal: a contributor who writes '// this file opts out — citation-guard: ignore-file', or who puts it on line six, or after five blank lines, gets no error, no warning and no skip notice, and will reasonably conclude the file was skipped when it was scanned. checkTree announces every SUCCESSFUL skip by name (sw8-23 AC4); nothing announces a FAILED one.

      Proposed: warn when a file contains the pragma TEXT but hasPragma returns false. That is exactly the ambiguous set, it is one extra string test on files already read, and it converts a silent misunderstanding into a line of output. Pairs with a related disclosed edge — '>' counts as a comment leader, so a markdown spec that exhibits the pragma un-indented and un-fenced in its first five lines opts ITSELF out; docs/**/specs is in scope. sw8-23 disclosed that on PRAGMA_HEAD_LINES with the workaround (indent or fence it) rather than closing it, because requiring a code-comment leader would stop markdown opting out at all. A warning on the ambiguous set covers this case too.

      (2) ONE UNREADABLE FILE ABORTS THE WHOLE SCAN. checkTree readFileSync's every scanned file and resolve() readFileSync's every cited target, with no try/catch anywhere. A permission error, a dangling symlink or a deleted-mid-run file throws out of the entire scan rather than reporting that one file. Pre-existing, but sw8-23 grew the blast radius by adding tools/ to the default roots — a directory that holds generated output and, in some checkouts, symlinks. A completeness tool that dies on one bad file reports NOTHING about the other 240, and the failure looks like a crash rather than a finding.

      Proposed: catch per file, emit it as an error row ('<file>: unreadable — <code>') so it counts toward the ratchet like any other problem, and keep scanning.

      WHY BOTH IN ONE STORY. They are the same claim: a green run means 'every file was checked', and today it can also mean 'a file quietly opted itself out' or 'the scan stopped early'. One story, one mechanism — make the scan honest about its own coverage — and the two fixes touch the same function.

      NOT sw8-25: that one is the guard being loud and WRONG about a citation it did check. This is the guard being SILENT about files it did not.

      MEASURED CONTEXT: the delivered guard skips exactly three files today (the two sw8-18 suites and sw8-23's own), all legitimately, all announced by name. The failure modes above are latent, not currently firing — which is why they need a test rather than a bug report.
