      - "render.space-camera.test.ts:85's design-spec citation is re-anchored from :26-30 to :45-46 -- the longplay observation, pushed down by sw8-8's own 31-line amendment in the same commit (b664763) -- AND the sw8-17 staleness immediately below it is corrected: :86-88 and :94 no longer say the station sits at x = 0, moves only in depth, or that sw8-17 is outstanding, and the design spec :41-43's forward reference likewise. `deathStarPlacement` has moved the station laterally via `deathStarOffAxis` since aa7faec (render.ts:327-332)."
      - 'A guard re-opens citations embedded in ordinary source comments across plugins/star-wars (src, tests, and docs/superpowers/specs), handling all THREE citation forms: `<file>:<line>` and `<file>:<line-span>`; a bare `:<line-span>` resolved against the nearest preceding filename in the same comment; and a bare `<file>` with no line at all. It fails on a reference to a file that does not exist, and on a cited span whose quoted verbatim is no longer inside it. It reuses tools/audit/check-citations.mjs rather than duplicating its verbatim machinery.'
      - "The guard is mutation-proven against the three filing items it claims to catch: restoring item 4's reference to the deleted bounded-eye-combat.test.ts, item 7's :26-30 spec span, and item 8's bare-colon ':2273-2290' each reddens the suite INDEPENDENTLY. Each mutant is recorded verbatim in the test's own comment so the next reader re-runs the exact string rather than reconstructing the intent."
      - The guard's documentation states plainly what it does NOT catch -- prose defects whose cited spans are correct or absent, which is nine of the twelve items in this story (the false attribution, the omitted routine, the duplicate import, the wrong fixture value, the stale paragraph, the stale forward reference, and the 'only reader' condensation, whose span WSSTAR.MAC:98 is itself correct) -- so no later reader treats the defect class as closed.
