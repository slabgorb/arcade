  - id: jt5-8
    title: The DUMB brain's wingbeat — linet recomputes every wake, and LNTOFP's forced glide is missing
    description: |-
      RE-SCOPED TWICE, BOTH ON THE USER'S RULING. (1) 2026-08-02 at uf1-9's finish: this story NO LONGER OWNS THE PJOYT LATCH — uf1-9 built it. (2) 2026-08-02 at this story's setup: the PLAYER-SIDE flapHeld half is CLOSED — measured, not argued — so the dumb brain's wingbeat is now the WHOLE scope, and the title was corrected a second time. Points held at 5: the removed half was a "check whether" item worth ~0 of the estimate, and the remaining half carries the expensive re-baseline.

      ALREADY SHIPPED BY uf1-9 — DO NOT REBUILD: the PjoyState workspace (a discriminated union of wing / interval / dwell) on EnemyState; the SMART brains' two-phase up-seek cadence on BOUPWD/BOUPWU and HUUPWD/HUUPWU, with the ROM's asymmetric entry (the bounder's decide ends BRA BOUP1A :3853 and flaps on the arm wake, the hunter's ends BRA B2UP2D :4037 and glides first); the down-seek's hardcoded 2-wake hold (LDA #2, :3823 and :4008) with NO wing-up reload; and the split of flapHeld (the held LEVEL) from flap (its rising EDGE) in stepEnemyDetailed (enemy.ts:1154-1165). All four ROM citations re-verified line-exact at setup.

      CLOSED AT SETUP — DO NOT REBUILD AND DO NOT RE-DERIVE — THE PLAYER-SIDE flapHeld. The original filing asked whether the player needs the enemy's level/edge treatment "or is already correct by a different route". It is already correct, and has been since jt1-6. shell/input.ts:44-45 computes flapHeld as the LEVEL (held.has(binding.flap)) and flap as its rising edge (flapHeld && !prevFlap); main.ts:193-200 threads prevFlap per player. That matches the ROM: P2SAM/P2NJMP :7256-7264 builds CURJOY as A=direction : B=raw button LEVEL ("IS JUMP BUTTON PRESSED" / INCB). The core spends the two fields correctly — flight.ts:292 selects GRAVITY_WINGS_DOWN/UP from flapHeld, flight.ts:258 gates the ADDFLP impulse on flap. It is GUARDED at tests/shell-input.test.ts:74-91 ("flap is an EDGE, not a level"), and that guard is NON-VACUOUS: mutating input.ts:45 to flapHeld := flapHeld && !prevFlap — the OLD TITLE'S CLAIM, verbatim — reddens exactly 2 tests (measured at setup on a clean tree, restored). The only producers of a non-neutral PlayerInput are input.ts:45 (human, correct) and enemy.ts:1162 (enemy, fixed by uf1-9); frame.ts:315 and demo.ts:325 supply NEUTRAL_INPUT as a FALLBACK only, and joust has no autopilot. Two consequences: the old title's clause "flapHeld still takes the press edge" was FALSE and is removed, and the old description's "frame.ts's player path still builds its own input" was FALSE — frame.ts RECEIVES the input from its caller.

      WHAT REMAINS, AND IT IS THE WHOLE STORY: THE DUMB BRAIN'S WINGBEAT. linet() (enemy.ts:358-363) is pure — it recomputes its flap from position and velocity every wake and latches nothing — and withWingCadence explicitly clears any workspace for a linet enemy (enemy.ts:1227; "short-range, null-target, shadow and linet wakes carry NO workspace", :1040). The ROM's LINET wingbeat is a two-state alternation with NO timer at all: LNTUP at :3746-3748 sets the next routine and raises the flap bit (LDD #LNTOFP / STD PJOY,U / LDB #1), and on the NEXT wake LNTOFP at :3759-3762 unconditionally clears it and hands control back (LDD #LINET / STD PJOY,U / CLRB / BRA LNTFLP). LNTOFP does NOT re-run LINET's decision — so the machine cannot flap on two consecutive wakes, and a FORCED GLIDE wake follows every flap. The port has neither half: it flaps again on the very next wake whenever the condition still holds. The DECISION itself is already faithful — the sunk-below-lane and already-rising tests at :3741-3745 match linet()'s pixelY > target && !rising, and the facing-direction move at :3749-3757 matches dir: enemy.facing. What is missing is the ALTERNATION STATE around it.

      WHY IT STILL MATTERS: the wing-down hold selects which gravity applies (GRAVITY_WINGS_DOWN vs GRAVITY_WINGS_UP, flight.ts:292), so landing this WILL move the jt2 seeded-replay digests, and it will also change the enemy wing-flap AUDIO cadence (the cue is derived from the flapHeld transition, enemy.ts:1163). Expect a blast radius at least uf1-9's and probably LARGER: uf1-9 re-baselined 21 pins for a change to the SMART brains, and its own R1-7 measurement (three seeds, 6000 frames of real createGame + stepGame) found that only linet and boundr brains ever appear in end-to-end play — this story changes the more exercised of the two. Re-baseline by sweeping for each pin's own precondition rather than nudging numbers; two of uf1-9's pins had to change SEED because the precondition had an empty solution set on the old one. Read sprint/archive/uf1-9-session.md before starting.

      Filed from TEA's RED findings on jt5-3, 2026-08-01; re-scoped 2026-08-02 at uf1-9's finish and again 2026-08-02 at setup.
