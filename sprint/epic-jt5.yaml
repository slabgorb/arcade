  - id: jt5-1
    title: Joust audio seam — the core event channel and the dispatch, no samples yet (the shared-engine ruling is moot post-migration)
    description: "The seam only — this story ships NO baked samples and NO R2 uploads, so it cannot be blocked by asset production. It answers one open question first, then builds the same three pieces the sibling games share. THE QUESTION, AND WHY IT IS MOOT: joust consumed nothing from @arcade/shared when this story was filed — not rng, pause, esc-overlay, highscore or name-entry — where the other six games take between five and thirteen subpaths (centipede 5, red-baron 8, asteroids and tempest 10, star-wars 11, battlezone 13; measured 2026-07-31). The 2026-07-30 monorepo collapse DISSOLVED that question rather than answering it: src/shared/ is in-tree behind the @shared/* alias, so adopting the shared engine costs one import line, with nothing pinned, git-URL'd or version-bumped. This story adopts it and records the ruling as moot. THE PIECES: src/core/events.ts, a discriminated union of gameplay moments the sim emits as DATA on the GameState it returns — the stream is a FIELD on that state, not a step-result wrapper — never as callbacks, so the core stays pure and jt2's seeded determinism replays still reproduce bit-for-bit — joust's replays are a real constraint here, not a formality. The sim already produces every moment worth a cue: the flap, a lance joust won or lost, a rider unhorsed, an egg laid, collected or hatching, the buzzard, the pterodactyl arriving, the lava troll's grab, the wave clearing, a life lost. Then src/shell/audio.ts with the manifest and channel map, and src/shell/audio-dispatch.ts with a never exhaustiveness guard so a later event kind added without a cue fails the build. GROUND TRUTH IS A DIFFERENT QUARRY: joust is Williams, not Atari, so the five vector games' POKEY lineage does not carry over and neither does centipede's. Establishing what JOUSTRV4.SRC and the machine's sound board actually specify is part of this story; cite it or record explicitly that a cue is an invention pending source."
