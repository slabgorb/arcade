  - id: jt5-4
    title: The THUDs — apply the bounce collisionPass computes and discards, then cue it
    description: "Two ROM cues are blocked on physics the sim computes and throws away. SNPTHD (:8124, 'AT LEAST 1 PERSON THUD''ED', call site :5014 'PLAYERS COLIDE') and SNETHD (:8106, 'ENEMIES THUD', call site :5019 'ENEMIES COLIDE'). collisionPass computes the bounce outcome and DISCARDS it — 'if (contact.outcome.kind !== \"kill\") continue' (plugins/joust/src/core/demo.ts, the joust pair loop) — and bounceTop, bounceBottom and bounceHorizontal in joust.ts have ZERO production callers. So a non-killing collision currently does nothing at all: no push, no separation, no sound. The work is APPLYING the bounce first; the cue is the easy half and must not land without it, because a thud announcing a collision the sim does not resolve is an audible lie. Same disease as uf1-11's troll grip one layer over: a faithful, tested, cited pure core with no caller."
    points: 5
    priority: p3
    status: backlog
    repos: arcade
    workflow: tdd
  - id: jt5-5
    title: Sound PRIORITY arbitration — @shared/audio steals, the machine refuses
    description: "joust's machine has ONE sound voice arbitrated by PRIORITY, and @shared/audio has no priority notion at all. SND compares the incoming table's priority byte against the sounding one and REFUSES a lower interruption — 'CMPA SPRI  OK TO INTERUPT THIS PIRORITY SOUND? / BLO NOSND' (SYSTEM.SRC:767-768) — whereas the shared engine's channels always steal, last-write-wins. jt5-1 kept the map from INVERTING the ROM by giving each distinct ROM priority its own channel (eleven cues, nine priorities, nine channels), but that is a fence, not the mechanism: a priority-40 enemy death still cannot be refused in favour of a sounding priority-80 player death, because they sit on different channels and both simply play. Options: an optional per-sound priority in src/shared/audio.ts (it would serve any cabinet with a single-voice machine), or a joust-side wrapper that tracks the sounding priority itself. The eleven priorities are already recorded in CUE_SOURCES in plugins/joust/src/shell/audio.ts, so the data is in place."
    points: 3
    priority: p3
    status: backlog
    repos: arcade
    workflow: tdd
  - id: jt5-6
    title: SNPCR2 — give player 2 its own transporter cue instead of P1's
    description: The two knights have SEPARATE transporter re-create tables in the ROM and jt5-1 collapsed them onto one. SNPCR1 (:8116, 'FCB 070,!N$12!+$80,30') and SNPCR2 (:8119, the same $12 opener at a different offset — '30+13' — then !N$15! where SNPCR1 has !N$14!) are bound to P1DEC and P2DEC separately (:5552, :5556). jt5-1's player-materialise kind carries no payload, so both knights map onto SNPCR1 and its citation says so in a SCOPE comment. Splitting them needs a player id on the event, a second manifest row AND a second SAMPLE — not just a second row, which is the trap. Low value alone; worth folding into jt5-2 if the samples are being produced anyway.
    points: 2
    priority: p3
    status: backlog
    repos: arcade
    workflow: tdd
  - id: jt5-7
    title: Correct the jt5 epic description and joust's unguarded README counts
    description: "Two documentation debts jt5-1 recorded rather than fixed. (1) THE EPIC DESCRIPTION IS STALE and now contradicts a landed story: sprint/epic-jt5.yaml still frames the @shared adoption question as an open ruling, quotes the REFUTED 'every other game consumes between four and nine subpaths' (measured 2026-07-31: battlezone 13, star-wars 11, tempest 10, asteroids 10, red-baron 8, centipede 5 — the range is 5-13), and says events are 'emitted as DATA on the step result' when stepGame returns a bare GameState and the stream is a field on it. It also lists the flap, the egg laid, the joust won and the wave clearing as moments 'the sim already produces' — the machine's 38-table sound set (:8051-8131) contains NO wave-clear, egg-laid or joust-won cue at all, so a future story reaching for those will find nothing to cite and should mark them inventions under AC5's escape hatch rather than hunt. (2) plugins/joust/README.md carries measured counts nothing guards — the suite size, the claim count (twice) and a six-number skipIf reconciliation block. jt5-1 re-measured and updated all of them and they will go stale again on the next story that adds a test file. Either derive them in a test or mark them indicative."
