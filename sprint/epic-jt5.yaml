    acceptance_criteria:
      - Optional priority + optional frame-duration on the shared engine's manifest, additive and backward-compatible — the six games that pass neither keep today's always-steal behaviour, proven by test.
      - A higher-or-EQUAL incoming priority interrupts; a strictly-lower one is REFUSED — but only while the sounding cue's frame window is still running (STMR countdown). Once the window expires, ANY priority is accepted unconditionally (the STMR==0 path).
      - joust wires its already-recorded CUE_SOURCES priorities and the frame durations (parsed from ROM verbatim strings) through; the concrete pin is that a priority-40 enemyDeath is refused while a priority-80 playerDeath is still within its window.
      - "The ROUTINE EXTENT is corrected everywhere it appears: the epic description's `:761-768`, and the shipped comment at plugins/joust/src/shell/audio.ts:164's `:761-772`, both become `SYSTEM.SRC:761-773`."
      - "Claim JT53-004 is fixed on BOTH axes: (i) its \"never steals\" consequence is RE-CITED onto the mechanism (SYSTEM.SRC:761-773), because the current cite (:8108) is a table-definition row that cannot support it; and (ii) once the arbitration lands the clause is true of our port too, so verify it rather than merely asserting it. The citation gate re-opens only the quoted line and cannot see a claim's body — the gate going green is NOT evidence here."
