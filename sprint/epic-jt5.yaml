  - id: jt5-12
    title: 'Hatch the kill-egg: an uncollected joust egg never matures, only a WAVE egg does'
    description: "A joust kill spawns an egg through eggProcess (plugins/joust/src/core/demo.ts:824, spawned at :945) and that egg carries NO waveEgg: true tag. stepDemo's self-clear hatch (demo.ts:1194, jt4-5) matures ONLY wave eggs, so an uncollected kill-egg sits SETTLED with willHatch === true forever and the wave-clear gate (!enemiesLeft && !processes.some(egg), demo.ts:1226-1229) never opens while it lives. THIS IS A FIDELITY GAP, NOT A SOFT-LOCK — the distinction was measured twice on jt5-4 and the soft-lock reading is WRONG: at seed 0xbeef the stray egg settles at posX 219, pixel Y 128, the same platform and height as the idle player 2 nineteen pixels away; driving player 2 with a bare dir: 1 collects it at frame 1535 and clears the wave at frame 1614. All three seeds jt5-4's Dev called permanently stuck (0xbeef, 0x2468, 0x1a2b3c4d) reach wave 3 within 6000 frames once a player moves, and every settled kill-egg observed landed at a pixel Y a player is also observed standing on. So a moving player always CAN collect it; the gap is that the ROM does not require them to. Nothing in JOUSTRV4.SRC privileges a wave egg's maturation over a kill egg's — in the machine an uncollected egg hatches into a remounting buzzard regardless of provenance — so the restriction to waveEgg === true is the port's invention. KNOW THE BLAST RADIUS BEFORE STARTING: closing this turns FIVE pinned numbers red at once, all of them legitimate re-baselines and not regressions — fingerprint(0xbeef, 2400) and fingerprint(0x2468, 900) in plugins/joust/tests/audio-events.test.ts (both of which jt5-4 re-baselined onto runs that STALL at wave 1, so they currently certify a stalled run as expected), the third jt5-4 re-baseline in the same file, and entityDigest(0xbeef, 160) / entityDigest(0x2468, 200) in plugins/joust/tests/audio-thud.test.ts, which jt5-4's Reviewer froze from not.toEqual into exact toEqual pins. Re-baseline them deliberately and say so; do not treat the reds as a defect. ALSO NOTE: entityDigest(0x2468, 200) is currently one of only three guards on the SNPTHD register-role law, so re-baselining it removes a guard — check that plugins/joust/tests/audio-thud.test.ts's absolute 'OSTXTP sends REG.X up' assertions (added in jt5-4's rework round 2) are still present and still redden a role inversion before you touch the digest. Filed from jt5-4's Dev and Reviewer Delivery Findings, 2026-08-01."
