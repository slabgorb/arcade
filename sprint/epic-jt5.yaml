  - id: jt5-7
    title: Correct the jt5 epic description and joust's unguarded README counts
    description: "Documentation debts recorded rather than fixed. (1) THE EPIC DESCRIPTION IS STALE and contradicts landed stories: sprint/epic-jt5.yaml still frames the @shared adoption question as an open ruling, quotes the REFUTED 'every other game consumes between four and nine subpaths' (measured 2026-07-31: battlezone 13, star-wars 11, tempest 10, asteroids 10, red-baron 8, centipede 5 — the range is 5-13), and says events are 'emitted as DATA on the step result' when stepGame returns a bare GameState and the stream is a field on it. It also lists the flap, the egg laid, the joust won and the wave clearing as moments 'the sim already produces' — the machine's 38-table sound set (:8051-8131) contains NO wave-clear, egg-laid or joust-won cue at all, so a future story reaching for those will find nothing to cite and should mark them inventions under jt5-1's AC5 escape hatch rather than hunt. (2) plugins/joust/README.md carries measured counts nothing guards — the suite size, the claim count (twice) and a six-number skipIf reconciliation block. They go stale on every story that adds a test file. Either derive them in a test or mark them indicative. ADDED 2026-08-01 BY jt5-3's REVIEWER AND SM (this story is the named owner for both): (3) jt5-3's OWN description in this epic YAML still carries the REFUTED extent 'JOUSTRV4.SRC:6207-6218' for GOFLAP. GOFLAP is :6212, FLAST2 is :6216, and the load-bearing three lines are :6216-6218; :6207 is GOTFIT JSR SRCADA, in the other loop's tail. A wrong extent is worse than a wrong fact because it MANUFACTURES corroboration — a reader who checks only the cited span sees a false claim confirmed. (4) The wording 'FLAPS2/FLIPS2, the labels BELOW each JSR VSND' is true of FLIPS2 and FALSE of FLAPS2, and it propagated: claim JT53-001 in plugins/joust/docs/rom-study/claims/audio.json, a comment at plugins/joust/src/core/flight.ts:438, and seven sites in plugins/joust/tests/audio-flap.test.ts. Fix all nine together or the next reader finds the corrected copy and the stale copies disagreeing."
