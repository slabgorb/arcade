    description: "jt5-3's Reviewer ran a 24-mutation battery. Twenty-one mutations reddened something; THREE reddened NOTHING across all 1979 joust tests, which means three behaviours the story deliberately chose are held in place by prose alone. The shipped code is CORRECT in all three cases — this story does not change behaviour, it pins it. (1) THE PRE-STEP wasAirborne READ, plugins/joust/src/core/frame.ts:321. Reading wasAirborne AFTER the step instead of before reddens 0/1979 and yet genuinely changes the emitted stream: over 3000 frames of a hold-3/release-4 script at seed 0xbeef the wing-cue count goes 1610 to 1609, with player-wing-up vanishing at frames 633 and 1732 and appearing at 2656 — the divergence is exactly the frames where airborne flips INSIDE the step. That measurement is the test: stage a frame where the entity becomes airborne mid-step and assert which cue is emitted. (2) GameState.cues IS NEVER ACCUMULATED across frames — frame.ts:163-169 says so in a comment and nothing enforces it. Mutating stepFrame to accumulate reddens 0. Assert a fresh array per frame, not merely that the field exists. (3) stepDemo EMITS FLIGHT CUES BEFORE COLLISION CUES — demo.ts:1109 documents the order and flipping it reddens 0. Assert the relative order in a frame that produces both. WHY THIS IS ITS OWN STORY AND NOT A NOTE: this is the exact shape jt5-1 shipped and jt5-3 measured — a seam whose sweeps all read the same EVENT_KINDS tuple and therefore agree with each other whether or not anything is right. Six of jt5-1's eleven cues could be deleted with the suite fully green. A guard that cannot fail is not a guard. Verify each new test by mutation before calling it done: make the change the test forbids, watch it redden, revert. Filed from the Reviewer's mutation battery on jt5-3, 2026-08-01."
