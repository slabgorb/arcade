  - id: jt5-2
    title: The samples — synthesise joust's cues, upload them, and prove a live 200 (count is whatever the manifest holds when this runs, NOT eleven)
    description: "jt5-1 built the seam and left joust SILENT: eleven ROM-cited cues, zero .wav files, nothing in the assets bucket. This story records or synthesises them and uploads them. COUNT CORRECTION 2026-08-01 (jt5-3's Reviewer): 'eleven' is stale and this story must NOT hardcode a number. jt5-3 added four wing cues (player and enemy, wing-down and wing-up) taking the manifest to fifteen; jt5-4 adds SNPTHD and SNETHD; jt5-6 splits player-materialise onto SNPCR1/SNPCR2 and needs a SECOND SAMPLE, not just a second manifest row; and jt5-10 may or may not add the pterodactyl to the enemy wing pair. DERIVE THE LIST FROM SOUNDS in plugins/joust/src/shell/audio.ts AT THE TIME THIS RUNS and bake exactly that set — the epic's story order (agreed with the user 2026-08-01) deliberately puts this story LAST so the cue set is complete and one upload pass suffices. THE SOUND BOARD'S FIRMWARE IS NOT VENDORED — reference/williams-source/joust/JOUSTSND.DOC is three lines whose entire content is the pointer 'SEE [LIBRARY.SOUND]VSNDRM4.SRC', and no revision carries that file. So nothing here can bake a waveform from source the way tempest's POKEY route does; every sample is a recording or a synthesis, and the manifest's CUE_SOURCES entries say which table each is standing in for. THE ACCEPTANCE TEST IS A LIVE 200, NOT A GREEN VITEST: @shared/audio degrades silently on a 404, on blocked autoplay, and on undecodable data alike, so a passing suite is indistinguishable from a bucket with nothing in it — this is exactly how a star-wars .wav stayed missing from sw7-18 all the way to sw8-14. Upload with 'just deploy-assets' (CI never touches that bucket, which is named plain 'arcade', not 'arcade-assets'; the recipe currently bakes star-wars ONLY and must be extended). Then curl each URL under https://arcade-assets.slabgorb.com/joust/sfx/ and paste the status codes. The filenames are fixed by SOUNDS. Also flip the README status line off 'silent'."
