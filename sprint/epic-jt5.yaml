  - id: jt5-8
    title: The enemy's wing-down LATCH — our brains recompute each wake and latch nothing
    description: "jt5-3 built the wing-edge detector and deliberately left the enemy input model alone. This story confronts what it left. plugins/joust/src/core/enemy.ts:540 reads 'flapHeld: decision.flap' — the buzzard's held LEVEL is assigned its press EDGE, so an enemy holds wings down for exactly one frame per flap. The ROM's buzzard does not: the brain LATCHES a wing-down duration and our linet()/smartDecision() recompute a condition each wake and latch nothing. THE QUARRY (verified against reference/williams-source/joust/JOUSTRV4.SRC during jt5-3's RED): LNTUP at :3746-3748 sets the next brain routine and raises the flap bit ('LDD #LNTOFP / STD PJOY,U / LDB #1'), and on the NEXT wake LNTOFP at :3759-3762 clears it ('LDD #LINET / STD PJOY,U / CLRB'). So one wake down, next wake up IS the machine's wingbeat. BOUNDR does it with an explicit timer instead: 'LDA BOUPWD / BOUP12 STA PJOYT,U  WING DOWN TIME' at :3864-3865 and 'LDA BOUPWU' at :3894, both reading DYTBL rows at :7314-7315 (3/2/1 and 10/8/6 — the per-difficulty wing-down and wing-up hold times). We have no PJOYT equivalent at all. WHY THIS IS NOT SMALL: the wing-down hold selects which gravity applies (GRAVITY_WINGS_DOWN vs GRAVITY_WINGS_UP at flight.ts:292), so landing it MOVES EVERY jt2 SEEDED-REPLAY FINGERPRINT. Expect to re-baseline the determinism digests, and treat that re-baseline as the story's main risk, not its footnote. Filed from TEA's RED findings on jt5-3, 2026-08-01."
    points: 5
    priority: p3
    status: backlog
    repos: arcade
    workflow: tdd
  - id: jt5-9
    title: PTIMUP clears at BOTH wing transitions — a release restores flap lift and our flight.ts never does
    description: "A second thing jt5-3 found and could not take. The ROM clears PTIMUP at BOTH wing transitions — 'CLR PTIMUP,U  RE-INIT BUTTON PRESSES' at JOUSTRV4.SRC:6185 (the GOFLIP path, i.e. the RELEASE edge) and 'CLR PTIMUP,U' at :6219 (the GOFLAP/FLAST2 path, the PRESS edge). PTIMUP is the flap-lift budget, so on the real machine RELEASING the button restores your lift. Our plugins/joust/src/core/flight.ts tracks timeUp (tickTimeUp, called from stepPlayerEntity in frame.ts and stepEntity in enemy.ts) but NEVER resets it in flight — it only decays. The gameplay consequence is real and it is the one every Joust player knows: rapid tapping should climb better than holding, and on our port it does not, because only the press edge is modelled. Now that jt5-3 has landed a release-edge detector in the core, the edge this needs EXISTS — that was the blocker, and it is gone. WATCH THE SAME TRAP AS jt5-8: changing when timeUp resets moves every jt2 seeded-replay fingerprint, so budget for re-baselining the determinism digests. Do not land this and jt5-8 in the same commit; two fingerprint-moving changes at once make the re-baseline unreviewable. Filed from TEA's RED findings on jt5-3, 2026-08-01."
    points: 3
    priority: p3
    status: backlog
    repos: arcade
    workflow: tdd
  - id: jt5-10
    title: Does the pterodactyl reach FLAPLP/FLIPLP? P7DEC binds the enemy wing cues to a bird with no flap model
    description: "An open question jt5-3 surfaced and could not answer inside its scope: does the ROM's pterodactyl flap? THE EVIDENCE THAT IT MIGHT: the decision blocks at JOUSTRV4.SRC:5560-5576 bind the enemy sound tables, and the LAST of them, P7DEC at :5576, is the pterodactyl's — it begins 'FDB SNELWU,SNELWD,SNEMSK,SNEMS2,0,0,SNEFAL,0,SNECRE', binding the SAME wing-up and wing-down cues as the buzzards (note it zeroes the two RUN entries, which is consistent with a bird that never touches the ground). A decision block only needs DSNWU/DSNWD bound if something loads through them, and the only loaders are GOFLIP (:6183) and FLAST2 (:6217) inside the FLAPLP/FLIPLP loops. THE EVIDENCE THAT IT MIGHT NOT: our stepPteroFlight has no flap model whatsoever, and the ptero's ROM movement routine (PTERO, around :1142) may drive it on a different path that never enters those loops — in which case the binding is boilerplate copied across the enemy blocks and means nothing. This is a READ-THE-ROM story before it is a code story: settle it from the source, then either emit the existing enemy wing kinds for the ptero or record explicitly that the ptero is silent by design. WHY IT MATTERS NOW: jt5-2 bakes the samples, and if the ptero shares SNELWU/SNELWD it needs no new sample at all — but if this is never settled, a reviewer will ask the question again at bake time with less evidence to hand. Filed from TEA's RED findings on jt5-3, 2026-08-01. ADDED 2026-08-01 BY jt5-4's TEA AND REVIEWER (routed here rather than filed as its own story, because it is the same question about the same bird): SNETHD's own branch covers PTERO-VS-PTERO, not just enemy-vs-enemy — ':4961  BNE OSTHT2   BR=NO KILL (ENEMY VS. ENEMY, PTERO VS. PTERO)' — and this port cannot reach that half. collisionPass's joust pair loop (plugins/joust/src/core/demo.ts:859-861) filters to kind === 'player' || kind === 'enemy', and a ptero is resolved only through resolvePteroAttack against a PLAYER, so two pteros never meet. The ROM routes them explicitly: OSTHT2 checks PID for PTEID on BOTH parties (:5022-5027) and sends a ptero-vs-BIRD pair to PTEBRD (:5034, :5037-5038) while sending a ptero-vs-PTERO pair back to OSTH11 (:5031-5033, 'BR=YES, SAME OLD COLISION') — i.e. to the ordinary bump, with the SNETHD cue already played at :5020. jt3-5's baiters cap at three pteros on screen, so two DO coexist in ordinary play: the cue is reachable in principle and unreachable in fact. Settle it in the same read that settles P7DEC — if the ptero is a full collision participant, both this and the wing cues follow; if it is not, record that and the SNETHD ptero arm is correctly dead here."
    points: 2
