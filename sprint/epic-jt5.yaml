  - id: jt5-5
    title: Sound PRIORITY arbitration — @shared/audio steals, the machine refuses
    description: "joust's machine has ONE sound voice arbitrated by PRIORITY, and @shared/audio has no priority notion at all. SND compares the incoming table's priority byte against the sounding one and REFUSES a lower interruption — 'CMPA SPRI  OK TO INTERUPT THIS PIRORITY SOUND? / BLO NOSND' (SYSTEM.SRC:767-768; the surrounding routine is :761-773 (SND runs from its label to the shared NOSND RTS; :761-768 is only the refusal half and omits the SN1NS accept path at :769-772), 'LDA ,X+' fetching the priority, and HIGHER number wins) — whereas the shared engine's channels always steal, last-write-wins. jt5-1 kept the map from INVERTING the ROM by giving each distinct ROM priority its own channel, but that is a fence, not the mechanism: a priority-40 enemy death still cannot be refused in favour of a sounding priority-80 player death, because they sit on different channels and both simply play. Options: an optional per-sound priority in src/shared/audio.ts (it would serve any cabinet with a single-voice machine), or a joust-side wrapper that tracks the sounding priority itself. The priorities are already recorded in CUE_SOURCES in plugins/joust/src/shell/audio.ts, so the data is in place. ADDED 2026-08-01 BY jt5-3's REVIEWER (MEDIUM finding, this story is the named owner): the claim JT53-004 in plugins/joust/docs/rom-study/claims/audio.json asserts of SNELWD that it sits 'below the player pair's 010, so a buzzard's wingbeat never steals the knight's own'. That consequence is TRUE OF THE MACHINE and was re-verified against SYSTEM.SRC:761-773 — but it is more than its own cited line (:8108, the table definition) supports, and it is FALSE IN MECHANISM for our port, where src/shared/audio.ts contains zero priority identifiers and the two pairs merely sit on different channels so nothing arbitrates at all. When this story lands the arbitration, that clause becomes true of us too; until then it reads as a claim about our engine. Either re-cite it onto SYSTEM.SRC and scope it explicitly to the machine, or make it true. The citation gate cannot catch this class of error — it re-opens only the quoted line and cannot see a claim's body. RULED 2026-08-01 BEFORE setup, so the two Options above are settled and this story is no longer an either/or: the arbitration goes in src/shared/audio.ts as an OPTIONAL per-sound priority (a deliberate override of CLAUDE.md:337, taken with the census that six of the seven games importing @shared/audio have zero priority notion), and the sounding window is a ROM FRAME COUNT mirroring STMR rather than the decoded .wav's length (decisive because jt5-2's samples are still backlog, so no .wav exists to measure)."
