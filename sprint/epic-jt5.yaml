  - id: jt5-10
    title: Does the pterodactyl reach FLAPLP/FLIPLP? P7DEC binds the enemy wing cues to a bird with no flap model
    description: "An open question jt5-3 surfaced and could not answer inside its scope: does the ROM's pterodactyl flap? THE EVIDENCE THAT IT MIGHT: the decision blocks at JOUSTRV4.SRC:5560-5576 bind the enemy sound tables, and the LAST of them, P7DEC at :5576, is the pterodactyl's — it begins 'FDB SNELWU,SNELWD,SNEMSK,SNEMS2,0,0,SNEFAL,0,SNECRE', binding the SAME wing-up and wing-down cues as the buzzards (note it zeroes the two RUN entries, which is consistent with a bird that never touches the ground). A decision block only needs DSNWU/DSNWD bound if something loads through them, and the only loaders are GOFLIP (:6183) and FLAST2 (:6217) inside the FLAPLP/FLIPLP loops. THE EVIDENCE THAT IT MIGHT NOT: our stepPteroFlight has no flap model whatsoever, and the ptero's ROM movement routine (PTERO, around :1142) may drive it on a different path that never enters those loops — in which case the binding is boilerplate copied across the enemy blocks and means nothing. This is a READ-THE-ROM story before it is a code story: settle it from the source, then either emit the existing enemy wing kinds for the ptero or record explicitly that the ptero is silent by design. WHY IT MATTERS NOW: jt5-2 bakes the samples, and if the ptero shares SNELWU/SNELWD it needs no new sample at all — but if this is never settled, a reviewer will ask the question again at bake time with less evidence to hand. Filed from TEA's RED findings on jt5-3, 2026-08-01. ADDED 2026-08-01 BY jt5-4's TEA AND REVIEWER (routed here rather than filed as its own story, because it is the same question about the same bird): SNETHD's own branch covers PTERO-VS-PTERO, not just enemy-vs-enemy — ':4961  BNE OSTHT2   BR=NO KILL (ENEMY VS. ENEMY, PTERO VS. PTERO)' — and this port cannot reach that half. collisionPass's joust pair loop (plugins/joust/src/core/demo.ts:859-861) filters to kind === 'player' || kind === 'enemy', and a ptero is resolved only through resolvePteroAttack against a PLAYER, so two pteros never meet. The ROM routes them explicitly: OSTHT2 checks PID for PTEID on BOTH parties (:5022-5027) and sends a ptero-vs-BIRD pair to PTEBRD (:5034, :5037-5038) while sending a ptero-vs-PTERO pair back to OSTH11 (:5031-5033, 'BR=YES, SAME OLD COLISION') — i.e. to the ordinary bump, with the SNETHD cue already played at :5020. jt3-5's baiters cap at three pteros on screen, so two DO coexist in ordinary play: the cue is reachable in principle and unreachable in fact. Settle it in the same read that settles P7DEC — if the ptero is a full collision participant, both this and the wing cues follow; if it is not, record that and the SNETHD ptero arm is correctly dead here."
