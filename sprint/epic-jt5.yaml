  - id: jt5-3
    title: The FLAP — the two-edge wing cue, and the release-edge detector the core lacks
    description: "The flap is the sound joust is known for and jt5-1 could not wire it. It is a TWO-EDGE cue in the ROM: the PRESS plays wing-DOWN (GOFLAP -> FLAST2, 'LDX DSNWD,X', JOUSTRV4.SRC:6216-6218 -> SNPLWD :8126 for the knight / SNELWD :8108 for a buzzard) and the RELEASE plays wing-UP (GOFLIP, 'LDX DSNWU,X', :6182-6184 -> SNPLWU :8125 / SNELWU :8107). Our core sees only the press edge (input.flap, consumed at frame.ts:214 and enemy.ts:496); the release edge needs state nothing tracks today, so this story adds a held/released edge detector in src/core and two new kinds per party. WATCH THE 1982 TYPO: the ROM's own comment at :6217 reads 'GET WING UP SOUND' over the symbol DSNWD — a copy-paste error in the source. Trust the symbol, not the comment. Half a two-edge cue is worse than none, which is why jt5-1 declared neither: see its AC2 guard, which explicitly forbids the names player-flap/enemy-flap/flap until an emitter exists."
