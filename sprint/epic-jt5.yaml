  - id: jt5-9
    title: PTIMUP clears at BOTH wing transitions — a release restores flap lift and our flight.ts never does
    description: "A second thing jt5-3 found and could not take. The ROM clears PTIMUP at BOTH wing transitions — 'CLR PTIMUP,U  RE-INIT BUTTON PRESSES' at JOUSTRV4.SRC:6185 (the GOFLIP path, i.e. the RELEASE edge) and 'CLR PTIMUP,U' at :6219 (the GOFLAP/FLAST2 path, the PRESS edge). PTIMUP is the flap-lift budget, so on the real machine RELEASING the button restores your lift. Our plugins/joust/src/core/flight.ts tracks timeUp (tickTimeUp, called from stepPlayerEntity in frame.ts and stepEntity in enemy.ts) but NEVER resets it in flight — it only decays. The gameplay consequence is real and it is the one every Joust player knows: rapid tapping should climb better than holding, and on our port it does not, because only the press edge is modelled. Now that jt5-3 has landed a release-edge detector in the core, the edge this needs EXISTS — that was the blocker, and it is gone. WATCH THE SAME TRAP AS jt5-8: changing when timeUp resets moves every jt2 seeded-replay fingerprint, so budget for re-baselining the determinism digests. Do not land this and jt5-8 in the same commit; two fingerprint-moving changes at once make the re-baseline unreviewable. Filed from TEA's RED findings on jt5-3, 2026-08-01."
