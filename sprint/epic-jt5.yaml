  - id: jt5-23
    title: What ARE G1DEC/G2DEC? CUE_SOURCES now cites two decision-block families with no model of either
    description: |-
      The ROM binds each creature sound table TWICE, in two families of decision block, and joust models neither. Measured in jt5-6 (JOUSTRV4.SRC): G1DEC (label :5542, row :5544) and G2DEC (:5546, row :5548) versus P1DEC (:5550, row :5552) and P2DEC (:5554, row :5556). The rows differ in exactly two places — the joystick source (G1JOY/G2JOY vs P1JOY/P2JOY) and the 8th sound slot, which is a bare `0` in the G-blocks and SNPTREF ("PLAYER ABORTED FADING IN (TRANSPORTER)", :8122) in the P-blocks. Nothing in the port knows the difference. jt5-6 moved playerMaterialise/player2Materialise onto the P-blocks (:5552/:5556) because SNPCR1/SNPCR2 are exactly where the families differ and those are the rows the story cited, but LEFT the four wing cues citing G1DEC :5544 — correct for them, since SNPLWU/SNPLWD open every one of the four rows identically, but the result is that CUE_SOURCES now cites BOTH families with no recorded reason a reader could check. Establish what the G-blocks are (attract/demo? a two-player-game variant? grep the FDB consumers of each label and the DECSN/PDECSN selection), record it, and rule whether the wing citations should follow. Do this BEFORE another story cites either family. Found by jt5-6 TEA and confirmed by its Reviewer.

      --- SM SETUP CORRECTION (2026-08-02, measured before setup; original text above left intact) ---
      All EIGHT ROM citations above VERIFY exactly (G1DEC :5542/:5544, G2DEC :5546/:5548, P1DEC :5550/:5552, P2DEC :5554/:5556, the two-place difference, the 0-versus-SNPTREF 8th slot, SNPTREF at :8122, and the identical SNPLWU/SNPLWD openings). TWO claims do not.
      (1) 'no recorded reason a reader could check' is OVERSTATED. audio-manifest.ts:326-332 already records a checkable reason for the citation split, and :218-223 records the mechanical difference. So the natural RED test - assert a rationale exists - PASSES ON ARRIVAL and is vacuous. What is genuinely unrecorded is what the families MEAN; both comments say only 'Nothing in this port models the G/P distinction'.
      (2) 'the four wing cues citing G1DEC :5544' is FALSE. Only TWO cues cite :5544 (playerWingDown :346, playerWingUp :363). enemyWingDown/enemyWingUp cite :5560, which is P3DEC's row. The shipped comment at audio-manifest.ts:326 carries the SAME error ('These four cite the G-BLOCK row') and is where the story inherited it - fixing that false sentence is now AC5.
      SM ANSWERED THE STORY'S MAIN QUESTION (hand to TEA as a cited claim to VERIFY, not as settled fact): JOUSTRV4.SRC:1025-1029 reads LDX #G1DEC 'ASSUME GAME SIMULATION' / LDA GOVER / BGT (keep G) / LDX #P1DEC / STX PDECSN,Y, mirrored at :1041-1045. So GOVER>0 selects the G-block. Corroborated both sides: P1JOY (:7247) reads WCPIAB 'SELECT HALF OF MUX' (real hardware joystick); G1JOY/G2JOY (:601-616) sit in the attract region beside ATTRCT CLR GOVER (:712). G-blocks are the ATTRACT-MODE SELF-PLAYING DEMO; P-blocks are real play. That explains BOTH differences at once, including why slot 8 (SNPTREF, 'PLAYER ABORTED FADING IN') is silent in a demo nobody can abort. IMPORTANT NUANCE: exactly two G-blocks exist against seven P-blocks (P1DEC..P7DEC), so the G/P duality is KNIGHTS-ONLY and the P prefix on P3DEC-P7DEC does not mean 'real play'.
      USER RULINGS (2026-08-02, both taken with the census attached): (a) RE-ANCHOR the two player wing cues to P1DEC :5552 - the measurement FLIPPED the prior argument, because :5544 is now known to be the attract-demo binding and a cue fired by a human citing the demo block is misleading even though the bytes are identical; (b) record the distinction as PROSE plus a ROM-citation guard, NOT as a structured family field on CUE_SOURCES (that was costed and declined as pushing the story past 3 points).
      NOT MEASURED BY SM, handed over as an open question: the port has a 1602-line core/demo.ts that emits its own cue stream, and SNPTREF is modelled by NO cue at all (it appears only inside verbatim strings). So there is no CURRENT audible G/P divergence - but whether demo.ts's cue stream should cite the G-family is a real question this story does not close. TEA should decide whether it is in scope or gets filed.
