    title: 'framesFor edge cases: an odd token count is silently dropped, and an invention cue reports the wrong bake error'
    description: 'Two edge cases in the jt5-6 derivation in plugins/joust/src/shell/audio-manifest.ts, both currently unreachable but both real. (1) framesInRow loops `for (let i = 0; i + 1 < pairs.length; i += 2)`, so a row with an ODD token count — a sound code with no duration operand — has its tail SILENTLY dropped and the cue window comes out short with no error. It is defended today only INDIRECTLY: every defining row is re-opened byte-exact by tests/audio-rom-citations.test.ts and every continuation row by tests/audio-transporter-split.test.ts, so a malformed row cannot match the vendored file. The defence is a different mechanism from the failure, which is why it is worth closing directly — throw on an odd count. (2) framesFor opens `if (source.kind !== rom) return 0` (:525), so an `invention` cue gets FRAME_DURATIONS 0; bake-samples.mjs:310-312 then tests `if (!(frames > 0))` and throws `no FRAME_DURATIONS entry` — but there IS an entry, it is 0 because the cue has no ROM table to size it. All 18 cues are kind:rom today so neither fires, but the invention arm exists precisely so a later story can use it, and that story hits a misleading error. Found by jt5-6 Reviewer.'
