id: jt5
type: epic
title: Joust audio — the sound subsystem joust shipped without
description: "joust shipped silent, and this epic is the record of the sound subsystem it lacked. THE SEAM AND THE SAMPLES HAVE BOTH LANDED: jt5-1 built src/core/events.ts, src/shell/audio.ts and src/shell/audio-dispatch.ts, and jt5-2 synthesised one .wav per manifest entry and staged them under the assets bucket's joust/sfx/ prefix, curling a 200 for each (2026-08-01). What remains in this epic is per-cue fidelity against the machine, not wiring. Unlike centipede, joust carried no in-source note deferring audio, so this epic is also the record that the gap was known before it was closed. AMENDED 2026-07-31 AFTER THE MONOREPO MIGRATION: this epic was written when joust was the fleet's outlier for consuming NOTHING from @arcade/shared, and its first story's job was to rule on whether joust adopts the shared engine or stays standalone. The 2026-07-30 collapse ANSWERS that question by dissolving it — there is no package boundary left. src/shared/ is in-tree, reached as @shared/audio through an alias declared in vite.config.ts, vitest.config.ts and tsconfig.json; there is no pin, no git-URL dependency and no version-bump ceremony. Adopting the shared engine is now the default and costs an import line. The house pattern the three sibling games share still stands: a SOUNDS manifest mapping logical name to baked filename, a CHANNELS map giving each cue its own voice-stealing channel, a base URL under arcade-assets.slabgorb.com, a pure core/events.ts union the sim emits as DATA (never callbacks, so the core stays deterministic), and a shell/audio-dispatch.ts switch with a never exhaustiveness guard. Joust is a Williams machine, not an Atari one, so the sound ground truth is a different quarry from the five vector games — establishing what JOUSTRV4.SRC and its sound board actually provide is the first story's job, not an assumption to inherit. THE ACCEPTANCE TEST FOR ANY ASSET STORY IN THIS EPIC IS A LIVE 200, NOT A GREEN VITEST: the shared engine degrades silently at every failure path by design, so a 404 is indistinguishable from working code, and there is no automated upload path for the arcade-assets bucket."
