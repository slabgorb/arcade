      - "The SCRHUN/SCRTEN tens-BACKWARDS layout is transcribed and pinned by test (a value crossing the tens/hundreds boundary lands in the ROM's byte order); the DVALUE ladder drives kill values; claims entries for the layout + the ladder; citations suite green."
      - "Two players accumulate independently (a P1 kill never moves P2's score); the derived ptero-1000 and the SCRTEN quirk are pinned with their provenance flagged (pass-through, not re-derived)."
