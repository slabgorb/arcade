  - id: jt4-1
    title: "BCD scoring core — the game.ts session layer, per-player SCRHUN/SCRTEN registers, drain the kill/egg/ptero event stream"
    description: "The session layer above the sim, and the score registers it feeds. A new module game.ts holds GameState { players: [{score, lives, out}], gover, wave, sim } and a stepGame that WRAPS the existing stepDemo (joust/src/core/demo.ts) and DRAINS its already-emitted score events (joust.killScore, egg.eggScoreEvents, ptero.pteroScoreEvent) — today thrown away (the event log 'would otherwise grow unbounded; nothing drains it') — into per-player 6-digit BCD registers. The SCRHUN thousands/hundreds + SCRTEN tens/hundreds-BACKWARDS layout (JOUSTRV4.SRC:7340-7366) is transcribed and pinned; the DVALUE ladder (Bounder 500 / Hunter 750 / Shadow Lord 1500 / Ptero 1000 DERIVED, JOUSTRV4.SRC:5563-5577) is the value source; eggs 250-1000 + 500 air-catch are already event-carried (jt2-4/jt3). TWO INDEPENDENT LEDGERS from this first story (the ROM co-op shape). Closes the accumulation seeds (demo.ts event-log drain, egg.ts/dissolve.ts 'BCD scoring is jt4'); corrects the 'scoring DISPLAY is jt4' comments to 'accumulation jt4 / display jt5' (no glyph render here — dev-overlay is jt4-5, authentic display is jt5). Every constant radix-cited + claims entry; the purity guard sweeps game.ts."
    points: 3
