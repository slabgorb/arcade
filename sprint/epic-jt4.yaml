id: jt4
type: epic
title: "Joust — game structure (the game loop): 2P co-op ledgers, all six wave types, BCD scoring, extra men, game-over"
description: "Fourth epic of the joust clone — the roadmap's 'Game structure' slice, CUT to its mechanics half (DESIGN: docs/superpowers/specs/2026-07-22-joust-jt4-epic-design.md at the orchestrator, executing joust/docs/superpowers/specs/2026-07-19-joust-clone-design.md roadmap row jt4). GROUND TRUTH: joust/docs/rom-study/ (machine-gated by the citations suite) — cite the dossier, do not re-derive it; new transcriptions add fully-qualified FILE:LINE claims (the jt1-8 lesson: never bare :N). USER RULING THIS EPIC (2026-07-22, binding): THE SCOPE SPLITS. The roadmap row bundled game-session MECHANICS (scoring registers, lives, game-over, the 2P wave-type behaviours) with a text-engine-dependent PRESENTATION layer (authentic score DISPLAY, HSTD tables, initials entry, attract lessons). jt4 is the MECHANICS HALF ONLY — everything provable headlessly against a seeded sim. A NEW jt5 (presentation) carries the MESSAGE.SRC/PHRASE.SRC text engine + score display + HSTD/initials + attract lessons; SOUND moves to jt6, SHIP to jt7 (the master roadmap table is amended in the design spec). All jt4/jt5 source is vendored (MESSAGE.SRC, PHRASE.SRC, TB12REV3.SRC, ATT.SRC, EQU.SRC, JOUSTRV4.SRC under reference/williams-source/joust/) — the split is a sequencing decision, not a ground-truth gap. ARCHITECT RULINGS: (1) A SESSION LAYER above the sim, born in the first story — one new module game.ts holds GameState { players: [{score, lives, out}], gover, wave, sim } and a stepGame that WRAPS the existing stepDemo and DRAINS its already-emitted score events (joust.killScore, egg.eggScoreEvents, ptero.pteroScoreEvent) into the registers; the pure sim (frame.ts/demo.ts) is NOT rewritten; no second stepping path (the jt2-1 one-sim seam); the purity guard sweeps game.ts. (2) TWO KNIGHTS = TWO INDEPENDENT LEDGERS — ROM co-op gives each player their OWN score and OWN lives; a dead player waits, the game ends when both are out; GameState.players is that 1-2 element array from story one, not a bolt-on. (3) RV4 is the behaviour target — the PLYG1/2 polarity + the PATC11 GAME START GOOF cleanup (JOUSTRV4.SRC:6282-6284) are red-label behaviour; any displaced instruction preserved as a ******** comment. (4) DISPLAY STAYS jt5, ACCUMULATION IS jt4 — the several code comments reading 'scoring display is jt4' are corrected to 'accumulation jt4 / display jt5' (jt4-1); the jt4 demo shows score/lives via a DEV-OVERLAY only, never a glyph stub. (5) CAVEATED VALUES PASS THROUGH — the SCRTEN tens/hundreds-BACKWARDS quirk and the DERIVED ptero-1000 DVALUE (open-questions §4) are accumulated faithfully with provenance flagged, not 'corrected'. SEEDS CARRIED (grepped, all binding): score ACCUMULATION owed (demo.ts event-log drain, egg.ts/dissolve.ts 'BCD scoring is jt4', the joust/egg/collision test contracts); EXTRA MEN owed (joust-collision contract 'display + extra men are jt4'); the 50-FOR-DYING credit (JOUSTRV4.SRC:4730-4732, deferred by jt2); DBAIT BAITER REMOVAL owed (demo.ts 'nbait settles at MAX_BAITERS and the swarm holds'; the baiter dissolve tags itself so the jt4 count can settle on entry); the EGG + GLADIATOR wave-type BEHAVIOURS explicitly deferred here by the jt3 design ('gladiator/egg behaviours stay jt4'). Radix discipline throughout (Motorola: bare DECIMAL, $ hex, @ octal, % binary); every transcribed constant carries a radix-cited comment + claims entry. Demo at epic end: two knights playing a FULL loop (co-op spawn -> waves -> death -> extra man -> game-over) on 5279 with a dev-overlay readout, screenshot with port-ownership proof (strictPort alone is porous — td1-1; a screenshot predating the code it demos misrepresents the renderer — td1-3). NOTE: jt2-8 (prose corrections chore) is a jt2 leftover in backlog, not jt4's concern."
priority: p1
