  - id: jt4-2
    title: "Extra men — NSHIP starting lives, the REPLAY x16 threshold re-armed per award, the 50-for-dying credit"
    description: "Per-player lives and the extra-man award. NSHIP seeds the starting life count (default 5 — the free-play clone's kept CMOS adjustment, TB12REV3.SRC:134-151 / EQU.SRC:110-127); a mount death decrements that player's OWN count (both-players-out -> game-over is jt4-4's GOVER). The REPLAY extra-man threshold (@20,000 — the x16 CMOS nibble, JOUSTRV4.SRC:915-928) is checked as score accrues and RE-ARMED after each award (JOUSTRV4.SRC:7382-7411) so the next man lands at the next multiple — proven across TWO awards. The dying-player 50-point credit (JOUSTRV4.SRC:4730-4732 — deferred by jt2) is emitted here as the death is booked and accrues into jt4-1's register (SCRTEN caveat carried). Radix-cited + claims entries."
    points: 2
    priority: p1
    status: backlog
    repos: joust
    workflow: tdd
    acceptance_criteria:
      - "Each player starts with NSHIP lives (default 5, cited to the kept free-play adjustment); a mount death decrements that player's own count only; claims entry."
      - "The REPLAY extra-man award fires at the x16 threshold (@20,000) and RE-ARMS after each award so a second man lands at the next multiple; proven by test across two awards; cited."
      - "The dying-player 50-point credit is emitted as the death is booked and accrues into the jt4-1 register (SCRTEN caveat carried); cited."
      - "Determinism: a seeded run crossing two extra-man thresholds replays bit-for-bit; purity guard + citations green."
  - id: jt4-3
    title: "Egg + gladiator wave types + the 2P bounties — complete all six types, co-op/survival/gladiator 3000, the PLYG1/2 polarity trap"
    description: "Completes 'all six wave types' and pays the co-op scoring the dispatch skeleton has been routing for free. jt2-5 landed the 6-entry WJSRTB (nop/intro/coop/gladiator/egg/ptero, JOUSTRV4.SRC:2586-2591) with the DEGRADE laws (co-op->survival solo, JOUSTRV4.SRC:2628-2631; gladiator no-ops solo, JOUSTRV4.SRC:2697-2700); jt3-4 made only the PTERO type live. This story lands the remaining two type BEHAVIOURS — the EGG wave spawns its wave as eggs, the GLADIATOR wave arms PvP — and the three 2P BOUNTIES: co-op 3000 each VOIDED by a partner-kill, survival 3000 for a DEATHLESS wave, gladiator 3000 to the FIRST partner-killer (JOUSTRV4.SRC:2642-2728,4691-4698). THE POLARITY TRAP: the same two PLYG1/2 flag bytes INVERT meaning between co-op and gladiator (JOUSTRV4.SRC:2634-2635 vs JOUSTRV4.SRC:2703-2705); the 'GAME START GOOF' PATC11 cleans up the boot state (JOUSTRV4.SRC:6282-6284) — transcribe BOTH polarities + the cleanup, pin each by test, preserve any displaced instruction as a ******** comment (RV4 discipline). Bounties accrue into jt4-1's registers. Radix-cited + claims entries."
    points: 3
    priority: p1
    status: backlog
    repos: joust
    workflow: tdd
    acceptance_criteria:
      - "The egg wave type spawns its wave as eggs and the gladiator wave arms PvP through jt2-5's WJSRTB dispatch (the ptero type from jt3-4 unchanged); all six types now carry a behaviour or a cited no-op; claims entries."
      - "The three bounties pay per the ROM: co-op 3000 each and VOIDED by a partner-kill, survival 3000 only for a deathless wave, gladiator 3000 to the FIRST partner-killer; each cited; each proven by a test that also proves the non-award path."
      - "The PLYG1/2 polarity inversion between co-op and gladiator is transcribed with BOTH meanings + the PATC11 boot cleanup; a solo game degrades per the cited laws (co-op->survival, gladiator no-op); displaced instructions preserved as ******** comments."
      - "Determinism: seeded co-op-bonus, partner-kill-void, survival, and gladiator-bounty runs each replay bit-for-bit; purity guard + citations green."
  - id: jt4-4
    title: "Game-over + the loop + DBAIT — GOVER tri-state, per-player out, stepGame consolidation, baiter removal + nbait settle"
    description: "The session layer closes the loop. GOVER goes tri-state — 0 = over, negative = running, positive $7F = attract simulation (JOUSTRV4.SRC:232-233,712,1015); a player with no lives is OUT and waits, the game reaches over only when EVERY player is out. The wave-to-wave progression stepDemo already runs is CONSOLIDATED under stepGame so score/lives/gover ride the same single sim step (the jt2-1 one-sim seam — no divergent loop). DBAIT BAITER REMOVAL (deferred by jt3, demo.ts): a baiter that dissolves is REMOVED and the nbait count SETTLES on entry so the max-3 cap (PCHASE=-1, JOUSTRV4.SRC:2108-2113) frees a slot instead of the swarm holding forever; the baiter dissolve already tags itself for this count. Radix-cited + claims entries."
    points: 2
    priority: p1
    status: backlog
    repos: joust
    workflow: tdd
    acceptance_criteria:
      - "GOVER is tri-state per the ROM (0 over / negative running / $7F attract-sim); a player at zero lives is out and waits; the game reaches over only when all players are out; cited + claims entry; proven at 1P and 2P."
      - "The wave-to-wave loop runs under stepGame with score/lives/gover on the single sim step (no second stepping path); a seeded multi-wave game replays bit-for-bit."
      - "DBAIT baiter removal frees a slot: a dissolved baiter is removed and nbait settles so a new baiter can spawn under the max-3 cap; proven by a test that fills the cap, kills one, and spawns again; cited."
      - "Determinism + purity guard + citations green across a full seeded game to game-over."
