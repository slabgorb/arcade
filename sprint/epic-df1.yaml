id: df1
type: epic
title: 'Defender — ROM source study + scaffold + fidelity harness (phase 1): the ground-truth dossier every later df* story cites'
description: "First Defender epic and phase 1 of the framebuffer-raster cabinet build (docs/playbooks/next-sprite-game.md, graphics phase in its Joust image-transcription form — no tile/sprite ROMs, no colour PROM, all graphics inline FCB tables). Produces plugins/defender/docs/rom-study/ — the single-sided ground-truth dossier (brief/glossary/subsystems/open-questions + claims/*.json) — plus the boot-stable four-file scaffold and the citation gate + src/core purity test, folded into one epic as pm1/ml1 did. Source ALREADY vendored: reference/original-source/defender/ @ historicalsource/defender 3fae9d3 (docs/reference-sources.md) — twelve Williams RASM .SRC files, Eugene Jarvis et al., INFO.SRC:11 DR J. 1/21/81. The 2026-08-13 preflight study established: the tree is the RED (cocktail) software = MAME parent set defender, identified three ways (unconditional runtime screen-flip PHR6.SRC:15 WDATA $38/$39 + DEFA7.SRC:1190-1193 COCKTAIL? + inverted IRQ DEFA7.SRC:2006-2008; CKBYT checksums present ruling out WHITE; CRC-for-CRC match of ~/roms/defender.zip against ROM_START(defender) williams.cpp:1985-2007 = Red label parent williams.cpp:3968). Banked ROM window at $C000 selected via MAPC EQU $D000 (PHR6.SRC:11): block 1 = AMODE1 attract/hall-of-fame/scanner, block 2 = MESS0 messages/charset, block 3 = ROMC0/ROMC8 diagnostics, block 7 = BLK71 terrain + wave table, resident $D000-$FFFF = DEFA7/DEFB6/ROMF8/SAMEXAP7. Timebase nominal 60 Hz (author 16 MSEC tick DEFA7.SRC:9, NAPP 60 = 1 second AMODE1.SRC:311) vs exact 60.09615 Hz (MAME set_raw williams.cpp:1556, 8e6/(512x260)) recorded as SEPARATE numbers; mainloop gated on EXEC0 LDA TIMER spin DEFA7.SRC:3048-3050, TIMER incremented once per frame by the sub-128 beam arm of the IRQ. Dialect Williams RASM: $ hex, bare decimal, no octal/binary/local labels, !> and !. expression operators, MACRO/ENDM with backslash params, no conditional assembly. Sound-board source ABSENT (separate M6808 running defend.snd — same gap as joust; ROMF8/ROMC0/ROMC8 are main-CPU control/diag ROMs, NOT sound); BRUTSUM2.SRC is a never-shipped dev checkbyte tool. Citation vocabulary fixed: defender/<FILE>.SRC:<line> into the vendored tree; nothing downstream introduces a src/core constant without a claim gated by citations.test.ts. MAME williams.cpp/williams_m.cpp wins ONLY on board facts the source never states — cited in prose, never copied (GPL); mwenge/defender annotated reconstruction is tertiary, never a citation. Design + full cabinet roadmap: docs/superpowers/specs/2026-08-13-defender-cabinet-roadmap-and-df1-design.md. Sibling assets: millipede docs/rom-study layout + hardened tools/audit/check-citations.mjs (ml1-1 review hardening), joust four-file scaffold. OUT OF SCOPE: framebuffer render + transcription (df2), ship/scheduler core (df3), menagerie (df4), game structure + scanner (df5), sound (df6), phase machine/attract/HUD (df7), hardening (df8+). ACCESSIBILITY STANDING RULE recorded for df4/df7: the original's smart-bomb/death full-screen flashes become freeze/fade — owner photosensitivity, the one exception to ROM-always-wins."
