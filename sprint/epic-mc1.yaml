    workflow: tdd
    acceptance_criteria:
      - "The four-file plugin shape exists under plugins/missile-command/, copied and adapted from plugins/joust/: index.html (Vite entry referencing /src/main.ts), plugin.ts (GameMeta per design — id 'missile-command', title 'MISSILE COMMAND', year 1980, order 7), package.json ({name,version,private}), tsconfig.json (extends ../../tsconfig.json). The orchestrator suite's 'adding a game' invariants pass for the new directory."
      - "All THREE registrations are done and no more: 'missile-command' appended to games in justfile and to GAMES in vitest.config.ts, and src/host/registry.ts regenerated via 'npm run gen:registry' (committed, NOT hand-edited). scripts/build-app.mjs and the deploy workflow read plugins/ directly and need no edit."
      - "The game boots on the one dev server: http://127.0.0.1:5270/missile-command/ serves the plugin's own index.html and its /src/main.ts mounts a canvas. Proven DISTINCT from the lobby fallback — the check compares /missile-command/ against a nonsense control path (e.g. /banana/) and asserts the responses DIFFER, not merely that both are 200."
      - "The core/shell boundary is present and enforced: src/core/ and src/shell/ exist, and a purity/core-boundary test (copied from joust's tests/helpers/purity-scanner.ts) scans src/core/ source text and passes on the skeleton's clean core (no Date, no Math.random, no canvas in core)."
      - "Gates green: 'npx vitest run --project missile-command' passes, 'npm run lint' is clean repo-wide, and 'npm run test:orchestrator' passes (the new game's wiring invariants are satisfied)."
