id: mc1
type: epic
title: 'Missile Command — plugin skeleton: boot the cabinet on REV-01 ground truth'
description: |-
  First Missile Command epic. Stands up the eighth game as a bootable plugin, faithful to REV-01 Atari source (codename WW3), on a SKELETON-FIRST kickoff (owner decision 2026-08-05): get the cabinet on screen and the wiring proven, back-fill the full citation dossier in a follow-on epic.

  GROUND TRUTH: plugins/missile-command/docs/rom-study/brief.md (five preflight answers, cited to the vendored source at plugins/missile-command/reference/source/, historicalsource @ bab468c). DESIGN: plugins/missile-command/docs/design/mc1-skeleton.md (core/shell decomposition + skeleton acceptance). PROVENANCE + disk-name->module map: plugins/missile-command/reference/PROVENANCE.md.

  Missile Command is a RASTER game (6502 + POKEY, framebuffer video, trackball + 3 fire buttons, 8-colour palette, ~61.0076 Hz) — architecturally the joust/centipede shape. REUSE-FIRST: copy plugins/joust/, strip to the design's core/shell tables; no new src/shared extraction. The core/shell purity boundary is the load-bearing rule and is enforced by a purity scanner copied from joust.

  RADIX DISCIPLINE (the trap): W3COMN.MAC sets .RADIX 16 once and every module inherits it — bare numbers are HEX, a trailing period means DECIMAL (MAXMIS=10. vs CITY2H=0B4). Every constant hardcoded in the skeleton must cite brief.md, which cites source: no magic number faithful to nothing, even under skeleton-first.

  DEFERRED to epic mc2 (dossier back-fill): TDD citation checker, subsystems.md/glossary.md/claims/*.json, and open questions O-1 (decode A35820.1C binary object) and O-2 (exact sim tick from W3INT). Skeleton needs no enemies/scoring/waves — those are gameplay epics after mc1.
priority: p2
status: backlog
repos: arcade
