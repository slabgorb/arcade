  - id: mc1-1
    title: Scaffold the missile-command plugin and boot it in the cabinet
    description: |-
      Stand up plugins/missile-command/ as the eighth game and prove it boots in the cabinet. REUSE-FIRST: copy plugins/joust/ (the newest raster game) as the template and strip it to a minimal bootable shell — do NOT hand-type the four files (a missing one fails late, not at the step you were on). Design: plugins/missile-command/docs/design/mc1-skeleton.md. Provenance/ground-truth already staged by the Architect under plugins/missile-command/{reference,docs}.

      SCOPE: scaffold + registration + a black canvas that boots. No field, cursor, or gameplay yet (those are mc1-2..mc1-4). What this story buys is the wiring: the four-file plugin shape, the three registrations, a regenerated registry, and the core/shell purity boundary in place so every later story writes against a clean skeleton.

      WATCH THE SERVE TRAP (tests/canonical-serve.test.mjs): the one dev server answers 200 to EVERYTHING via the lobby SPA fallback, so an all-200 sweep proves nothing. Any boot check must compare /missile-command/ against a nonsense control path and assert they DIFFER.

      plugin.ts meta per design: id 'missile-command', title 'MISSILE COMMAND', year 1980, order 7, listed true, showcase false, version from package.json.
    points: 3
    priority: p3
    status: done
    started: '2026-08-05'
