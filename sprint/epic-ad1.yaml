  - id: ad1-7
    title: battlezone's demoInput autopilot has never been checked against the 1980 ROM's own attract choreography
    description: "Raised at ad1-2 setup by SM as an open claim, left open by Dev, and confirmed as an open QUESTION by the Reviewer (2026-08-01). Read the framing carefully: NOBODY HAS MEASURED A DIVERGENCE. No fidelity defect is claimed here. What is claimed is that a gap has never been checked, and that ad1-2 raised the cost of leaving it unchecked. THE SITUATION: battlezone's attract demo is driven by `demoInput` in plugins/battlezone/src/core/sim.ts — a lazy patrol arc plus occasional pot-shots, a pure function of the demo clock (leftTread/rightTread from sin(t*0.7) and sin(t*0.9+1.3), fire when sin(t*1.7) > 0.93). It arrived with bz1-10, whose archived session (sprint/archive/bz1-10-session.md:314) describes it as a \"deterministic demo autopilot (pure function of the demo clock)\" — i.e. it was authored to BE deterministic and input-proof, which it verifiably is, and not authored as a port of anything. Those trigonometric constants cite no ROM routine. Every other number in this game was pinned to primary source by epic bz3 and the battlezone audit; this one was invented, reasonably, to fill a hole. WHY IT MATTERS MORE NOW: ad1-2 put this demo on the arcade's front page. It is no longer a screen a visitor reaches by navigating to battlezone and waiting — it is what the lobby shows for twenty seconds out of every sixty, and for many visitors it will be the only battlezone they ever watch. An invented attract choreography is a much louder claim about the cabinet than it was a day ago. THE WORK: establish whether the 1980 ROM drives its attract demo at all, and if so from what — a canned input table, a script, the live AI, or a seeded replay — then either cite demoInput to that mechanism or record, with the citation, that the ROM's approach is unportable and demoInput is a deliberate substitute. A recorded and cited \"we chose differently, here is why\" is a perfectly good outcome; an uncited invention that reads like a port is not. Consult docs/audit and the vendored battlezone ROM source (see docs/reference-sources.md); check the battlezone audit's unfiled ROM follow-ups before assuming this is untouched ground. Beware the recorded trap in this repo: the citation gate re-opens the QUOTED LINE only, so cite the MECHANISM a derived constant rests on, not just a line that happens to contain a number."
    points: 3
    priority: p3
    status: backlog
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - Established from primary source whether and how the 1980 ROM drives its attract demo, cited to the routine (the mechanism, not merely a line containing a number)
      - demoInput in plugins/battlezone/src/core/sim.ts either cites that mechanism, or carries a recorded deliberate-substitute note explaining what the ROM does and why it was not ported
      - "No fidelity defect is assumed: if the ROM's choreography matches what demoInput already does, that is a valid outcome and the citation is the deliverable"
    type: chore
