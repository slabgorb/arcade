  - id: ad1-4
    title: joust attract simulation — wire GOVER_ATTRACT (0x7f), the ROM's game-SIMULATION mode, then opt in
    description: "MEASURED QUARRY, handed over by jt5-23 (2026-08-02). This story had a title and an empty body; everything below was measured against reference/williams-source/joust/JOUSTRV4.SRC and is offered as CLAIMS TO VERIFY, not as settled design. THE ENTRY POINT. GAMSIM (:232), under the ROM's header '* GAME SIMULATION OR INSTRUCTIONAL PAGE' (:230), does LDA #$7F 'GAME SIMULATION MODE' then STA GOVER (:233) — so the title's 0x7f is CORRECT. It then sets NLIVES to 3 (:234-235) and NPLYRS so the simulation runs TWO players (:236). An attract demo that runs one knight is not what the ROM does. HOW THE MODE REACHES BEHAVIOUR — this is the part jt5-23 established and it is the reason this story is cheaper than it looks. Each knight's process, at creation, picks its DECISION BLOCK from GOVER: JOUSTRV4.SRC:1025-1029 (mirrored :1041-1045) loads G1DEC, tests GOVER, and swaps to P1DEC when GOVER is not above zero, storing the winner into PDECSN ('PLAYER 1'S JOYSTICK'). So GOVER > 0 installs the G-blocks and everything downstream follows from that ONE field. WHAT THE G-BLOCKS CHANGE, exactly two things per knight: the joystick source (G1JOY/G2JOY at :615-626, which compute commands in software — STD CURJOY at :625, no panel read anywhere in the routine — under the ROM's own header '* GAME SIMULATION PLAYER COMMANDS' at :613) and the 8th sound slot, which is SNPTREF in the P rows and a bare 0 in the G rows because nobody can abort a demo's transporter. Everything else in the rows is identical. KNIGHTS ONLY: the ROM defines exactly two G-blocks (G1DEC :5542, G2DEC :5546) against seven P-blocks (P1DEC :5550 through P7DEC :5574). Buzzards and the pterodactyl have no G-variant — their decision field already holds AI (AUTOFF at P3DEC :5558, LINET/BOUNDR at P4DEC :5562), so enemies need no attract wiring at all. That is a large scope reduction. OTHER GOVER CONSUMERS worth reading before scoping: :3339 'ATTRACT MODE EGG SCORING?', :4717 and :4767 'ATTRACT MODE?', :1006 and :1065 'GAME SIMULATION?', :2072/:2125/:2215/:2235 'IS THE GAME OVER?'. GOVER is cleared at :632, :712 (ATTRCT) and :870. AN OPEN QUESTION, NOT A CLAIM (raised by jt5-23's Reviewer, unresolved): :645-650 holds an IFN DEBUG guard asserting a PDECSN pointer lies within [P1DEC, P7DEC], SWI-ing 'THIS IS NOT A DECISION BLOCK' otherwise. G1DEC/G2DEC sit BELOW P1DEC, so on its face a G-block pointer fails that range test. Nobody established whether that path is reachable while a G-block is installed — it is inside GAMOVR and debug-only. Verify before leaning on it either way; it may be a genuine ROM curiosity or simply unreachable. READ FIRST: the recorded G/P model lives in plugins/joust/src/shell/audio-manifest.ts (the jt5-23 block above the wing cues), and plugins/joust/tests/audio-decision-block-families.test.ts pins the selection site, the census and the corroborations with re-opening guards."
    points: 5
