  - id: ad1-6
    title: red-baron's tile promises Mouse and Click controls that were never implemented
    description: |-
      Same class as uf1-6 — a promise the docs make that the code never kept. Found during the monorepo migration (plan task 14, 2026-07-30) and verified against source, not inferred. plugins/red-baron/plugin.ts declares controls ['FLY — Mouse / Arrows', 'FIRE — Click / Space'], which the lobby renders verbatim on the game's tile. But plugins/red-baron/src/main.ts binds only keydown and keyup (arrows, WASD and Space); its single pointerdown listener is the audio unlock, not a control. So Mouse does not fly and Click does not fire — half of every advertised control does nothing. The text came into the manifest verbatim from the migration brief, which took it from red-baron's own docs, so the error predates the migration and was faithfully carried forward rather than introduced by it. This is latent rather than live because red-baron ships listed:false and showcase:false, so no tile is rendered today — but it becomes user-visible the moment red-baron is listed, which is a one-field change someone will make without re-reading the control strings. Decide the honest fix: either implement pointer flight and click-to-fire, or correct the manifest to describe the keyboard controls that actually exist. Correcting the text is the cheap option and is probably right, since nothing in the ROM work calls for a mouse. Check the other six manifests' control strings against their own main.ts bindings while here — this was found by accident, not by a sweep, so siblings are unaudited.

      PAIRED WITH ad1-5 (noted 2026-07-31): both stories edit the same twenty-line file, plugins/red-baron/plugin.ts — this one corrects the `controls` strings, ad1-5 flips `listed` and `showcase` once the attract demo exists. Do this one first and let ad1-5 be a flag flip, or do them together; two separate reviews of one manifest is waste. The 'lobby/src/core/registry.ts' this story class used to name no longer exists — the migration deleted it and generates src/host/registry.ts from the seven manifests.
    points: 1
