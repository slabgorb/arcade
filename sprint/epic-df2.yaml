id: df2
type: epic
title: 'Defender — framebuffer render + image-table transcription (phase 2): static pixels on screen before any physics'
description: "Second Defender epic and phase 3 of the framebuffer-raster cabinet build (docs/playbooks/next-sprite-game.md, graphics phase in its Joust image-transcription form — no tile/sprite ROMs, no colour PROM decode; all graphics are inline FCB/FDB tables in the vendored source). Produces the core/shell render seam (plugins/defender/src/core/framebuffer.ts pure index surface + src/shell/render.ts index->RGBA blit) and the GENERATED-data + independent-gate transcription of the palette, the MESS0 character set, the DEFB6/SAMEXAP7 object image tables and the BLK71 terrain — rendered as a STATIC still (cleared framebuffer, text, object gallery, planet surface). PIXELS, NOT PHYSICS: no ship, scheduler, enemies, scroll or input (those are df3/df4); transcribed object/terrain tables land INERT, drawn by a static proof harness only. Stands on df1 (DONE): the dossier at plugins/defender/docs/rom-study/ and the citation gate + src/core purity test at plugins/defender/tests/ — every constant df2 introduces re-opens under the df1-1 gate (no src/core value without a claims/*.json entry). Render facts from df1: visible raster 292x240 (MAME williams.cpp:1601, board fact prose-only), 16-entry colour RAM CRAM EQU $C000 (defender/PHR6.SRC:13) with the PCRAM RMB 16 pseudo-palette shadow (defender/PHR6.SRC:219) copied to CRAM each frame by the IRQ (DEFA7.SRC:1968-1994); pixels are 4-bit palette INDICES, two per byte, never RGB. Reuse-first: scripts/transcribe-pictures.mjs + plugins/joust/tests/pictures-gate.test.ts (generated-data + independent-reader gate PATTERN — the reader is re-derived because the RASM dialect differs from joust's MAC65: $hex/bare-decimal, !>/!. operators, no octal/binary/local labels, brief.md sec 2); @shared/view fitIntegerScale + letterbox; @shared/host-helpers mountCanvas; @shared/font conventions where the raster charset maps. THE ONE ARCHITECTURAL DECISION (df2-2): Defender is the SECOND Williams-framebuffer game to need a palette-byte->RGBA decode, so the CLAUDE.md 'extract on the second game' bar is exactly met — IF Defender's CRAM byte format is the same 3-3-2 (BBGGGRRR) joust's paletteToRgba already decodes; that IS a board fact, read from MAME in prose (williams.cpp palette init), never guessed — if it matches, extract paletteToRgba to @shared/ and re-point BOTH games; if it differs, keep local, do not force-share divergent hardware. Traps carried in (so no story re-discovers them): streams-are-not-rasters (record an encoding discriminant per block, refuse to raster a non-raster — joust COMCL5/ASH lesson); colours-are-never-invented (render shell scans clean of hard-coded colour hex; every colour is a transcribed palette entry by index); line-numbers-from-tool-output-only (centipede drift, why the gate exists); comment ROM refs as defender/<FILE>.SRC:<line> not TS file.ts:line. Design + full story rationale: docs/superpowers/specs/2026-08-14-defender-df2-framebuffer-transcription-design.md; roadmap parent: docs/superpowers/specs/2026-08-13-defender-cabinet-roadmap-and-df1-design.md sec 4 df2 (approx 18 pts). OUT OF SCOPE: ship/scheduler/world-wrap (df3), menagerie + collision + materialize/explode animation (df4), game structure + scanner (df5), sound (df6), phase machine/attract/HUD/showcase (df7). ACCESSIBILITY FORWARD-NOTE (binds df4/df7, recorded df1): the original's smart-bomb/death full-screen flashes become freeze/fade — owner photosensitivity, the one exception to ROM-always-wins; df2 renders no strobe."
