title: 'Joust — cabinet experience: start flow, HUD, landing physics, transporter cadence, lava shore, high-score UX'
description: 'Six player-reported cabinet defects, root-caused by Architect review 2026-08-12. Pattern: in five of six cases the correct ROM-cited machinery already exists in-tree (often tested) and is simply unwired. (1) 1P/2P choice never reaches the sim - createWaveSim hardcodes both mounts (sim.ts:1229-1236) while createGame only sizes ledgers (game.ts:318); orphan P2 mount cannot respawn, felt as one life. (2) Attract exits only on Digit1/Digit2 (main.ts:422-426,500-503) with no on-screen prompt - felt as keys dead / stuck in demo. (3) HUD is the jt-era dev bar fillText (main.ts:169-180); FONT35 + PLY1R sprite are already wired/atlas-packed but unused by it. (4) velXIndex survives land->ground->takeoff untouched (flight.ts:378-431); the ROM walking-speed ladder flyVel (JOUSTRV4.SRC:7163-7175) is transcribed at flight.ts:118-131 and read NOWHERE. (5) Wave entry is a one-frame batch insert (sim.ts:2261-2271) while the ROM serve-queue ServiceQueue (transporter.ts:155-202, NPSERV/LESERV JOUSTRV4.SRC:5615-5676) is implemented+tested+unwired - note spawnProceeds is the PLAYER path and is NOT part of this defect (corrected jt11-4); ptero stagger (sim.ts:2303-2334) is the proven template. (6) BRIDGE/BRIDG2 lava-shore fills (JOUSTRV4.SRC:1126-1127) never transcribed - invisible solid ground at x 0-54/240-300 y211; destruction state computed every wave (sim.ts:2249) but consumed only by the troll gate - groundOutcomeInState/bridgeGroundOutcome/backgroundActive (arena-state.ts:172-199) have zero production callers. High-score wiring itself verified CORRECT (write and lobby read both joust-high-scores via shared highScoreKey) - the felt bug is the commit gate needing 3 initials + FLAP (main.ts:483-488). SEQUENCING: jt11-4 and jt11-5 both edit sim.ts (disjoint regions) - do not run in parallel checkouts.'
priority: p1
status: backlog
repos: arcade
