    description: "Architect follow-up from df5-9's coordinate flags, ruled in docs/adr/0006-defender-terrain-world-coordinate-reconciliation.md and designed in docs/superpowers/specs/2026-08-18-defender-terrain-scroll-walk-design.md. VERIFIED ROM ground truth (BLK71.SRC draw path, not inferred): the scrolling terrain is a +/-1 walk, 1 bit per column (RFONR1/LFONR1 :435,:487; ADDR01/ADDL01 :307,:236), 2048 columns = the whole $10000 world at $20/column (1px = $20, BGINIT ADDD #$2610 over 304px, ANDB #$E0), so it repeats exactly ONCE per lap. ALTTBL (what decodeAltitudes reproduces) is WRITE-ONLY — referenced only at :70/:382/:397, never read; the scroll never uses it. The defect in composeFrame: it fills the 256-column lap from BGALT[0..255] = the first QUARTER of the world's profile at half the scroll's resolution, stretched across the lap. The port's 256-col period is CORRECT (2048 decimated 8:1 by the coherent $100/px df3 zoom-out) — do NOT change the period, and the earlier '$8000/twice per lap' framing was wrong. Fix: add a pure decodeScrollSurface(block, worldCols=WORLD_COLS) that walks all 2048 TDATA bits +/-1 per bit (MSB-first, base $E0) and samples to 256 at stride 8 (surface[k]=walk[k*8]); point composeFrame (and composeStaticFrame) at it; blitTerrain UNCHANGED. Does NOT touch the df3 $100/px world scale (world.ts/scanner/entities/collision — a separate un-storied deviation per ADR-0006). Q2 (<=1px terrain/entity jitter) is NOT part of this story — accepted as cosmetic-and-faithful."
