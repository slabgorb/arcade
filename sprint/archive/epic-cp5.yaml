id: cp5
type: epic
title: Centipede audio — the sound subsystem centipede shipped without
description: "centipede has no audio module at all: no src/shell/audio.ts, no core/events.ts event channel, no dispatch, and nothing under the arcade-assets centipede prefix. The game has been playable and silent since it shipped. The gap is deliberate and already named in the source — src/core/bonus.ts:32 records that CENTI4.MAC:1994-1995 (LDA I,17. / STA CHAN4, 'BONUS LIFE SOUND') is 'DEFERRED to cp5 with the rest of the audio, and deliberately not stubbed — an empty hook would be dead code pretending to be a seam', which is why this epic carries the id cp5. Three sibling games have already walked this path and are the reference, not a re-derivation: tempest, star-wars and asteroids each define a SOUNDS manifest (logical name to baked filename), a CHANNELS map giving each cue its own POKEY-style voice-stealing channel, a DEFAULT_BASE_URL under arcade-assets.slabgorb.com, a pure core/events.ts union the sim emits as DATA, and a shell/audio-dispatch.ts switch with a never exhaustiveness guard so adding an event kind without a cue is a compile error. All three consume the shared audio engine. POST-MIGRATION (2026-07-30): that engine is no longer a package — it is src/shared/audio.ts in this repo, imported as @shared/audio through an alias declared in vite.config.ts, vitest.config.ts and tsconfig.json. There is no subpath export to add, no pin to bump and no dist/ to build; centipede already imports @shared/rng, @shared/highscore, @shared/loop and @shared/name-entry the same way. THE ACCEPTANCE TEST FOR ANY ASSET STORY IN THIS EPIC IS A LIVE 200, NOT A GREEN VITEST. The shared engine degrades silently at every failure path by design — no WebAudio, blocked autoplay, failed fetch, undecodable sample all leave the game quiet and never throw — so a 404 is indistinguishable from working code. star-wars music was wired and silently absent in production for months for exactly this reason. There is no automated upload path for the arcade-assets bucket: CI deploys each app's dist only, so samples are placed by hand with wrangler r2 object put --remote and must be curl-verified."
priority: p2
status: done
repos: arcade
stories:
  - id: cp5-1
    title: Centipede audio seam — core event channel, shell dispatch and the SOUNDS manifest, no samples yet
    description: "The seam only — this story ships NO baked samples and NO R2 uploads, so it cannot be blocked by asset production. It builds the three pieces the three sibling games share, so every later cp5 story is a matter of naming a cue and baking a file. Piece one: src/core/events.ts, a discriminated union of the gameplay moments the sim already produces, emitted as DATA on the step result and never as callbacks, so the core stays pure and a fixed seed replays an identical event stream. Centipede's sim already computes every moment worth a cue — the player shot, a segment or mushroom hit, a segment reaching the bottom, the spider, flea and scorpion arriving and leaving, the player exploding, the wave clearing, and the bonus life whose sound src/core/bonus.ts:32 has been holding a place for since cp4-4. Piece two: src/shell/audio.ts with the SOUNDS manifest (logical name to filename) and the CHANNELS map giving each cue its own voice-stealing channel, pointed at the centipede prefix under arcade-assets.slabgorb.com. Piece three: src/shell/audio-dispatch.ts, the event-to-cue switch carrying a never exhaustiveness guard so a future event kind added without a cue is a COMPILE error, not a silent omission. centipede already imports rng, highscore, loop and name-entry from @shared; audio is one more import line — the 2026-07-30 monorepo collapse removed the package boundary, so there is no subpath to export, no version pin and no bump ceremony at all. The sustained cues matter for the design: the centipede's marching tick and the spider's presence are loops, not one-shots, so the channel map must express start and stop, not only play."
    points: 3
    priority: p2
    status: done
    started: '2026-07-31'
    repos: arcade
    workflow: tdd
    acceptance_criteria:
      - core/events.ts defines the event union and the sim emits it as data; the core purity scanner still passes, so no DOM, clock or randomness entered the core.
      - A fixed seed and input stream replay an identical event stream — the event channel is deterministic and a test pins that.
      - shell/audio-dispatch.ts maps every event kind to a cue and carries a never exhaustiveness guard, proven by a test or a deliberate compile failure that adding a kind without a cue is caught at build time.
      - The SOUNDS manifest and CHANNELS map cover every event kind, with sustained cues (the marching tick, the spider) expressed as start and stop rather than repeated one-shots.
      - The bonus-life cue named by core/bonus.ts:32 has a place in the manifest and its comment is updated to point at the seam that now exists rather than at a deferral.
      - No .wav is committed to the repo and no R2 upload is claimed by this story — the manifest names files that later stories bake, and the story says so plainly rather than implying the game now has sound.
    completed: '2026-08-01'
    review_findings: "Round 5 APPROVED. Production source frozen since 10912d9 (shasum c7dd3ba; git diff vs that commit empty). Verified on the merged tree: 991/991 centipede, 358/358 orchestrator, tsc clean. The AST rewrite of audio-dispatch.test.ts holds - the Reviewer extracted its toolkit into an independent harness and ran 20 self-authored mutants including the three shapes round 4 predicted would win; no false green survived verdict() as a whole. Findings: 0 Critical, 0 High, 2 Medium, 4 Low. M1-r5 (Medium): the guard-form checks resolve identifiers by SPELLING, so a local assertNever(x: unknown) or a shadowed 'const effect = 0 as never' is ACCEPTED while tsc confirms the exhaustiveness guarantee is then dead. Raised as a High, then withdrawn to Medium by measurement: verdict()'s separate missing-case check still REJECTS the real defect in both shapes, so the defect cannot ship - only the mechanism that catches it degrades from tsc to vitest. Relevant to cp5-2, which is invited to harmonise on assertNever and must write a new helper since none exists in centipede or src/shared. M2-r5 (Medium): extracting the switch into an object-literal or class method reds 8 tests loudly; the sibling if/else case is disclosed by Dev, this one is not. Lows: computed-member engine call invisible to the default-arm check; lang-review pass template claims 15 checks over 13 rows; a non-recursive copy of the core purity sweep; trulyAudible is a deliberate duplicate oracle. PROCESS: all four reviewer specialists were dispatched and none returned inside the review window, so rule enumeration is single-sourced to the Reviewer for a second round (checks 2, 5, 7, 12 unverified) and round 4's precondition that an approving round dispatch the rule-checker was WAIVED BY THE USER. CORRECTION ON RECORD: the Reviewer first wrote that the four specialists 'failed to spawn' and that the host could not fork. That was FALSE - all four were alive and later reported idle, and the fork errors came from a second dispatch exhausting capacity the originals were holding. The correct action was to SendMessage the running agents. See the CORRECTION block in sprint/archive/cp5-1-session.md."
    review_verdict: approved
  - id: cp5-2
    title: Wire the centipede audio seam into main.ts — the shell actually plays the stream
    description: "cp5-1 built the seam and deliberately stopped short of connecting it: createAudio and playEventSounds exist, are unit-tested against a recording fake, and are called by NOTHING — plugins/centipede/src/main.ts does not reference either. That was the right call for cp5-1 (wiring it then would have bought 14 guaranteed 404s, and this epic's rule is that a live 200 is the acceptance test for anything audible), but it means the epic's promise that later stories are 'a matter of naming a cue and baking a file' is not yet true. All four precedent games do reference playEventSounds/audio-dispatch from main.ts (tempest 3 sites, asteroids 3, battlezone 2, red-baron 2); centipede is the outlier. THE LATENT HAZARD, WRITTEN DOWN NOW RATHER THAN DISCOVERED LATER: playEventSounds THROWS on an event kind with no cue, and an uncaught throw inside requestAnimationFrame kills the frame loop and freezes the game. Today that is unreachable because nothing calls it. The moment main.ts calls it, a kind added to core/events.ts without a manifest entry stops being a compile error caught by CI and becomes a runtime freeze — the compile guard (EVENT_SOUND: Record<GameEventKind, SoundName> in shell/audio.ts) does hold, so this is a defence-in-depth question, not an open hole. Decide explicitly whether the dispatch should throw or degrade once it is on the hot path. Also in scope: the gesture gate (the shared engine is a no-op until the player's first interaction) and whether the attract screen — which the core keeps silent by design — needs any shell-side handling at all."
    points: 2
    priority: p2
    status: done
    started: '2026-08-01'
    repos: arcade
    workflow: tdd
    depends_on: cp5-1
    acceptance_criteria:
      - main.ts constructs the engine via createAudio() and calls playEventSounds(audio, state.events) once per stepped frame, in the render/step loop — not per event and not from the core.
      - 'A test proves the wiring is LIVE, not merely present: a fake engine injected at the seam records a cue for an ordinary played frame. A grep for the import is not the test.'
      - The throw-vs-degrade decision for an unmapped kind is made explicitly and recorded in the dispatch's own comment, because an uncaught throw inside requestAnimationFrame freezes the game.
      - "The gesture gate is respected: no AudioContext is constructed before the player's first interaction, and events that land before it are dropped without error."
      - Still no .wav is committed and none is uploaded — this story wires the plumbing and the cabinet stays silent until the asset stories land, verified by a live 200.
    completed: '2026-08-01'
    review_findings: "REJECTED round 1 — 1 HIGH, 6 MEDIUM, 4 LOW. Production code is sound; the claims around it are not. HIGH: plugins/centipede/README.md:20-24 still states the shell is 'not connected' and that main.ts 'calls neither createAudio nor playEventSounds', naming cp5-2 as future work — false as of 6c2bf1a, and in this epic the docs are the designated defence against silent audio (cp5-1 spent six tests on exactly this); no guard exists. MEDIUM: AC1's guard is blind to a one-step dispatch shift (CONFIRMED by mutation — dispatching the prior step's events passes 1012/1012) though its message claims per-step correspondence; three boot suites drive an unseeded createAttract(Date.now()) and assert emergent gameplay where every sibling suite pins a seed; four vi.mock wrappers type forwarded params 'never' instead of Parameters<typeof real.fn> (lang-review rule 8, and 10 repo files use the house idiom while only these 2 deviate); three stale or unsupported line citations introduced by this diff growing the files they point into (main.ts:183 is really :216; main.ts:84-86/:92-94 are really :108/:117; sim.ts:723 is cited as explaining a measurement no wave-clear pair appears in). LOW: unchecked catch cast to Error; asteroids:33-37 cited for a span that binds event.source; boot-shell listener map keyed by type only; dead sim() export. Rework routed to TEA — the fix surface is dominated by test files and the HIGH asks for a new guard test."
    review_verdict: approved
