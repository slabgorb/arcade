    description: |-
      joust/src/core/troll.ts implements the lava troll's grip — the PATCH1/2/3 escalation the 1982 source added in 'VERSION 3 SOFTWARE' — and NONE of it runs. beginGrip, stepGrip, escalateGrip, escapeScoreEvent and the TrollGrip type have ZERO references in src/ outside troll.ts itself; only trollSpawnable is live (demo.ts:961). demo.ts:420 admits it in its own words: '(stepGrip) is a pure core exercised directly; wiring the live grab off the LNDB7 …'. So a troll spawns, and can never actually grab anyone: the grace timer (LAVKLL 30*60, :6393), the +1/frame pull escalation to the $500 cap (:6374-6386), the -$0180 break-free threshold (:6616), the 50-point escape award (:6668) and the pull into the lava are all unreachable. This is the same disease as uf1-2 one layer down — a faithful, tested, cited pure core with no caller — and it BLOCKS uf1-10 (now jt9-12)'s LAVGRA half, which has nothing to feed until the grab is live. The missing piece is the GRAB itself: the LNDB7 hand-out/hand-grab detection that repoints the victim's gravity vector from ADDGRA to ADDLAV (PADGRA, :1651-1652). Found by TEA during uf1-2 test design while tracing which DYTBL rows had a live consumer chain.

