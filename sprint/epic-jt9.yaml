  - id: jt9-39
    title: ROW_DISPOSITION can lie in the direction that matters — a row wired in code but left 'no-consumer-yet' ships GREEN
    description: |-
      Filed by jt9-9's Reviewer, 2026-08-03, from a gap its TEA raised at RED and its own mutation battery confirmed.

      difficulty.ts's ROW_DISPOSITION is the 28-row inventory recording, for every DYTBL row, whether it is wired / dead-in-rom / no-consumer-yet. Two guards pin it and BOTH check only the table's self-consistency: difficulty-wiring.test.ts:781 pins the wired set by exact equality, and :847 pins the pending count. Neither asserts that a row marked no-consumer-yet genuinely HAS no consumer.

      So the failure that matters is unguarded: wire a row in code, forget the table, and the suite is green while the inventory says nobody reads it. That is exactly how uf1-2's frozen-dial defect stayed invisible for a year - the inventory is the thing future sweeps trust instead of re-deriving, and a stale entry is worse than none.

      jt9-9 hit this concretely. It wired EGGWT and EGGWT2 and had to move them by hand; nothing would have caught leaving them as no-consumer-yet. jt9-9 pins those two rows specifically, which does not generalise.

      ALSO IN SCOPE, cheaply: the `owner` strings drift. Both lava rows read owner uf1-10 until jt9-9 corrected them to jt9-11, an id the epic renumbering had already invalidated. An owner naming a story id that does not exist in the sprint is a dangling reference and should redden.

      ACCEPTANCE: a guard that, for each no-consumer-yet row, greps the joust core for a call passing that row NAME to waveValue/dyRow and fails if one exists; and for each wired row, fails if NO such call exists. Mutation-verify BOTH directions - flip a wired row to no-consumer-yet without touching code (must redden), and add a waveValue call for a pending row (must redden). Plus: every owner must match a story id present in the sprint YAML.
