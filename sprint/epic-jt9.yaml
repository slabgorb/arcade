      Both were filed out of jt5-23, both turn on the SAME distinction that story established - G1DEC/G2DEC are the attract-mode self-playing demo and P1DEC/P2DEC are real play, selected by GOVER at JOUSTRV4.SRC:1025-1029 - and reading the jt5-23 record in plugins/joust/src/shell/audio-manifest.ts is the prerequisite for both. One read, one ruling, one review. Points 2 + 1 -> 2.
