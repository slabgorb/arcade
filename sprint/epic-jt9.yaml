  - id: jt9-17
    title: 'Port OSTLR: the horizontal half of the bounce has no PBUMPX home and bounceHorizontal models a quarter of it'
    description: "jt5-4 applied the VERTICAL half of the ROM's non-killing bounce (OSTXUP :5163-5173 / OSTXDN :5175-5185, the +/-2 PBUMPY shove and the wrong-way velocity halving) and struck the HORIZONTAL half from its AC-1 as undeliverable. This story owns that half. WHAT THE ROM DOES: OSTLR (JOUSTRV4.SRC:5110-5159) runs after every vertical arm (OSTUTP falls into it at :5102, OSTXTP at :5109). It is gated on COLDX — 'BEQ OSTNLR' (:5112) means a dead-centre collision gets NO horizontal bounce at all — then splits on 'BPL OSTURT' (:5113) into two arms, OSTXLF (:5114) and OSTURT (:5137). Each arm reverses BOTH parties, each store guarded by BLE 1$ / BGE 1$ (:5115, :5126, :5138, :5148) so a bird already moving away is left alone, and each also writes PFACE (:5123-5124, :5134, :5146, :5156-5157) — the bounce turns the birds around as well as pushing them. WHY IT COULD NOT BE WIRED IN jt5-4, all measured: (1) bounceHorizontal in plugins/joust/src/core/joust.ts models ONE QUARTER of this — its 'selfVelX: -velX + 2, otherBumpX: velX >> 1' is the arithmetic of the RIGHTWARD-moving party only; the other party's is -v - 2 with PBUMPX = -(v + 2) >> 1, which the signature cannot express, and it returns nothing for PFACE. (2) EntityState carries velXIndex/velXFrac — the FLYX ladder, :7150-7158 — and no velX at all, and toJoustEntity hard-codes velX: 0 (demo.ts:748, :764) and bumpX: 0 (demo.ts:751, :767), so there is nothing to reverse. (3) drainBumpX (WRAPX :7270-7288) has ZERO production callers, so there is no PBUMPX home and no drain. So this is three pieces of work, not one: give EntityState a real horizontal velocity the FLYX ladder can round-trip, give it a PBUMPX field that drainBumpX actually drains each frame, then rewrite bounceHorizontal to return both parties' velocities AND both PFACE writes and call it from collisionPass's bounce fork (demo.ts:918-934) after the vertical arm, gated on the COLDX equivalent. EXPECT A DETERMINISM RE-BASELINE, for the same reason jt5