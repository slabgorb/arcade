  - id: jt9-18
    title: joust level flight flaps every falling wake — the ROM forces a glide wake after each level flap
    description: "Found by Dev during uf1-9's GREEN, confirmed by the Reviewer. joust's LEVEL flight flaps on every falling wake; the ROM cannot. BOFAST (JOUSTRV4.SRC:3931-3934) raises the flap bit AND sets PJOY to BOLEV2 — and BOLEV2 (:3936-3938) does nothing except point PJOY back at BOLEV1 and fall through into BOLEVA's CLRB. So the wake AFTER a level flap is a FORCED GLIDE, and the fastest a level-flying bounder can beat its wings is every other wake. The port's level law is a plain per-wake test — 'flap iff falling' in pursue()'s fallthrough, plugins/joust/src/core/enemy.ts — with no such state, so a bird that keeps falling flaps every single wake. WHY IT WAS LEFT: uf1-9 owned the eleven DYTBL cadence rows and this is not one of them (BOLEV2 is a state, not a row; the only row in that block is BOLETM, which uf1-9 wired as the DECISION interval and which is now correct). Building it inside uf1-9 would have widened that story's determinism blast radius for no AC. THE TWINS ARE B2LEV2 and the shadow's SHLEV/SHLEP equivalents — enumerate them before assuming this is one branch; uf1-9's census found the analogous decision-timer family had SIX sites where the story claimed four. EXPECT A RE-BASELINE: halving a level flyer's flap rate moves the jt2 seeded replays. uf1-9 re-baselined 21 pins by sweeping for each test's OWN precondition rather than nudging numbers, and two had to change SEED because the precondition had an empty solution set on the old one — read sprint/archive/uf1-9-session.md before starting."
