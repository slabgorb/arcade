    review_findings: "APPROVED, 4 findings, none blocking; 3 fixed in place during review, 1 filed. Every finding came from a mutation battery, not from re-reading the diff — the sweep is 27 repetitions of one correct edit and re-reading it finds nothing. (1) [LOW][DOC] the sweep left 12 '// Claims plumbing (the X pattern)' banners labelling code that is no longer claims plumbing, 5 of them directly above a ROM source-line reader (dissolve over jline(), difficulty and wave over line(), ptero and troll over the raw-line reader); the other 7 had become dangling pointers to files whose local pattern this story deleted. Fixed. (2) [LOW][DOC] 'all 921 committed claims' is 938; the conclusion was right and was re-verified independently (938/938 carry a source.file, 0 contain a path separator, so the helper's basename match and the old whole-string match are equivalent on the current registry), only the sum was wrong. Corrected in the session; the pushed commit message is immutable. Preflight then quoted 921 back verbatim, which is why it was worth correcting. (3) [LOW][RULE] lang-review check #18 'one concept, two helpers': transporter's claimCoversWithPrefix delegates the range match to the shared claimCovers while baiter's jt35Covers re-implemented it inline and so still carried a local basename — the same problem solved two ways in one commit. jt35Covers now delegates; its stricter /^JT35-[0-9]+$/ regex was preserved rather than widened to its sibling's startsWith, which would have admitted a hypothetical JT350-* namespace. Mutation-proved: narrowing rewritten to match nothing reddens 2 tests. (4) [MEDIUM][TEST] filed as jt9-31 — asClaim, the entire reason claims.ts calls itself the HARDENED loader, has zero coverage; gutting it to a passthrough leaves all 2499 tests green and it appears in only two other files, both in comments. Pre-existing from jt8-3, so not this story's defect, but jt9-2 took its dependents from 2 files to 29. Deviation accepted and verified rather