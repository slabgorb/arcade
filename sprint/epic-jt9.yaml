  - id: jt9-7
    title: CHANNELS is vestigial for arbitrated cues — three stories have now fed a map that routes nothing
    description: "joust CHANNELS maps every cue to a `prio-N` string, but since jt5-5 the shared engine arbitrates ALL of joust's cues on ONE voice by priority, so the channel decides nothing for them. THREE stories have now had to feed it: jt5-5's Dev and TEA both raised it, and jt5-6 added an eighteenth entry (player2Materialise: prio-70) that routes nothing, purely to satisfy the test `CHANNELS gives every SOUNDS entry a voice` in tests/audio-manifest.test.ts. It is kept because the shared engine still routes every UNARBITRATED name by channel and because a channel-per-priority is an honest description of which cues share a voice — but a reader takes it for live routing. Decide: delete joust's map and let the engine default, or keep it and make the test assert what it actually guarantees. Affects plugins/joust/src/shell/audio.ts (CHANNELS, and the header comment at :86-97 which still describes the fence in the present tense) and tests/audio-manifest.test.ts. NOTE the constraint before deleting: src/shared/audio.ts routes by channel for every name NOT in `priorities`, so removing the map is only safe while all 18 joust cues carry a priority."
    points: 2
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
  - id: jt9-8
    title: PTIMUP clears at BOTH wing transitions — a release restores flap lift and our flight.ts never does
    description: "A second thing jt5-3 found and could not take. The ROM clears PTIMUP at BOTH wing transitions — 'CLR PTIMUP,U  RE-INIT BUTTON PRESSES' at JOUSTRV4.SRC:6185 (the GOFLIP path, i.e. the RELEASE edge) and 'CLR PTIMUP,U' at :6219 (the GOFLAP/FLAST2 path, the PRESS edge). PTIMUP is the flap-lift budget, so on the real machine RELEASING the button restores your lift. Our plugins/joust/src/core/flight.ts tracks timeUp (tickTimeUp, called from stepPlayerEntity in frame.ts and stepEntity in enemy.ts) but NEVER resets it in flight — it only decays. The gameplay consequence is real and it is the one every Joust player knows: rapid tapping should climb better than holding, and on our port it does not, because only the press edge is modelled. Now that jt5-3 has landed a release-edge detector in the core, the edge this needs EXISTS — that was the blocker, and it is gone. WATCH THE SAME TRAP AS jt5-8: changing when timeUp resets moves every jt2 seeded-replay fingerprint, so budget for re-baselining the determinism digests. Do not land this and jt5-8 in the same commit; two fingerprint-moving changes at once make the re-baseline unreviewable. Filed from TEA's RED findings on jt5-3, 2026-08-01."
    points: 3
    priority: p3
    status: backlog
    repos: arcade
    workflow: tdd
  - id: jt9-9
    title: 'Hatch the kill-egg: an uncollected joust egg never matures, only a WAVE egg does'
