  - id: jt9-13
    title: posOffset decodes a high-bit POSOFF word as +255 instead of -1 — latent until anything draws EGGB2/EGGB3
    description: |-
      Filed by jt8-7's Reviewer. Latent today, guaranteed to bite jt8-14 (now jt9-25).

      THE BUG. `posOffset` (plugins/joust/src/core/demo.ts ~:1495) decodes a transcribed POSOFF word:
          return { xoff: rec.position >> 8, yoff: 256 - (rec.position & 0xff) }
      The ROM's POSOFF macro packs `XOFF*256 + 256-YOFF` (JOUSTI.SRC:12-13) and XOFF is SIGNED — a sprite whose art hangs to the LEFT of its hot spot carries a negative XOFF. `>> 8` on the stored unsigned word yields the raw high byte, so a negative XOFF comes back as its unsigned complement.

      MEASURED, on the two records jt8-7 added:
          EGGB2  position $FFF6  ->  posOffset gives xoff=255, yoff=10   | correct XOFF is  -1
          EGGB3  position $FEF5  ->  posOffset gives xoff=254, yoff=11   | correct XOFF is  -2
      The Y half is right in both cases. It is only the X that breaks, and only for a word with the high bit set.

      WHY IT IS LATENT AND NOT DEAD. Every one of the 44 pre-existing ENTITY_RECORDS has a position word in [237, 751] — no high bit, so no existing frame decodes wrongly. jt8-7 added the first two that do (EGGI rows 4 and 5, JOUSTI.SRC:2259-2260). They are unreachable right now: `posOffset` is only ever called from `entityOp`, and no call site can name them — the egg draw op is the literal `entityOp('EGGI', ...)`, and the other call sites pass mount/enemy/ptero/troll/dissolve frame names. So nothing is visibly broken today; it is a loaded chamber for the first story that draws a hatching egg, which is jt8-14 (now jt9-25).

      FIX: sign-extend the high byte before returning it, e.g. `const hi = rec.position >> 8; xoff: hi > 127 ? hi - 256 : hi`. Keep the raw word in the record — jt8-7 deliberately stored the unsigned 16-bit word because every other record does and there was no precedent for a signed representation (that decision was reviewed and accepted); the sign belongs in the DECODER, not the data.

      TEST NOTE: the natural guard is a decode test over every ENTITY_RECORD asserting `-128 <= xoff <= 127`, which reds on today's code for exactly the two new records and stays meaningful as more high-bit words arrive. jt8-7's Dev deviation flagged this hazard but named the wrong axis ("decodes these as Y-offsets must sign-extend"); the Y is fine, the X is not. That correction is recorded in jt8-7's Design Deviations under the Reviewer's stamp.
