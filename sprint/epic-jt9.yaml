  - id: jt9-38
    title: The egg wave deals TWELVE eggs and hatches WENEMY at a time — port the ROM's egg density (:2778-2822) and the NENEMY/WENEMY hatch gate (:3238-3242)
    description: |-
      Filed by jt9-9's Reviewer, 2026-08-03; RE-SCOPED AND RE-POINTED 3 -> 5 at setup on the user's ruling, 2026-08-03, after the filing's claims were measured. The ROM citations all verified; two of the filing's framing claims did not, and a third measurement showed the gate as filed would have shipped DORMANT. This description is the corrected one. The original filing text survives verbatim in sprint/archive/jt9-9-session.md (the "Filed, with story ids" section) and in this story's setup assessment.

      WHAT THE ROM DOES, in two coupled halves.

      (1) DENSITY. An egg wave deals TWELVE eggs, hardcoded, independent of the wave row. WAVEGG places six one-per-ledge over the six EGLEDG entries (LDA #6 / STA PWREGA,U "6 EGGS ON EACH LEDGE" at :2778-2779, the 5$ loop :2780-2804, EGLEDG's six FCB rows LEVEL0..LEVEL5 at :2910-2915), then re-primes the counter (LDA #6 / STA PWREGA,U "6 MORE EGGS TO GO", :2805-2806) and scatters six more across the 69-slot EGPTBL (the 6$ loop :2807-2822). Neither 6 is derived from anything - both are literal immediates.

      (2) THE GATE. After the wait expires (DEC PJOYT,U / BNE EGGLN2, :3236-3237) EGGLND does NOT hatch unconditionally. It re-primes the timer to 1 (INC PJOYT,U "SET = 1," :3238), reads LDA NENEMY / CMPA WENEMY / BHS EGGLN2 (:3239-3241) - "ENOUGH ENEMIES IN THIS WAVE?" - and goes back round the loop if the wave already holds its quota, incrementing NENEMY (:3242 "1 MORE ENEMY COMMING UP") only on the pass that actually hatches. WENEMY's own comment says what it is: "NUMBER OF ENEMIES TO HATCH AT A TIME" (:2759).

      WHY THE TWO HALVES ARE ONE STORY. WENEMY is meaningless unless more eggs exist than WENEMY. Measured across all eighteen egg waves (status 0x08, every fifth wave from 5), the port's spawnWaveEggs deals bounders+hunters+lords eggs and the ROM's WENEMY equals that same number in every one of them - every egg row carries exactly one non-zero ground nibble (waves 5/10 bounders 6/8, 15-55 hunters 6/8, 60-90 lords 6/8). Population is conserved across the port's cycle (a death removes one enemy and its egg's hatch restores one), so NENEMY tops out at the eggs dealt and the last egg hatches at NENEMY = WENEMY-1. NENEMY >= WENEMY is UNREACHABLE in the port as it stands. Building the gate alone would ship a correct guard that no seeded run can ever exercise. Twelve eggs against a quota of six is what makes it bite.

      THREE CORRECTIONS TO THE FILING, all measured at setup.

      CORRECTION 1 - WENEMY is 255 in every NON-EGG wave, so the gate is inert outside an egg wave. WNRM does LDA #255 / STA WENEMY "MAXIMIM ENEMIES FOR A NORMAL WAVE" (:1991-1992), and WNRM is reached on every wave advance (all four routes converge on it: :1937, :1952, :1955, :1957). Only the egg-wave setup at :2759 overwrites it. So the filing's headline sentence - "this port matures every settled egg the instant its timer runs out however crowded the arena is" - describes FAITHFUL behaviour for every normal wave, which is exactly where jt9-9's kill-eggs live. Do not gate a normal wave. The gate must resolve to 255 there.

      CORRECTION 2 - "WENEMY is already modelled in the port" is FALSE. grep -rn "WENEMY|wenemy" plugins/joust/src returns zero hits. What is modelled is the four decoded WAVTBL nibbles on WaveRow (wave.ts:36-42). The ROM DERIVES WENEMY from them by a three-way branch at :2744-2759: if WBOUND (byte0) is non-zero take its LOW nibble when that is non-zero (hunters), else its HIGH nibble (bounders); if byte0 is zero take WLORD's (byte1's) HIGH nibble (lords). That derivation is unwritten work, not a lookup.

      CORRECTION 3 - the filing's cited span :3239-3242 starts one line too late. :3238 INC PJOYT,U "SET = 1," is the line that makes the deferral a ONE-NAP re-poll: PJOYT is set to 1 before the population test, so the branch back to EGGLN2 costs exactly one PCNAP 12 (:3227) - twelve display frames, which is the port's own EGG_WAIT_NAP_FRAMES (demo.ts:620). Without :3238 the branch would DEC a zero timer to $FF and wait 255 more naps. The deferral is neither a fresh EGGWT wait nor a per-frame spin.

      WHAT VERIFIED EXACTLY AS FILED: every ROM line and comment above (:3236-3242, :2759, :2761), and "NENEMY has no port equivalent yet" - the only occurrence is assertWaveEndClean's activeEnemies parameter (wave.ts:389), which is a wave-boundary oracle, not a running count. "NOT A REGRESSION, and jt9-9 did not make it worse" also holds: before jt9-9 kill-eggs never matured at all.

      NENEMY'S REAL SEMANTICS, and why a DERIVED count is the right model. Six writers: INC at :460 (ATTEMY, attract mode only), INC at :2193 (WCREATE, "1 MORE ENEMY ON THE SCREEN"), INC at :3242 (the hatch commit, taken BEFORE VCUPROC creates the bird at :3248 - a reservation), DEC at :2965 (DEATH3, "DECREMENT NBR OF ENEMIES ON THE SCREEN"), DEC at :3080 (the player collected the egg while a remount bird was already inbound - conditional on LDY PDIST,X / BEQ EGGWAK), and CLR at :975 ("NO ENEMIES ARE ON THE SCREEN"). A count derived from the live process list satisfies all six by construction; the port hatches atomically so the :3242 reservation window is zero frames. Baiters are NOT counted - baiter creation INCs NBAIT (:2111) and never NENEMY - and the port matches that for free, because baiters and pterodactyls are kind:'ptero' processes (demo.ts:1331), not kind:'enemy'.

      PLACEMENT IS A DECISION, NOT A TRANSCRIPTION. The ROM spreads its twelve over six ledges plus a 69-slot EGPTBL; the port has four transporter pads (PADS, transporter.ts:127-132) and spawnWaveEggs currently places at PADS[i % PADS.length], so twelve eggs would stack three per pad. Record what the port does and why in a comment at the site; do not silently ship the stacking as if it were the ROM's layout.

      OPEN QUESTION, NOT RESOLVED AT SETUP: LDA #2 / STA PWHCH,U "NUMBER OF PRE-MATURE EGG HATCHINGS" (:2776-2777), consumed in CREGG at :2888-2894 (DEC PWHCH / BMI / VRAND / MUL / NEGA / ADDA PJOYT,Y) - two of the twelve eggs get a randomly-shortened hatch time. It is the third unmodelled piece of the same block. SM did NOT determine whether it belongs here. It consumes the RNG, so folding it in would move the re-baseline a second time; the recommendation is to FILE it rather than fold it, but that is TEA's call to make explicitly, in writing, either way.

      WATCH: with twelve eggs and a quota of six, the wave-clear gate (no enemies AND no eggs, demo.ts:1481-1484) has twice as many eggs to get through. Confirm a seeded egg wave still CLEARS rather than stalling - that is a termination property, not a fidelity one, and nothing currently asserts it.

      Expect a determinism re-baseline; land it as its own commit per this epic's standing rule, and re-FIND the moved fixtures by re-running the seeded sweeps rather than nudging them to whatever the new code prints.
