  - id: jt9-2
    title: 'Test-hygiene sweep: move the 27 joust suites carrying a local loadClaims/claimCovers onto tests/helpers/claims.ts (the line-ref half is disposed — uf1-9 did it; remainder is jt9-30)'
    description: |-
      One mechanical sweep, joust tests only, no production code. Filed out of jt8-3 as jt8-12; renumbered to jt9-2.

      SCOPE, as corrected by SM at setup on 2026-08-02 after measurement:

      (1) LIVE — the claims-loader sweep. 27 joust test files still carry their own pre-hardening loadClaims/claimCovers copy now that plugins/joust/tests/helpers/claims.ts exists; replace each with an import of the hardened loader. NOTE the story's original "27 legacy -source suites" was right about the count and wrong about the shape: only 24 are -source.test.ts. The other three are demo-jt5-16.test.ts, dossier-process-block.test.ts and pictures.test.ts, and a sweep that globs *-source.test.ts misses them. 27 files have loadClaims, 15 have claimCovers — import only what each file used. homing-source.test.ts is the refactor template (moved onto the helper during jt8-3, 78/78 green); steering-source.test.ts is a second worked example. Re-measure before starting:
        cd plugins/joust/tests && grep -rlE "(function|const) (loadClaims|claimCovers)" *.test.ts

      (2) DISPOSED — the comment-body line-ref half. The Reviewer's finding named audio-flap.test.ts:536 ("enemy.ts:540") and difficulty-wiring.test.ts:27 ("enemy.ts:115/118"). BOTH WERE ALREADY CONVERTED BY uf1-9 and the joust suite now contains ZERO enemy.ts:<number> refs. The :115/:118 -> :266/:273 numbers still visible at difficulty-wiring.test.ts:33-35 are a HISTORICAL NOTE EXPLAINING THAT REPAIR, not a live defect — deleting them destroys the record. The finding's live remainder, 86 distinct <our>.ts:<line> refs across 30 test files with the 283 JOUSTRV4.SRC:<line> ROM citations explicitly excluded, is filed as jt9-30.
