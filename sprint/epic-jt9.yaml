    description: |-
      MERGED 2026-08-03 into jt9-28 by the Architect grooming pass. This record is RETAINED, not deleted: 11 live references across sprint/ and plugins/joust/ name this id and must keep resolving, and this epic has already survived one renumbering. Its points moved with it (now 0 here, counted in jt9-28); its deliverable, its ROM citations and its acceptance bar now live in jt9-28, which carries a folded-in summary. WHY IT WAS MERGED: Its R11 finding and jt9-36 both widen the same read-set line in tests/audio-channel-role.test.ts, and both then correct written counts the widening newly catches. The full original text follows UNCHANGED below - it is the record jt9-28 points back at.
      Filed by jt9-7's Reviewer (2026-08-03) from a novel mutation battery of 11 (9 mutants + 2 controls) against the GREEN tree, none of them in TEA's 5-structural/8-prose battery or Dev's 6. jt9-7's shipped prose is TRUE — that was re-verified against the engine — and the AC1/AC2/AC3 executable tests are strong (R7, R9 and R10 below all reddened them). What is weak is the three AC4 PROSE guards in plugins/joust/tests/audio-channel-role.test.ts, each of which a false sentence walks straight through. Every string below is VERBATIM, was git-diffed before its verdict, and was restored from a cmp-verified snapshot. (1) R1, the absolute-ban `no sentence claims the channel stopped mattering ENTIRELY`: it filters on /no longer/i AND /(anything|nothing|at all)/i, so BOTH clauses are required. Insert `` * at all.`` after `` * routing power the map keeps.`` with the sentence `` * A shared channel buys and denies a cue nothing`` before it — i.e. the measured falsehood reworded without the words "no longer" — and all 2548 joust tests pass. This is the same falsehood jt9-7 was written to delete. FIX: drop the /no longer/ requirement, or add a second shape (channel/fence + absolute, no tense marker). (2) R2, the docblock guard `the CHANNELS docblock names the case where the channel still decides`: it filters for a sentence carrying /\bchannel\b/ AND /(window|released?|expires?|expired|tick)/ — KEYWORD CO-OCCURRENCE, not the claim. Replace jt9-7's three shipped lines with `` * window is released the channel is released with it, so a shared channel`` / `` * decides nothing about whose tail gets cut and the map keeps no routing power.`` and all 2548 pass — the guard is satisfied by the exact INVERSION of what it demands, which AC2's three tests disprove. FIX: this guard can only ever force a MENTION; say so in its message, and let the AC2 trio carry the claim (they do — R9 and R10 below prove it). (3) R4, the header count guard `the audio header's cue count is the number of cues there are`: the regex is /(?:these|those|all|the) (word) cues/, so a count with NO determiner is invisible. Alone that is caught by the positive precondition (R3: `for seventeen cues` with the determiner dropped reddens, because zero claims match). But with a correct decoy present it is not: replace `` // what the priority already decided for these eighteen cues; the map is kept`` with `` // what the priority already decided for seventeen cues; all eighteen cues stay`` + `` // routed either way, and the map is kept`` and all 2548 pass — a WRONG count ships because a RIGHT one two clauses later satisfies the precondition. FIX: match `(word) cues` with no determiner and exclude the known true pair-sentence by its own words, or assert on every number-word in the file. (4) R11, coverage: both count guards read only src/shell/audio.ts and src/main.ts. plugins/joust/src/shell/audio-manifest.ts carries two more live-code counts over the same 18-cue set — :96 "None is used today — all eighteen have one" and :575 "Three of these eighteen do exactly that" — and changing :96 to "all seventeen have one" leaves all 2548 green. Extend the guard to the whole of plugins/joust/src/ (and see jt9-36 for the test tree and tools/). CONTROLS that stayed GREEN and must keep doing so in any fix: an unrelated header sentence reworded, and an inert comment inserted inside the CHANNELS object. NOT a defect in shipped behaviour — file as test-strength work, full joust project only.
