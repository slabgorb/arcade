    type: chore
  - id: jt9-4
    title: The bake's synth-spec gate is itself unguarded — only the missing-outDir throw is pinned
    description: 'bakeSamples throws `no synth spec for manifest cue <name> — a new cue must arrive with its own sound` (plugins/joust/tools/sample-bake/bake-samples.mjs:305-306) and `no FRAME_DURATIONS entry for <name>` (:311). That gate is what makes `just deploy-assets` abort under set -euo pipefail rather than silently ship a manifest row with no audio — jt5-6 AC4 leaned on it directly. It is UNGUARDED: bake-samples.test.mjs:119 pins ONLY the missing-outDir throw (`await expect(bakeSamples()).rejects.toThrow()`), and nothing anywhere asserts the missing-spec or missing-duration throws. So the gate could be removed or weakened and every suite would stay green, while the next cue ships an unbaked .wav name into the bucket. Found by jt5-6 TEA, who could not pin it in that story: SOUNDS and SPECS are both module-scope consts in bake-samples.mjs, so exercising the throw needs an injectable manifest — either bakeSamples taking its manifest as an argument, or exporting SPECS. That refactor is this story. Prove it with a test that adds a cue with no spec and asserts the SPECIFIC message, not just that something threw.'
    points: 2
    priority: p1
    status: backlog
    repos: arcade
    workflow: tdd
  - id: jt9-5
    title: 'framesFor edge cases: an odd token count is silently dropped, and an invention cue reports the wrong bake error'
    description: 'Two edge cases in the jt5-6 derivation in plugins/joust/src/shell/audio-manifest.ts, both currently unreachable but both real. (1) framesInRow loops `for (let i = 0; i + 1 < pairs.length; i += 2)`, so a row with an ODD token count — a sound code with no duration operand — has its tail SILENTLY dropped and the cue window comes out short with no error. It is defended today only INDIRECTLY: every defining row is re-opened byte-exact by tests/audio-rom-citations.test.ts and every continuation row by tests/audio-transporter-split.test.ts, so a malformed row cannot match the vendored file. The defence is a different mechanism from the failure, which is why it is worth closing directly — throw on an odd count. (2) framesFor opens `if (source.kind !== rom) return 0` (:525), so an `invention` cue gets FRAME_DURATIONS 0; bake-samples.mjs:310-312 then tests `if (!(frames > 0))` and throws `no FRAME_DURATIONS entry` — but there IS an entry, it is 0 because the cue has no ROM table to size it. All 18 cues are kind:rom today so neither fires, but the invention arm exists precisely so a later story can use it, and that story hits a misleading error. Found by jt5-6 Reviewer.'
    points: 2
    priority: p1
