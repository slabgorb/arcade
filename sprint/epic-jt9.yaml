    title: 'The egg lifecycle in ONE re-baseline: an EGGWT wait, a hatching uncollected KILL egg, and EGGSCR scored to the victor on the kill'
    description: |-
      A joust kill spawns an egg through eggProcess (plugins/joust/src/core/demo.ts:824, spawned at :945) and that egg carries NO waveEgg: true tag. stepDemo's self-clear hatch (demo.ts:1194, jt4-5) matures ONLY wave eggs, so an uncollected kill-egg sits SETTLED with willHatch === true forever and the wave-clear gate (!enemiesLeft && !processes.some(egg), demo.ts:1226-1229) never opens while it lives. THIS IS A FIDELITY GAP, NOT A SOFT-LOCK — the distinction was measured twice on jt5-4 and the soft-lock reading is WRONG: at seed 0xbeef the stray egg settles at posX 219, pixel Y 128, the same platform and height as the idle player 2 nineteen pixels away; driving player 2 with a bare dir: 1 collects it at frame 1535 and clears the wave at frame 1614. All three seeds jt5-4's Dev called permanently stuck (0xbeef, 0x2468, 0x1a2b3c4d) reach wave 3 within 6000 frames once a player moves, and every settled kill-egg observed landed at a pixel Y a player is also observed standing on. So a moving player always CAN collect it; the gap is that the ROM does not require them to. Nothing in JOUSTRV4.SRC privileges a wave egg's maturation over a kill egg's — in the machine an uncollected egg hatches into a remounting buzzard regardless of provenance — so the restriction to waveEgg === true is the port's invention. KNOW THE BLAST RADIUS BEFORE STARTING: closing this turns FIVE pinned numbers red at once, all of them legitimate re-baselines and not regressions — fingerprint(0xbeef, 2400) and fingerprint(0x2468, 900) in plugins/joust/tests/audio-events.test.ts (both of which jt5-4 re-baselined onto runs that STALL at wave 1, so they currently certify a stalled run as expected), the third jt5-4 re-baseline in the same file, and entityDigest(0xbeef, 160) / entityDigest(0x2468, 200) in plugins/joust/tests/audio-thud.test.ts, which jt5-4's Reviewer froze from not.toEqual into exact toEqual pins. Re-baseline them deliberately and say so; do not treat the reds as a defect. ALSO NOTE: entityDigest(0x2468, 200) is currently one of only three guards on the SNPTHD register-role law, so re-baselining it removes a guard — check that plugins/joust/tests/audio-thud.test.ts's absolute 'OSTXTP sends REG.X up' assertions (added in jt5-4's rework round 2) are still present and still redden a role inversion before you touch the digest. Filed from jt5-4's Dev and Reviewer Delivery Findings, 2026-08-01.
      === MERGED 2026-08-03: jt9-10 AND THE EGG HALF OF jt9-12 FOLDED IN (Architect grooming pass) ===
      Three egg mechanisms, one file surface (core/egg.ts plus the demo.ts wave-clear gate), and ONE shared determinism re-baseline. Kept apart they re-baseline the SAME five pinned numbers three times over - fingerprint(0xbeef, 2400), fingerprint(0x2468, 900) and the third jt5-4 re-baseline in tests/audio-events.test.ts, plus entityDigest(0xbeef, 160) and entityDigest(0x2468, 200) in tests/audio-thud.test.ts. One sweep, stated once, is less work AND easier to audit than three sequential ones, where the second and third cannot be told from a nudge. Points 3 + 3 + 3 -> 7.
      FOLDED IN FROM jt9-10 - EGG SCORE ON THE KILL. EGGSCR has TWO call sites and this port models one. grep JSR EGGSCR in JOUSTRV4.SRC returns :3006 and :3021; jt8-4 wired :3021 (PLYEGG, the catch). The other is inside DEATH3: when a killed enemy transferred egg count decrements to zero (STA PEGG,Y / DEC PEGG,Y YOU CAN ONLY SQUEEZE SO MUCH BLOOD FROM AN EGG / BNE 1$, :3000-3002) the ROM does TFR Y,X / LDU ,S GET VICTORS WORKSPACE / BEQ 1$ / JSR EGGSCR SCORE EGG (:3003-3006). So an enemy LAST egg is scored to the victor immediately on the kill, bumping the DEGGS ladder with NO catch required. This port implements the decrement (spawnEgg eggsLeft minus 1, egg.ts:141) and treats eggsLeft zero as permadeath where hatchEgg returns null (egg.ts:273-275), but nothing ever scores it, so both the award and its ladder bump are silently dropped in play. NOTE THE VICTOR GUARD: BEQ skips when U is zero, because a lava death has no victor. Also makes claim JT84-003 incomplete, which states the collision IS the scoring trigger and there is no separate pickup step.
      FOLDED IN FROM jt9-12, EGG HALF ONLY - THE WAIT TIMER. Its TROLL half (LAVTIM/LAVGRA) went to jt9-11 instead, where beginGrip is. EGGWT (:3224, EGGLND LDA EGGWT GET CURRENT WAIT TIME - the settled egg wait before it hatches) and EGGWT2 (:2761, LDB EGGWT2 INITIAL EGG WAITING TIME). core/egg.ts models the fall, the settle, the hatch and the remount but carries NO wait timer of any kind, so per-wave egg-hatch pressure never reaches the player: the ROM walks EGGWT from $40 down to $10, so late-wave eggs hatch four times sooner.
      ORDER INSIDE THE STORY, and it is NOT the order above. Wire EGGWT/EGGWT2 first so the hatch has a timer to obey; then open the hatch to kill-eggs; then add the kill-scoring. LAND AS SEPARATE COMMITS with the re-baseline last and carrying its own message - merging the STORY does not merge the COMMITS, and this epic standing rule about fingerprint movers is about commits, not stories.
