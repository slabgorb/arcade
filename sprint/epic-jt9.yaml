stories:
  - id: jt9-1
    title: 'PJOY,U is an ENTRY ADDRESS: a glide wake skips LINET''s promotion check and its lava-troll looker'
    description: |-
      Two ROM behaviours live in the region of LINET that a GLIDE wake never executes, and jt5-8 made that region reachable. The scheduler enters a process with JSR [PJOY,U] (JOUSTRV4.SRC:5830, :5951, :6456 -- SM verified these are the ONLY three), so PJOY,U is an ENTRY ADDRESS, not merely state: after LNTUP parks #LNTOFP (:3746-3747), the next wake begins at :3759 and every instruction ABOVE it is skipped. jt5-8 modelled the state and the lane-decision bypass faithfully, but the port still runs the whole skipped prologue every wake. EVERY ROM CITATION IN THIS STORY WAS RE-OPENED AT SETUP against reference/williams-source/joust/JOUSTRV4.SRC and is exact, instruction for instruction.

      (1) THE PROMOTION CHECK. LNTSMT is reachable ONLY from LINET's own first three instructions (LDA NSMART / CMPA WSMART / BLO LNTSMT, :3722-3724). A wake entering at LNTOFP never executes them, so the machine CANNOT promote a dumb bird on its glide wake. The port promotes at plugins/joust/src/core/frame.ts:345 on every enemy wake regardless of pjoy. Found by Reviewer on jt5-8 (finding R-1).

      THE FIXTURE, CORRECTED AT SETUP -- READ THIS BEFORE SWEEPING. The repro is real and was reconfirmed, but ONLY on the IDLE-input replay, and the story as filed did not say so. SM swept 3000 frames x {0xbeef, 0x2468, 0xface} on four harnesses:
        * createGame + BOTH PLAYERS IDLE  -> 11 promotions, exactly 1 glide-carrying: seed 0x2468, frame 2688, process 514, promotes to boundr with pjoy {kind:'glide'}. This is the filed repro, and it is exact.
        * createGame + the `scripted` inputs (flap on frame%13, dir DIRS[frame%5]) -> 14 promotions, ZERO glide-carrying. On this harness proc 514 promotes at frame 1792 carrying nothing.
        * createWaveDemo + scripted -> 6 promotions, zero glide-carrying.
        * createWaveDemo + idle -> 10 promotions, zero glide-carrying.
      The trap: `scripted`/`inputsAt` is the vocabulary of every audio test in this plugin and the coordinate system all four re-baselined files live in, so it is the obvious harness to reach for -- and on it the finding looks STALE. Use idle inputs for the end-to-end pin. NON-VACUITY CONTROL, measured: glide is carried on 132-466 enemy-frames in every one of the four harnesses, so a zero is a real zero and not a blind sweep. The effect is RARE (1 promotion in 11), so the post-fix "count is ZERO" assertion needs a positive control or it passes on a broken sweep.

      (2) THE LAVA-TROLL LOOKER. :3725-3732 (DEC PLAVT,U / BGT / LDA LNTLAV / STA PLAVT,U / LDX PPREV / LDA PID,X / CMPA #LAVID / BEQ LNTUP) is a SECOND entry into the flapping wake: every LNTLAV wakes, a dumb bird with a lava troll immediately behind it in the process list flaps regardless of its lane. linet() implements only the lane decision at :3733-3757 and models none of this. It sits in the same skipped prologue, which is why the two belong in one story. Found by TEA on jt5-8; already pinned as an ORACLE test in plugins/joust/tests/dumb-wingbeat-source.test.ts so it cannot be re-discovered from scratch.

      DETERMINISM WARNING, and it is the expensive half. Both changes alter which frame a bird flaps or promotes on, so this WILL move the jt2 seeded-replay pins again -- the same 20-assertion, 4-file blast radius jt5-8 just re-baselined (audio-events, audio-thud, audio-flap, audio-transporter-split). Budget for it, and re-find every moved pin by sweeping for its OWN precondition, never by nudging a number toward the new output. sprint/archive/jt5-8-session.md records the method and the full moved-pin table; read it before starting. Do NOT land this together with jt9-8 (filed as jt5-9), which moves the same fingerprints for a different reason -- jt9-8 is still `backlog`, verified at setup.

      ALSO FOLDED IN -- jt5-8's FIVE unrouted Reviewer findings, not three. R-3, R-6, R-7 (all LOW, all cheap, all re-verified at their cited lines at setup): dumb-wingbeat-source.test.ts:126 and :155 are negative claims with no non-vacuity floor (:126 asserts only INSIDE a `for` over insnsIn(...), :155 compares a filtered list to []; an empty parse passes both); tests/helpers/enemy-contract.ts:250-253 still declares a THREE-variant pjoy ('wing'|'interval'|'dwell') and never gained 'glide'; audio-flap.test.ts:707-708 asserts `entity: e!` where e is genuinely EntityState|undefined and the stated precondition does not establish it.

      PLUS TWO THE SETUP FOUND UNROUTED (user ruled both IN, 2026-08-02):
        * R-2 (MEDIUM) -- the Reviewer wrote "file with R-1" and it was filed nowhere. AC3's promotion fence cannot fail: deleting `pjoy: undefined` from promote() (plugins/joust/src/core/enemy.ts:439, still present) left all 2463 joust tests green under mutation. This story DISPOSES of it rather than fencing it: SM measured that every promotion in all four harnesses entered carrying `none` or `glide` and NEVER 'interval'/'wing', so a dumb linet bird's pjoy is only ever those two -- once promotion is gated on the glide, `pjoy: undefined` in promote() is unreachable BY CONSTRUCTION. Delete it or re-comment it to say exactly that; do not build a fence for a branch that cannot be taken.
        * R-4 (LOW, and it is LIVE PROSE this story's own re-baseliner will read) -- audio-thud.test.ts:900-901 still says the person-thud seed scan found "0x2221 (f=1241), 0x2332, 0x310f and 0x3442 (all f=973) are the only hits". R-4 measured 36 of 400 seeds in [0x2200,0x2390) produce a player-thud, 20 of them at frame 973 -- ~9%, not four. The four named seeds are each individually correct and 0x2332 remains valid; the RARITY NARRATIVE is what is false, and this story is the one that re-opens that pin. Reword to what was actually swept, or drop the count. (jt9-2 is not the owner: its mechanism is line-ref -> symbol-ref conversion, which would not touch a false census claim.)
      R-5 needs no work: its only wrong text is in the archived jt5-8 Dev Assessment (dead history); the live pin at dumb-wingbeat.test.ts:491-493 already carries the correct 0xface 154/153.

      === MEASURED AT COMPLETION (2026-08-02) — TWO CLAIMS ABOVE ARE FALSE ===

      (A) THE DETERMINISM WARNING WAS WRONG. This story budgeted for "the same 20-assertion, 4-file blast radius jt5-8 just re-baselined". ZERO pins moved — not one fingerprint, frame anchor or entity digest. Measured delta: exactly ONE promotion shifted, seed 0x2468 process 514, frame 2688 -> 2690 (one wake at EMYTIM_SLOW), and that seed's audio anchors sit at frames 188/755/900, all ahead of it. The warning was reasoned by ANALOGY to jt5-8, which changed the wingbeat and so perturbed every dumb bird on every wake; this story changes only which wake a promotion lands on, and only when a glide is pending at that instant — once in 3000 frames across three seeds. Do not inherit "same subsystem, therefore same blast radius" from this story. (Checked at finish: jt9-18 is the only sibling using similar language and its expectation is CORRECT — it is a wingbeat change, jt5-8's shape.)

      (B) "IT SITS IN THE SAME SKIPPED PROLOGUE, WHICH IS WHY THE TWO BELONG IN ONE STORY" is true of LINET and hid that the looker is a FOUR-brain mechanism. The same eight instructions run in BOUNDR (:3787), B2UNDR (:3971) and SHADOW (:4230). LINET's looker shipped here correct, wired and mutation-guarded — and it CANNOT FIRE IN PLAY, because the troll's victim runs the dumb brain for one frame in 600 before promoting into a brain whose looker is unported. Filed as jt9-29, which is a blocker for this story's behaviour rather than completeness work.

      ALSO CORRECTED HERE, and not in the filing: LNTLAV is DYTBL row 3, which the port recorded as `dead-in-rom` on the reasoning that "its label appears exactly ONCE in JOUSTRV4.SRC" — true of the LABEL, false of the ROW. The DYTBL initialiser walks the table and the RAM block positionally (:939-950) and never reads a name, so row 3 fills the slot RAMDEF.SRC:391 calls LNTLAV, which four brains load. Two shipped tests were guarding the false claim. The dead-in-ROM category is now empty and a guard asserts it.
