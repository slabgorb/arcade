  - id: jt9-2
    title: 'Test-hygiene sweep: move the 27 legacy -source suites onto tests/helpers/claims.ts; comment-body line refs become symbol refs'
    description: "Two mechanical findings from jt8-3, one sweep, joust tests only — no production code. (1) TEA: 27 legacy -source suites still carry their own pre-hardening loadClaims/claimCovers copies now that tests/helpers/claims.ts exists (jt8-2's \"3x\" note undercounted — it is 28 definitions); replace each copy with an import of the hardened loader. homing-source.test.ts is the refactor template (moved onto the helper during jt8-3, 78/78 green). (2) Reviewer: comment-body enemy.ts:<line> refs go stale every time the file grows — audio-flap.test.ts:536 (\"enemy.ts:540\") and difficulty-wiring.test.ts:27 (\"enemy.ts:115/118\") were stale BEFORE jt8-3 (verified against b84b5d4) and have drifted further; replace comment-body line refs with symbol refs. The Reviewer explicitly suggested folding (2) into the same sweep as (1)."
