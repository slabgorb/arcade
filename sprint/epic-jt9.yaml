  - id: jt9-16
    title: The two thud paths return OPPOSITE carry — the ROM's collision scan continues after SNETHD and ABORTS after SNPTHD
    description: "The ROM's two thud continuations return OPPOSITE carry, and this port's pair loop models neither. SNETHD's path ends OSTH11 -> 'JMP HITEM2' (JOUSTRV4.SRC:5029), and HITEM2 clears carry with 'ANDCC #$FE' (:4947). SNPTHD's path ends OSTXTT -> 'BRA OSTX12' (:5054), and OSTX12 SETS carry with 'ORCC #$01' (:5059), commented 'REG.U GUY IS DEAD, GET NEXT REG.U GUY'. The scan driver reads that carry at ':4886 BCS 20$' and restarts the outer walk. So on the machine the collision scan for the current object CONTINUES after an enemy thud and ABORTS after a person-involved tie — the tie consumes the object's whole remaining scan even though NOBODY DIED, which is the surprising part and the reason this is worth porting rather than dismissing. Our inner loop (plugins/joust/src/core/demo.ts, 'for (let j = i + 1; j < eligible.length; j++)') does neither: it always continues, for both cues. OBSERVABILITY: only a three-or-more entity pile-up can tell the two apart — with exactly two eligible entities the inner loop has nothing left to visit either way — so a fixture needs a person tie plus a third body still overlapping the same object on the same frame. A wave-6 swarm reaches that in ordinary play; jt5-4's two-body fixtures could not, which is why it was descoped rather than guessed. VERIFY THE PORT DIRECTION BEFORE IMPLEMENTING: read :4885-4886 and :4867-4890 to confirm 'BCS 20$' restarts at the OUTER walk (20$, a fresh 'LDU PLINK,U' at :4874) and not the inner one, because a break of the inner loop and a restart of the outer are different behaviours and only one of them is the machine's. EXPECT A DETERMINISM RE-BASELINE if the abort turns out to suppress contacts that currently resolve. Filed from jt5-4's TEA Delivery Finding, 2026-08-01."
