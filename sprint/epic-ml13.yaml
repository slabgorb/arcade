id: ml13
type: epic
title: Millipede segment-kill scoring & mushroom fidelity (ml12-3 follow-ups)
description: "Three follow-ups surfaced during ml12-3 review (DDT cloud kills segments). The DDT-kill path is now ROM-faithful (body 30 / head 300), but the sibling segment-kill behaviours still diverge from MILLI.MAC: (1) neither the shot-kill nor the DDT-kill path plants a mushroom (MUSHER) at the dead cell as the ROM does, so killed trains don't thicken the mushroom field; (2) the shot-kill scores a flat SEGMENT_PTS=10 with no head/body split (ROM: body 10 / head 100), now asymmetric with the DDT path's 30/300; (3) ml12-3 AC3's live /millipede/ playtest was never performed (the kill is unit-proven via the real-explosion test and strobe-safe by construction, but not observed live). All fixes cite the millipede ROM (MILLI.MAC / MLSUB.MAC, .RADIX 16) and gate constants via citations.test.ts."
