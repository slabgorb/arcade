<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Slabcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #000;
        --fg: #00eaff;
        --dim: #4fb8cc;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; }

      body {
        background: var(--bg);
        color: #dff;
        font-family: 'Vector Battle', 'Orbitron', monospace;
      }

      /* The cabinet: everything lives inside it. */
      .cabinet {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
      }

      /* ---- Cabinet furniture (decoration only) --------------------------------
         Every decorative layer carries .chrome, and .chrome is pointer-events: none.
         This is not a nicety: a full-bleed grid floor with a z-index and no
         pointer-events rule produces a screen that looks perfect in a screenshot and
         is completely dead to the mouse — every tile unclickable, with nothing on
         fire to tell you why. It is also aria-hidden, because none of it is content. */
      .chrome { pointer-events: none; }

      /* Double-mirror cabinet art: a receding vector grid floor plus its mirrored
         ceiling. The bottom trench is the Battlezone/Star Wars horizon; the top is
         its reflection through the half-silvered combiner the real cabinets used. */
      .grid-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .grid-floor,
      .grid-ceiling {
        position: absolute;
        left: -50%;
        width: 200%;
      }

      .grid-floor {
        bottom: -2px;
        height: 46vh;
        transform: perspective(340px) rotateX(74deg);
        transform-origin: bottom center;
        background-image:
          repeating-linear-gradient(90deg, transparent 0 63px, rgba(0, 234, 255, 0.55) 63px 64px),
          repeating-linear-gradient(0deg, transparent 0 47px, rgba(0, 234, 255, 0.45) 47px 48px);
        -webkit-mask-image: linear-gradient(to top, #000 6%, transparent 82%);
        mask-image: linear-gradient(to top, #000 6%, transparent 82%);
        filter: drop-shadow(0 0 3px rgba(0, 234, 255, 0.5));
      }

      /* Dimmer than the floor: it is a reflection, not a second floor. */
      .grid-ceiling {
        top: -2px;
        height: 34vh;
        transform: perspective(340px) rotateX(-74deg);
        transform-origin: top center;
        background-image:
          repeating-linear-gradient(90deg, transparent 0 63px, rgba(0, 234, 255, 0.3) 63px 64px),
          repeating-linear-gradient(0deg, transparent 0 47px, rgba(0, 234, 255, 0.24) 47px 48px);
        -webkit-mask-image: linear-gradient(to bottom, #000 2%, transparent 74%);
        mask-image: linear-gradient(to bottom, #000 2%, transparent 74%);
        filter: drop-shadow(0 0 3px rgba(0, 234, 255, 0.35));
      }

      /* Bezel: four L-shaped brackets that frame the screen like a cabinet's mask. */
      .bezel {
        position: fixed;
        width: 46px;
        height: 46px;
        z-index: 3;
        box-shadow: 0 0 8px rgba(0, 234, 255, 0.5);
      }
      .bezel-tl {
        top: 20px;
        left: 20px;
        border-top: 2px solid rgba(0, 234, 255, 0.7);
        border-left: 2px solid rgba(0, 234, 255, 0.7);
      }
      .bezel-tr {
        top: 20px;
        right: 20px;
        border-top: 2px solid rgba(0, 234, 255, 0.7);
        border-right: 2px solid rgba(0, 234, 255, 0.7);
      }
      .bezel-bl {
        bottom: 20px;
        left: 20px;
        border-bottom: 2px solid rgba(0, 234, 255, 0.7);
        border-left: 2px solid rgba(0, 234, 255, 0.7);
      }
      .bezel-br {
        bottom: 20px;
        right: 20px;
        border-bottom: 2px solid rgba(0, 234, 255, 0.7);
        border-right: 2px solid rgba(0, 234, 255, 0.7);
      }

      /* Screen curvature: the glass darkens toward the corners. */
      .vignette {
        position: fixed;
        inset: 0;
        z-index: 4;
        background: radial-gradient(
          120% 120% at 50% 50%,
          transparent 55%,
          rgba(0, 0, 0, 0.55) 80%,
          #000 100%
        );
      }

      /* ---- Content ------------------------------------------------------------ */
      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: clamp(1.8rem, 4vh, 2.8rem);
        max-width: 74rem;
        margin: 0 auto;
        padding: clamp(3rem, 7vh, 5rem) 5vw clamp(2.5rem, 6vh, 4rem);
      }

      /* Direction 1a's header: the wordmark on the left, the fan-tribute line on the
         right, over a single hairline rule — the "everything above the fold" masthead
         the grid hangs under. On a narrow screen the two stack and centre. */
      .marquee {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: clamp(1rem, 4vw, 2.5rem);
        width: 100%;
        border-bottom: 1px solid rgba(0, 234, 255, 0.28);
        padding-bottom: clamp(0.9rem, 2vh, 1.3rem);
      }

      /* The wordmark is spread letter-by-letter across the marquee — each glyph is
         its own span, justified apart. It carries an aria-label because otherwise a
         screen reader announces "SLABCADE", or spells it out one letter at a
         time; the visual trick must not cost the page its name. */
      .wordmark {
        margin: 0;
        display: flex;
        gap: 0.16em;
        font-weight: 900;
        font-size: clamp(1.9rem, 6vw, 3.4rem);
        line-height: 0.9;
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow:
          0 0 6px #fff,
          0 0 20px var(--fg),
          0 0 46px var(--fg),
          0 0 80px rgba(0, 234, 255, 0.6);
      }

      /* The fan-tribute disclaimer, now the masthead's right-hand line rather than a
         separate footer (direction 1a folds it up here). It stays the page's one legal
         line — "NOT AFFILIATED" — so nothing that reads the body text loses it. */
      .disclaimer {
        margin: 0 0 0.4rem;
        max-width: 22em;
        text-align: right;
        font-family: 'Share Tech Mono', 'Orbitron', monospace;
        font-size: clamp(0.5rem, 1vw, 0.62rem);
        line-height: 1.7;
        letter-spacing: 0.24em;
        color: var(--dim);
        text-shadow: 0 0 5px rgba(0, 234, 255, 0.35);
      }

      /* The cabinet grid: one 4-column board that holds the live showcase as a 2×2
         featured cell and every game tile around it. The showcase and the tiles are
         laid out TOGETHER here — that is what "the showcase folded into the grid"
         means — so #games carries `display: contents`, letting its tile anchors
         become grid items of THIS grid instead of stacking inside a box of their own.
         (display:contents keeps the <nav aria-label="Games"> landmark in every current
         browser while dropping only its box.) */
      .cabinet-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: clamp(8rem, 14vw, 11rem);
        gap: clamp(0.8rem, 1.5vw, 1.1rem);
        width: 100%;
      }

      .games { display: contents; }

      /* ---- Showcase pane ------------------------------------------------------
         One live game, framed, cycling — now the featured 2×2 cell at the top-left of
         the board. Content, NOT chrome: it must keep pointer-events so its launch link
         works. The per-game glow arrives as --glow, set from the registry entry by the
         shell, exactly as the tiles do it. */
      .showcase {
        --glow: var(--fg);
        grid-column: span 2;
        grid-row: span 2;
        position: relative;
        border: 1.5px solid var(--glow);
        border-radius: 3px;
        background:
          repeating-linear-gradient(
            135deg,
            color-mix(in srgb, var(--glow) 14%, transparent) 0 6px,
            transparent 6px 12px
          ),
          #000;
        box-shadow:
          0 0 22px color-mix(in srgb, var(--glow) 45%, transparent),
          inset 0 0 26px color-mix(in srgb, var(--glow) 12%, transparent);
        overflow: hidden;
      }

      /* Before main.ts runs — or forever, if the bundle fails to boot — this is
         an empty bordered box, which is exactly the silent degrade this feature
         exists to prevent (see shell/showcase.ts's header comment). `replaceChildren`
         un-hides it the instant anything mounts, and `retire()` removes the section
         outright, so this only ever applies to the un-bootstrapped state. */
      .showcase:empty {
        display: none;
      }

      /* Starts invisible and fades in on its own `load`. That is the whole
         transition: no timer, no crossfade, and the black pane covers the load
         flash for free. */
      .showcase-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .showcase-frame.is-loaded { opacity: 1; }

      /* The click shield, and a real link. Covers the frame so the pointer never
         reaches the game. */
      .showcase-launch {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: block;
      }

      /* Negative offset, unlike .tile's +3px: .showcase clips overflow, and the
         launch link's border box IS the clip rect, so an outward-drawn ring is
         discarded by the clip before it ever paints. Drawing the ring 3px INSIDE
         the box is the only way a keyboard visitor sees it at all. */
      .showcase-launch:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -3px;
      }

      /* The featured cell's bottom bar: the "NOW SHOWING · <game>" caption shell/
         showcase.ts writes, drawn as the lit label strip direction 1a puts under the
         attract screen. pointer-events stays none so the launch link beneath still
         catches the click across the whole cell. */
      .showcase-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        pointer-events: none;
        padding: 0.85rem 1.1rem;
        font-family: 'Share Tech Mono', 'Orbitron', monospace;
        font-size: clamp(0.62rem, 1.3vw, 0.82rem);
        letter-spacing: 0.2em;
        color: var(--glow);
        border-top: 1px solid color-mix(in srgb, var(--glow) 40%, transparent);
        background: linear-gradient(
          rgba(0, 0, 0, 0),
          color-mix(in srgb, var(--glow) 8%, rgba(0, 0, 0, 0.55))
        );
        text-shadow: 0 0 6px currentColor;
      }

      /* Shown instead of the frame when the visitor has asked for reduced motion. */
      .showcase-reveal {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        padding: 0.7rem 1.4rem;
        font-family: 'Orbitron', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.24em;
        color: var(--glow);
        background: color-mix(in srgb, var(--glow) 6%, #000);
        border: 1.5px solid var(--glow);
        border-radius: 3px;
        cursor: pointer;
        text-shadow: 0 0 6px currentColor;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      /* ---- Tiles --------------------------------------------------------------
         Each tile is a real link and a cell in the cabinet grid. The per-game glow
         colour arrives as --glow, set from the registry entry, and everything inside
         inherits it. The hatch fill and the corner-pinned WIP badge are direction 1a's
         cabinet look. */
      .tile {
        --glow: var(--fg);
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.4rem;
        padding: 1rem 1.1rem;
        text-decoration: none;
        color: var(--glow);
        background:
          repeating-linear-gradient(
            135deg,
            color-mix(in srgb, var(--glow) 9%, transparent) 0 5px,
            transparent 5px 10px
          ),
          linear-gradient(color-mix(in srgb, var(--glow) 5%, transparent), #000);
        border: 1.5px solid var(--glow);
        border-radius: 3px;
        box-shadow:
          0 0 10px color-mix(in srgb, var(--glow) 40%, transparent),
          inset 0 0 14px color-mix(in srgb, var(--glow) 10%, transparent);
        overflow: hidden;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          background 0.12s ease;
      }

      .tile:hover,
      .tile:focus-visible {
        transform: translateY(-3px) scale(1.02);
        box-shadow:
          0 0 22px color-mix(in srgb, var(--glow) 75%, transparent),
          inset 0 0 22px color-mix(in srgb, var(--glow) 20%, transparent);
      }

      /* The tile is keyboard-reachable, so it must be keyboard-VISIBLE. The lift on
         :focus-visible alone is not a focus indicator — a white ring is. */
      .tile:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      .tile:active { transform: scale(0.98); }

      /* Sized to fit the LONGEST registry title ("MISSILE COMMAND", 15 chars) inside a
         4-column cell without clipping. The design special-cased that one title's font
         size in its hardcoded markup; our titles come from the registry as ordinary
         strings, so the size is set once here for all of them. Wrapping is allowed as a
         safety net — at this size every current title stays on one line, but a longer
         future one wraps upward into the cell (content is bottom-aligned) rather than
         being cut off by the tile's overflow clip. */
      .tile-title {
        font-family: 'Vector Battle', 'Orbitron', monospace;
        font-weight: 700;
        font-size: clamp(0.95rem, 1.7vw, 1.2rem);
        letter-spacing: 0.08em;
        overflow-wrap: anywhere;
        text-shadow:
          0 0 5px currentColor,
          0 0 14px currentColor;
      }

      .tile-score {
        font-family: 'Share Tech Mono', 'Orbitron', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        opacity: 0.85;
        text-shadow: 0 0 6px currentColor;
      }

      .tile-version {
        font-family: 'Orbitron', monospace;
        font-size: 0.55rem;
        letter-spacing: 0.2em;
        opacity: 0.5;
        text-shadow: 0 0 5px currentColor;
      }

      .tile-controls {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        font-family: 'Orbitron', monospace;
        font-size: 0.56rem;
        letter-spacing: 0.04em;
        opacity: 0.6;
      }

      /* WIP badge: pinned to the cell's top-right corner, drawn as an outlined chip in
         the game's own glow. Only present on pre-1.0 games (shell/tiles.ts). */
      .tile-wip {
        position: absolute;
        top: 0.7rem;
        right: 0.7rem;
        font-family: 'Share Tech Mono', 'Orbitron', monospace;
        font-size: 0.55rem;
        letter-spacing: 0.2em;
        padding: 0.12rem 0.4rem;
        border: 1px solid color-mix(in srgb, var(--glow) 55%, transparent);
        border-radius: 2px;
        opacity: 0.9;
        text-shadow: none;
      }

      /* ---- Responsive ---------------------------------------------------------
         Wide: 4 columns with the featured cell 2×2. Medium: 2 columns, featured still
         2×2 (full width, two rows). Narrow: a single column, and the featured cell
         relaxes to one full-width 16:9 pane so it never demands a phantom second
         column. */
      @media (max-width: 60rem) {
        .cabinet-grid { grid-template-columns: repeat(2, 1fr); }
      }

      @media (max-width: 34rem) {
        .cabinet-grid {
          grid-template-columns: 1fr;
          grid-auto-rows: minmax(7rem, auto);
        }
        .showcase {
          grid-column: 1 / -1;
          grid-row: auto;
          aspect-ratio: 16 / 9;
        }
        .marquee {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .disclaimer { text-align: center; }
      }

      /* The tile lift on hover/focus is a transition; if the player has asked the OS
         to stop motion, hold the tiles still. */
      @media (prefers-reduced-motion: reduce) {
        .tile {
          transition: none;
        }

        .showcase-frame {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="cabinet">
      <!-- Cabinet furniture. Decoration only: pointer-events: none, aria-hidden,
           and never in the tab order. -->
      <div class="grid-layer chrome" aria-hidden="true">
        <div class="chrome grid-floor" data-chrome="grid-floor"></div>
        <div class="chrome grid-ceiling" data-chrome="grid-ceiling"></div>
      </div>

      <div class="chrome bezel bezel-tl" data-chrome="bezel" aria-hidden="true"></div>
      <div class="chrome bezel bezel-tr" data-chrome="bezel" aria-hidden="true"></div>
      <div class="chrome bezel bezel-bl" data-chrome="bezel" aria-hidden="true"></div>
      <div class="chrome bezel bezel-br" data-chrome="bezel" aria-hidden="true"></div>

      <div class="chrome vignette" data-chrome="vignette" aria-hidden="true"></div>

      <div class="content">
        <header class="marquee">
          <h1 class="wordmark" aria-label="SLABCADE">
            <span aria-hidden="true">S</span>
            <span aria-hidden="true">L</span>
            <span aria-hidden="true">A</span>
            <span aria-hidden="true">B</span>
            <span aria-hidden="true">C</span>
            <span aria-hidden="true">A</span>
            <span aria-hidden="true">D</span>
            <span aria-hidden="true">E</span>
          </h1>
          <p class="disclaimer">
            A&nbsp;FAN-MADE&nbsp;TRIBUTE&nbsp;TO&nbsp;THE&nbsp;80's ARCADE&nbsp;ERA&nbsp;&nbsp;&middot;&nbsp;&nbsp;NOT&nbsp;AFFILIATED
          </p>
        </header>

        <!-- The cabinet board. The live showcase is the featured 2×2 cell; the tiles
             #games builds flow around it as grid items (see .games display:contents). -->
        <div class="cabinet-grid">
          <!-- One live game, framed and cycling. Filled by main.ts; it removes
               itself if no game has opted in or every frame fails to load. -->
          <section id="showcase" class="showcase"></section>

          <!-- Filled from the registry by main.ts. Never hardcoded: a game reaches the
               cabinet by declaring plugins/<id>/plugin.ts and regenerating
               src/host/registry.ts (`npm run gen:registry`), and by nothing else. -->
          <nav id="games" class="games" aria-label="Games"></nav>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
